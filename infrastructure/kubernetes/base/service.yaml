# Consultify Kubernetes Services
# Exposes deployments within the cluster

apiVersion: v1
kind: Service
metadata:
  name: consultify-api
  labels:
    app: consultify
    component: api
spec:
  type: ClusterIP
  ports:
    - port: 3001
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app: consultify
    component: api
---
apiVersion: v1
kind: Service
metadata:
  name: consultify-frontend
  labels:
    app: consultify
    component: frontend
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app: consultify
    component: frontend
---
# Headless service for direct pod access (useful for debugging)
apiVersion: v1
kind: Service
metadata:
  name: consultify-api-headless
  labels:
    app: consultify
    component: api
spec:
  type: ClusterIP
  clusterIP: None
  ports:
    - port: 3001
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app: consultify
    component: api





