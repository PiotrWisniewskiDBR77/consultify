# Kustomize base configuration
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

metadata:
  name: consultify-base

resources:
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - hpa.yaml

commonLabels:
  app.kubernetes.io/name: consultify
  app.kubernetes.io/managed-by: kustomize

configMapGenerator:
  - name: consultify-config
    literals:
      - NODE_ENV=production
      - PORT=3001
      - LOG_LEVEL=info

