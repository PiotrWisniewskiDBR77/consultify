<html lang="en" class="dark">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Consultify — Transformation AI Consulting Platform</title>
  <meta name="description" content="Consultify combines human governance with AI acceleration to transform enterprise strategy, PMO, and decision-making. Trusted by organizations worldwide." />
  <meta name="theme-color" content="#0b1c2d" />

  <!-- OpenGraph -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Consultify — Transformation AI Consulting Platform" />
  <meta property="og:description" content="Consultify combines human governance with AI acceleration to transform enterprise strategy, PMO, and decision-making." />
  <meta property="og:image" content="/assets/og-share.png" />
  <meta property="og:url" content="https://consultinity.com" />
  <meta property="og:site_name" content="Consultify" />

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Consultify — Transformation AI Consulting Platform" />
  <meta name="twitter:description" content="Consultify combines human governance with AI acceleration to transform enterprise strategy, PMO, and decision-making." />
  <meta name="twitter:image" content="/assets/og-share.png" />

  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
  <link rel="apple-touch-icon" sizes="192x192" href="/icons/icon-192.png" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+JP:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <script>
    (function () {
      var isProductionHost =
        location.hostname === 'consultify.ai' ||
        location.hostname === 'www.consultify.ai';
      if (!isProductionHost) return;

      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function (registrations) {
          registrations.forEach(function (registration) {
            registration.unregister().catch(function () {});
          });
        });
      }

      if ('caches' in window) {
        caches.keys().then(function (keys) {
          keys.forEach(function (key) {
            if (key.indexOf('consultify-') === 0) {
              caches.delete(key).catch(function () {});
            }
          });
        });
      }
    })();
  </script>

</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/index.tsx"></script>
</body>

</html>
