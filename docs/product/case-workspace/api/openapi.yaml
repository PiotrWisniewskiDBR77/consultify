      responses:
        '200':
          description: Decisions.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/ApprovalDecisionRecord' } }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  /proposals/{actionProposalId}/submit-for-review:
    parameters:
      - $ref: '#/components/parameters/ActionProposalId'
    post:
      tags: [Action proposals]
      operationId: submitActionProposalForReview
      summary: DRAFT → PENDING_REVIEW.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExpectedVersionBody' }
      responses:
        '200': { $ref: '#/components/responses/ProposalOk' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalError' }

  /proposals/{actionProposalId}/decision:
    parameters:
      - $ref: '#/components/parameters/ActionProposalId'
    post:
      tags: [Action proposals]
      operationId: recordApprovalDecision
      summary: Record an APPROVE / REJECT / REQUEST_CHANGES / DEFER decision.
      description: |
        Carries `proposalVersion` + `payloadDigest` + an idempotency key, per
        CW-GR-028. A digest that no longer matches the proposal fails
        `409 PROPOSAL_PAYLOAD_DIGEST_CONFLICT`; a stale `expectedVersion` fails
        `409 PROPOSAL_VERSION_CONFLICT` with no side effect. A decision by the
        proposal's own creator fails `403 SELF_APPROVAL_FORBIDDEN`.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RecordApprovalDecisionBody' }
      responses:
        '200':
          description: Decision recorded; proposal readback plus the decision row.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/RecordApprovalDecisionResult' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '403': { $ref: '#/components/responses/OrgRoleDenied' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
