    post:
      tags: [Action proposals]
      operationId: revokeApprovedProposal
      summary: APPROVED → REVOKED before execution starts.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReasonAndExpectedVersionBody' }
      responses:
        '200': { $ref: '#/components/responses/ProposalOk' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
