      parameters:
        - { in: query, name: status, required: false, schema: { $ref: '#/components/schemas/ActionProposalStatus' } }
      responses:
        '200': { $ref: '#/components/responses/ProposalListOk' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  /runs/{runId}/proposals:
    parameters:
