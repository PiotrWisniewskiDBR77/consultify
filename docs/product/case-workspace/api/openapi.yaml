                properties:
                  data: { $ref: '#/components/schemas/CaseHistoryEvent' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  /cases/{caseId}/value-measurements:
    parameters:
      - $ref: '#/components/parameters/CaseId'
    post:
      tags: [Case history]
      operationId: recordValueMeasurement
      summary: Record one value/benefit measurement point.
