  # ===========================================================================
  # play.routes.ts — playService
  # ===========================================================================

  /process-definitions:
    post:
      tags: [Plays]
      operationId: createProcessDefinition
      summary: Create a PRIVATE process definition (Play).
      description: |
        `organizationId` is forced to the authenticated org; `ownerActorId`
        defaults to the authenticated user.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, minLength: 1 }
                description: { type: string, minLength: 1, nullable: true }
                ownerActorId: { type: string, minLength: 1 }
      responses:
        '201': { $ref: '#/components/responses/ProcessDefinitionCreated' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '403': { $ref: '#/components/responses/OrgRoleDenied' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '500': { $ref: '#/components/responses/InternalError' }
    get:
      tags: [Plays]
      operationId: listProcessDefinitions
      summary: List process definitions — the ONE natively cursor-paginated list.
      description: |
        Returns `{ data, nextCursor }` (not the bare `{ data }` envelope). The
        cursor is opaque, keyed `createdAt::processDefinitionId` over
        `ORDER BY created_at DESC, process_definition_id DESC`. Tenant-scoped
        to the authenticated org.
      parameters:
        - { in: query, name: visibility, required: false, schema: { $ref: '#/components/schemas/ProcessDefinitionVisibility' } }
        - { in: query, name: ownerActorId, required: false, schema: { type: string, minLength: 1 } }
        - { in: query, name: cursor, required: false, schema: { type: string, minLength: 1 } }
        - { in: query, name: limit, required: false, schema: { type: integer, minimum: 1, maximum: 200 } }
      responses:
        '200':
          description: One page of process definitions.
          content:
            application/json:
              schema:
                type: object
                required: [data, nextCursor]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/ProcessDefinition' } }
                  nextCursor: { type: string, nullable: true }
        '400': { $ref: '#/components/responses/ValidationError' }
        '403': { $ref: '#/components/responses/OrgRoleDenied' }
        '500': { $ref: '#/components/responses/InternalError' }

  /process-definitions/{processDefinitionId}:
    parameters:
      - $ref: '#/components/parameters/ProcessDefinitionId'
    get:
      tags: [Plays]
      operationId: getProcessDefinition
      summary: Fetch one process definition.
      description: |
        **KNOWN DEFECT CW-SEC-ENUM-PLAYS-01 — this endpoint is NOT
        enumeration-safe today.** `play.routes.ts` intends a uniform `404` for a
        definition owned by another organization, but
        `playService.getProcessDefinition` (playService.ts:761-763) lets
        `requireOrgMember` throw before the route's org-match check runs. The
        observable result: `403 NOT_ORG_MEMBER` when the id EXISTS in another
        tenant, `404 PROCESS_DEFINITION_NOT_FOUND` when it does not — a working
        cross-tenant existence oracle. Pinned by
        `errorAndAuthz.contract.pg.test.ts` → "KNOWN DEFECT CW-SEC-ENUM-PLAYS-01".
        The correct pattern is `migrationReadinessService.
        getQuarantinedLegacyRecord` (catch `CaseWorkspaceAuthError` → return
        null). When fixed, drop the `403` below.
      responses:
        '200': { $ref: '#/components/responses/ProcessDefinitionOk' }
        '403': { $ref: '#/components/responses/OrgRoleDenied' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  /process-definitions/{processDefinitionId}/publisher-check:
    parameters:
      - $ref: '#/components/parameters/ProcessDefinitionId'
    get:
      tags: [Plays]
      operationId: isAuthorizedPublisher
      summary: Whether the caller may publish shared versions in this org.
      responses:
        '200':
          description: Publisher eligibility.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [authorized]
                    properties:
                      authorized: { type: boolean }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  /process-definitions/{processDefinitionId}/share:
    parameters:
      - $ref: '#/components/parameters/ProcessDefinitionId'
    post:
      tags: [Plays]
      operationId: shareProcessDefinition
      summary: Widen visibility to TEAM or ORGANIZATION.
      description: |
        Sharing requires at least one PUBLISHED version
        (`409 PROCESS_DEFINITION_SHARE_REQUIRES_PUBLISHED_VERSION`) and the
        reviewed publisher role (`403 PROCESS_DEFINITION_SHARE_NOT_AUTHORIZED`).
        Narrowing visibility fails `409 *_NOT_A_WIDENING`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [targetVisibility, expectedVersion]
              properties:
                targetVisibility: { type: string, enum: [TEAM, ORGANIZATION] }
                expectedVersion: { type: integer }
      responses:
        '200': { $ref: '#/components/responses/ProcessDefinitionOk' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '403': { $ref: '#/components/responses/OrgRoleDenied' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalError' }

