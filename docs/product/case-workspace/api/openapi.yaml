        '500': { $ref: '#/components/responses/InternalError' }

  /artifact-links/{linkId}/open:
    parameters:
      - $ref: '#/components/parameters/LinkId'
    get:
      tags: [Artifact links]
      operationId: resolveArtifactLinkOpen
      summary: Resolve the canonical deep-link target and Case return context for one link.
      description: |
        Backs the "otwórz w module źródłowym / wróć do Case" round trip
        (SCOPE_ADJUDICATION.md Golden Case list item 12, previously
        PARTIAL — no case-workspace API call existed for either
        navigation direction).

        Returns exactly (`artifactType`, `artifactId`, `artifactRevision`)
        as the deep-link target — CW-RT-024's own stated minimum "enough to
        construct a deep link into the owning module" — plus one of four
        explicit `state` values and a `returnContext` the client uses to
        restore the Case's own view:

        - `AVAILABLE` — `link_status='ACTIVE'`, not stale; `deepLink` is
          populated.
        - `STALE` — `link_status='ACTIVE'`, `is_stale=true`; `deepLink` is
          still populated (the pinned revision is behind, not gone), plus
          `staleReason`/`staleMarkedAt`.
        - `UNAVAILABLE` — `link_status='UNAVAILABLE'` (the module confirmed
          the source is gone, CW-03-017); `deepLink` is `null`, plus
          `unavailableReason`/`unavailableMarkedAt`.
        - `DELETED` — `link_status='UNLINKED'` (the Case-side reference was
          removed); `deepLink` is `null`, plus `unlinkReason`/`unlinkedAt`.

        A linkId the actor has no Case access to is **indistinguishable**
        from a linkId that does not exist (SEC-009 / CW-DOD-D6): both return
        the same `404 ARTIFACT_LINK_NOT_FOUND`, never a distinct
        "unauthorized" status or body shape that would leak cross-tenant
        existence.

        `returnContext.casePhase` is `case_core.case_status`.
        `returnContext.resultsGroup` is a deterministic mapping from this
        link's `relation` onto doc 02 §7's five Rezultaty groups (key
        findings and recommendations / decisions / native deliverables /
        effect and value / evidence and lineage) — the closest concept this
        service can honestly resolve to doc 03 §5's "same Case phase and
        selected step" without reading any execution-graph/plan-step table
        outside this service's own scope.
      responses:
        '200':
          description: Deep-link resolution.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/ArtifactLinkOpenResolution' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  /artifact-links/{linkId}/pin:
    parameters:
      - $ref: '#/components/parameters/LinkId'
    post:
      tags: [Artifact links]
      operationId: pinArtifactRevision
      summary: Pin the link to an exact artifact revision (append-only history).
      requestBody:
