        '200': { $ref: '#/components/responses/ProposalOk' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalError' }

  /proposals/{actionProposalId}/retry:
    parameters:
      - $ref: '#/components/parameters/ActionProposalId'
    post:
      tags: [Action proposals]
      operationId: retryProposalFromFailed
      summary: FAILED → EXECUTING (retry of an approved action).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExpectedVersionBody' }
