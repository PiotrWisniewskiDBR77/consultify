  # ---------------------------------------------------------------------------
  schemas:
  # ---------------------------------------------------------------------------

    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        status: { type: string, enum: [fail, error] }
        correlationId: { type: string, nullable: true }
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: |
                SCREAMING_SNAKE upper-casing of the domain service's own
                snake_case code, or `VALIDATION_ERROR` / `INTERNAL_ERROR`.
            message: { type: string }
            issues:
              type: array
              description: Present on VALIDATION_ERROR only.
              items:
                type: object
                properties:
                  path: { type: string }
                  message: { type: string }
                  code: { type: string }
          additionalProperties: true

    # -- shared request bodies --------------------------------------------------
    ExpectedVersionBody:
      type: object
      required: [expectedVersion]
      properties:
        expectedVersion: { type: integer }
    ReasonAndExpectedVersionBody:
      type: object
      required: [reason, expectedVersion]
      properties:
        reason: { type: string, minLength: 1 }
        expectedVersion: { type: integer }
    ReasonOnlyBody:
      type: object
      properties:
        reason: { type: string, minLength: 1, nullable: true }

    # -- enums ------------------------------------------------------------------
    CaseProfile: { type: string, enum: [LIGHT, STANDARD, TRANSFORMATION, MONITORING] }
    GovernanceTier: { type: string, enum: [LIGHTWEIGHT, STANDARD, CONTROLLED] }
    AutonomyPolicy: { type: string, enum: [ASK_EACH_ACTION, ASK_MATERIAL_ACTIONS, EXECUTE_APPROVED_PLAN] }
    CaseStatus: { type: string, enum: [DRAFT, ACTIVE, BLOCKED, CLOSED, FAILED, CANCELLED] }
    ClosureType:
      type: string
      enum: [DELIVERY_COMPLETED, DECISION_COMPLETED, IMPLEMENTATION_COMPLETED, OUTCOME_VALIDATED, COMPLETED_PARTIAL]
    ClosureAxisStatus: { type: string, enum: [NOT_APPLICABLE, PENDING, COMPLETED] }
    OutcomeAxisStatus: { type: string, enum: [NOT_APPLICABLE, PENDING, VALIDATED] }
    PlanVersionStatus: { type: string, enum: [DRAFT, IN_REVIEW, PUBLISHED, SUPERSEDED, WITHDRAWN] }
    ViewType: { type: string, enum: [SIMPLE, EXPERT, LIST] }
    CapabilityProviderType: { type: string, enum: [INTERNAL, MCP, HTTP_API, CONNECTOR, AGENT] }
    CapabilityOperationClass: { type: string, enum: [READ, COMPUTE, PROPOSE, MUTATE, PUBLISH, NOTIFY] }
    CapabilityEffectClass:
      type: string
      enum: [SAFE_ADDITIVE, SAFE_UPDATE, SENSITIVE_UPDATE, DESTRUCTIVE, GOVERNANCE_TRANSITION]
    CapabilityHealth: { type: string, enum: [HEALTHY, DEGRADED, UNHEALTHY, UNKNOWN] }
    CapabilityLifecycle: { type: string, enum: [ACTIVE, DEPRECATED, UNAVAILABLE] }
    ApprovalClass: { type: string, enum: [AUTO, NOTIFY_ONLY, REQUIRE_APPROVAL] }
    ActionProposalStatus:
      type: string
      enum: [DRAFT, PENDING_REVIEW, APPROVED, EXECUTING, EXECUTED, AUDITED, REJECTED, REQUESTED_CHANGES, REVOKED, FAILED]
    ProposerType: { type: string, enum: [HUMAN, AGENT, SYSTEM] }
    ApprovalDecisionType: { type: string, enum: [APPROVE, REJECT, REQUEST_CHANGES, DEFER] }
    ApprovalDecisionSource: { type: string, enum: [BUTTON, CONVERSATIONAL, POLICY] }
    CaseWaitType: { type: string, enum: [HUMAN, TIMER, DOMAIN_EVENT, EXTERNAL_CALLBACK] }
    CaseWaitStatus: { type: string, enum: [ACTIVE, SATISFIED, EXPIRED, CANCELLED] }
    ValueMeasurementStatus: { type: string, enum: [UNMEASURED, PARTIAL, CONFIRMED, NOT_ACHIEVED, EVIDENCE_MISSING] }
    ValueMeasurementConfidence: { type: string, enum: [LOW, MEDIUM, HIGH] }
    ArtifactLinkRelation:
      type: string
      enum: [INPUT, OUTPUT, EVIDENCE, DECISION_BASIS, DELIVERABLE, OUTCOME_MEASUREMENT]
    ArtifactLinkStatus: { type: string, enum: [ACTIVE, UNLINKED, UNAVAILABLE] }
    ProcessDefinitionVisibility: { type: string, enum: [PRIVATE, TEAM, ORGANIZATION] }
    ProcessVersionStatus: { type: string, enum: [DRAFT, IN_REVIEW, PUBLISHED, DEPRECATED, ARCHIVED] }
    CaseGatewayNodeType: { type: string, enum: [DECISION_GATEWAY, PARALLEL_SPLIT, PARALLEL_JOIN] }
    CaseGatewayJoinPolicy: { type: string, enum: [ALL, ANY, N_OF_M] }
    CaseGatewayOutcomeStatus:
      type: string
      enum: [BRANCH_SELECTED, SPLIT_ACTIVATED, JOIN_SATISFIED, JOIN_PENDING, JOIN_UNSATISFIED]
    CaseExecutionNodeType:
      type: string
      enum: [START, END, CAPABILITY, HUMAN_TASK, APPROVAL, TIMER_WAIT, EVENT_WAIT, DECISION_GATEWAY, PARALLEL_SPLIT, PARALLEL_JOIN, SUBFLOW, ANNOTATION]
    CaseNodeCompletionState: { type: string, enum: [COMPLETED, SKIPPED] }
    CaseNodeResultAcceptanceValue: { type: string, enum: [ACCEPTED, PARTIAL, REJECTED, NOT_APPLICABLE] }

    # -- graph ------------------------------------------------------------------
    CanonicalGraph:
      type: object
      description: |
        Deliberately loose. The route's zod schema only pins the four fields
        the service dereferences; every other key passes through untouched.
      required: [entryNodeIds, terminalNodeIds, nodes, edges]
      properties:
        schemaVersion: { type: string }
        graphId: { type: string }
        entryNodeIds: { type: array, items: { type: string } }
        terminalNodeIds: { type: array, items: { type: string } }
        nodes: { type: array, items: { type: object, additionalProperties: true } }
        edges: { type: array, items: { type: object, additionalProperties: true } }
        variables: { type: array, items: { type: object, additionalProperties: true } }
        inputSchemaRef: { type: string, nullable: true }
        outputSchemaRef: { type: string, nullable: true }
        limits: { type: object, additionalProperties: true }
        metadata: { type: object, additionalProperties: true }
      additionalProperties: true

    # -- Case -------------------------------------------------------------------
    CreateCaseBody:
      type: object
      required: [projectId, contractedClosureType]
      properties:
        projectId: { type: string, minLength: 1 }
        caseProfile: { $ref: '#/components/schemas/CaseProfile' }
        governanceTier: { $ref: '#/components/schemas/GovernanceTier' }
        autonomyPolicy: { $ref: '#/components/schemas/AutonomyPolicy' }
        contractedClosureType: { $ref: '#/components/schemas/ClosureType' }
        sponsorUserId: { type: string, minLength: 1, nullable: true }
        acceptanceCriteriaRef: { type: string, minLength: 1, nullable: true }
      additionalProperties: false

    GovernanceTierHistoryEntry:
      type: object
      required: [tier, changedAt, changedByActorId, reason]
      properties:
        tier: { $ref: '#/components/schemas/GovernanceTier' }
        changedAt: { type: string }
        changedByActorId: { type: string }
        reason: { type: string }

    CaseCore:
      type: object
      required:
        [caseId, projectId, organizationId, caseProfile, governanceTier, governanceTierHistory,
         autonomyPolicy, caseStatus, contractedClosureType, deliveryStatus, decisionStatus,
         implementationStatus, outcomeStatus, createdByActorId, version, createdAt, updatedAt]
      properties:
        caseId: { type: string }
        projectId: { type: string }
        organizationId: { type: string }
        caseProfile: { $ref: '#/components/schemas/CaseProfile' }
        governanceTier: { $ref: '#/components/schemas/GovernanceTier' }
        governanceTierHistory:
          type: array
          items: { $ref: '#/components/schemas/GovernanceTierHistoryEntry' }
        autonomyPolicy: { $ref: '#/components/schemas/AutonomyPolicy' }
        autonomyPolicyRef: { type: string, nullable: true }
        caseStatus: { $ref: '#/components/schemas/CaseStatus' }
        contractedClosureType: { $ref: '#/components/schemas/ClosureType' }
        deliveryStatus: { $ref: '#/components/schemas/ClosureAxisStatus' }
        decisionStatus: { $ref: '#/components/schemas/ClosureAxisStatus' }
        implementationStatus: { $ref: '#/components/schemas/ClosureAxisStatus' }
        outcomeStatus: { $ref: '#/components/schemas/OutcomeAxisStatus' }
        closureType:
          allOf: [{ $ref: '#/components/schemas/ClosureType' }]
          nullable: true
        closedAt: { type: string, nullable: true }
        closedByActorId: { type: string, nullable: true }
        closureEvidenceRef: { type: string, nullable: true }
        sponsorUserId: { type: string, nullable: true }
        acceptanceCriteriaRef: { type: string, nullable: true }
        budgetPolicyRef: { type: string, nullable: true }
        currentPlanVersionId: { type: string, nullable: true }
        createdByActorId: { type: string }
        version: { type: integer }
        createdAt: { type: string }
        updatedAt: { type: string }
        completedAt: { type: string, nullable: true }

    CaseCoreView:
      allOf:
        - $ref: '#/components/schemas/CaseCore'
        - type: object
          description: |
            List projection. `projectName`/`projectDescription`/`projectOwnerId`
            are read-only display fields projected from `projects`.
          properties:
            projectName: { type: string, nullable: true }
            projectDescription: { type: string, nullable: true }
            projectOwnerId: { type: string, nullable: true }

    # -- Plan version -----------------------------------------------------------
    PlanReviewHistoryEntry:
      type: object
      required: [event, actorId, at]
      properties:
        event: { type: string, enum: [PROPOSED, CHANGES_REQUESTED, PUBLISHED, WITHDRAWN] }
        actorId: { type: string }
        at: { type: string }
        reason: { type: string }

    CasePlanVersion:
      type: object
      required:
        [casePlanVersionId, caseId, planNumber, status, semanticGraph, graphDigest,
         reviewHistory, createdByActorId, version, createdAt, updatedAt]
      properties:
        casePlanVersionId: { type: string }
        caseId: { type: string }
        planNumber: { type: integer }
        sourceProcessVersionId: { type: string, nullable: true }
        supersedesPlanVersionId: { type: string, nullable: true }
        status: { $ref: '#/components/schemas/PlanVersionStatus' }
        semanticGraph: { $ref: '#/components/schemas/CanonicalGraph' }
        graphDigest: { type: string }
        changeReason: { type: string, nullable: true }
        reviewHistory: { type: array, items: { $ref: '#/components/schemas/PlanReviewHistoryEntry' } }
        proposedAt: { type: string, nullable: true }
        proposedByActorId: { type: string, nullable: true }
        publishedAt: { type: string, nullable: true }
        publishedByActorId: { type: string, nullable: true }
        supersededAt: { type: string, nullable: true }
        withdrawnAt: { type: string, nullable: true }
        withdrawnByActorId: { type: string, nullable: true }
        withdrawalReason: { type: string, nullable: true }
        createdByActorId: { type: string }
        version: { type: integer }
        createdAt: { type: string }
        updatedAt: { type: string }

    PlanViewState:
      type: object
      required: [casePlanVersionId, viewType, updatedAt]
      properties:
        casePlanVersionId: { type: string }
        viewType: { $ref: '#/components/schemas/ViewType' }
        viewState: {}
        updatedAt: { type: string }
        updatedByActorId: { type: string, nullable: true }

    PlanValidationResult:
      type: object
      required: [valid, blockers]
      properties:
        valid: { type: boolean }
        blockers:
          type: array
          items:
            type: object
            required: [code, detail, severity]
            properties:
              code: { type: string }
              detail: { type: string }
              severity: { type: string, enum: [BLOCKING, DEFERRED_EXTERNAL] }

    PlanCollectionDiff:
      type: object
      required: [added, removed, changed]
      properties:
        added: { type: array, items: { type: string } }
        removed: { type: array, items: { type: string } }
        changed:
          type: array
          items:
            type: object
            required: [id, changedFields]
            properties:
              id: { type: string }
              changedFields: { type: array, items: { type: string } }

    PlanVersionDiff:
      type: object
      required: [casePlanVersionId, baselinePlanVersionId, digestsEqual, nodes, edges, variables]
      properties:
        casePlanVersionId: { type: string }
        baselinePlanVersionId: { type: string }
        digestsEqual: { type: boolean }
        nodes: { $ref: '#/components/schemas/PlanCollectionDiff' }
        edges: { $ref: '#/components/schemas/PlanCollectionDiff' }
        variables: { $ref: '#/components/schemas/PlanCollectionDiff' }

    # -- Capability -------------------------------------------------------------
    RegisterCapabilityBody:
      type: object
      required:
        [capabilityId, capabilityVersion, ownerModule, providerType, operation, owningCommandRef,
         inputSchemaRef, outputSchemaRef, operationClass, effectClass, dataClassification,
         idempotencyStrategy, reversibility, approvalRecommendation]
      properties:
        capabilityId: { type: string, minLength: 1 }
        capabilityVersion: { type: string, minLength: 1 }
        ownerModule: { type: string, minLength: 1 }
        providerType: { $ref: '#/components/schemas/CapabilityProviderType' }
        operation: { type: string, minLength: 1 }
        owningCommandRef: { type: string, minLength: 1 }
        inputSchemaRef: { type: string, minLength: 1 }
        outputSchemaRef: { type: string, minLength: 1 }
        operationClass: { $ref: '#/components/schemas/CapabilityOperationClass' }
        effectClass: { $ref: '#/components/schemas/CapabilityEffectClass' }
        requiredRoles: { type: array, items: { type: string } }
        dataClassification: { type: string, minLength: 1 }
        residency: { type: string, minLength: 1, nullable: true }
        idempotencyStrategy: { type: string, minLength: 1 }
        reversibility: { type: string, minLength: 1 }
        approvalRecommendation: { $ref: '#/components/schemas/ApprovalClass' }
        eventsEmitted: { type: array, items: { type: string } }
        rateLimit: { type: object, additionalProperties: true, nullable: true }
        costPolicy: { type: object, additionalProperties: true, nullable: true }
        timeoutDefaults: { type: object, additionalProperties: true }
        readbackQuery: { type: string, minLength: 1, nullable: true }
        health: { $ref: '#/components/schemas/CapabilityHealth' }
        lifecycle: { $ref: '#/components/schemas/CapabilityLifecycle' }
        testFixtureRef: { type: string, minLength: 1, nullable: true }
        metadata: { type: object, additionalProperties: true }
      additionalProperties: false

    CapabilityRegistryEntry:
      type: object
      required:
        [capabilityRegistryId, capabilityId, capabilityVersion, ownerModule, providerType,
         operation, owningCommandRef, inputSchemaRef, outputSchemaRef, operationClass,
         effectClass, requiredRoles, dataClassification, idempotencyStrategy, reversibility,
         approvalRecommendation, eventsEmitted, timeoutDefaults, health, lifecycle, metadata,
         createdByActorId, version, createdAt, updatedAt]
      properties:
        capabilityRegistryId: { type: string }
        capabilityId: { type: string }
        capabilityVersion: { type: string }
        ownerModule: { type: string }
        providerType: { $ref: '#/components/schemas/CapabilityProviderType' }
        operation: { type: string }
        owningCommandRef: { type: string }
        inputSchemaRef: { type: string }
        outputSchemaRef: { type: string }
        operationClass: { $ref: '#/components/schemas/CapabilityOperationClass' }
        effectClass: { $ref: '#/components/schemas/CapabilityEffectClass' }
        requiredRoles: { type: array, items: { type: string } }
        dataClassification: { type: string }
        residency: { type: string, nullable: true }
        idempotencyStrategy: { type: string }
        reversibility: { type: string }
        approvalRecommendation: { $ref: '#/components/schemas/ApprovalClass' }
        eventsEmitted: { type: array, items: { type: string } }
        rateLimit: { type: object, additionalProperties: true, nullable: true }
        costPolicy: { type: object, additionalProperties: true, nullable: true }
        timeoutDefaults: { type: object, additionalProperties: true }
        readbackQuery: { type: string, nullable: true }
        health: { $ref: '#/components/schemas/CapabilityHealth' }
        healthCheckedAt: { type: string, nullable: true }
        healthDetail: { type: string, nullable: true }
        lifecycle: { $ref: '#/components/schemas/CapabilityLifecycle' }
        testFixtureRef: { type: string, nullable: true }
        metadata: { type: object, additionalProperties: true }
        createdByActorId: { type: string }
        version: { type: integer }
        createdAt: { type: string }
        updatedAt: { type: string }

    IdempotencyCheckResult:
      type: object
      required: [isDuplicate, recordedAt]
      properties:
        isDuplicate: { type: boolean }
        recordedAt: { type: string }

    # -- Run binding ------------------------------------------------------------
    CaseRunBinding:
      type: object
      required: [runId, casePlanVersionId, caseId, organizationId, graphDigest, boundByActorId, createdAt]
      properties:
        runId: { type: string }
        casePlanVersionId: { type: string }
        caseId: { type: string }
        organizationId: { type: string }
        graphDigest: { type: string }
        boundByActorId: { type: string }
        createdAt: { type: string }

    # -- Run lifecycle ------------------------------------------------------------
    RunStatus:
      type: string
      enum:
        [CREATED, VALIDATING, QUEUED, RUNNING, PAUSED, WAITING, BLOCKED, RETRY_SCHEDULED,
         COMPLETED, COMPLETED_WITH_WARNINGS, FAILED, CANCELLED, COMPENSATING, COMPENSATED]
    RunOutcomeStatus:
      type: string
      enum: [PENDING_REVIEW, ACCEPTED, REJECTED, PARTIALLY_ACCEPTED, NOT_APPLICABLE]
    Run:
      type: object
      required:
        [runId, organizationId, projectId, caseId, casePlanVersionId, graphDigest, status,
         outcomeStatus, initiatedBy, correlationId, idempotencyKey, version, createdAt,
         startedAt, completedAt, updatedAt]
      properties:
        runId: { type: string }
        organizationId: { type: string }
        projectId: { type: string, nullable: true }
        caseId: { type: string }
        casePlanVersionId: { type: string }
        graphDigest: { type: string }
        status: { $ref: '#/components/schemas/RunStatus' }
        outcomeStatus: { $ref: '#/components/schemas/RunOutcomeStatus' }
        initiatedBy: { type: string }
        correlationId: { type: string, nullable: true }
        idempotencyKey: { type: string }
        version: { type: integer }
        createdAt: { type: string }
        startedAt: { type: string, nullable: true }
        completedAt: { type: string, nullable: true }
        updatedAt: { type: string }
    NodeRunStatus:
      type: string
      enum:
        [PENDING, READY, CLAIMED, RUNNING, WAITING_HUMAN, WAITING_TIMER, WAITING_EVENT,
         FAILED_RETRYABLE, RETRY_SCHEDULED, SUCCEEDED, SKIPPED, FAILED_TERMINAL, CANCELLED]
    NodeRunCompensationState:
      type: string
      enum: [NOT_REQUIRED, REQUIRED, IN_PROGRESS, COMPLETED, FAILED]
    NodeRun:
      type: object
      required:
        [nodeRunId, organizationId, projectId, caseId, runId, nodeId, nodeVersionRef, status,
         attempt, maxAttempts, currentAttemptId, inputSnapshotRef, outputSnapshotRef, waitId,
         actionProposalId, idempotencyKey, leaseOwner, leaseFencingToken, leaseExpiresAt,
         heartbeatAt, timeoutAt, retryNotBefore, startedAt, completedAt, errorCode,
         errorDetailRef, compensationState, compensationRef, version, createdAt, updatedAt]
      properties:
        nodeRunId: { type: string }
        organizationId: { type: string }
        projectId: { type: string, nullable: true }
        caseId: { type: string }
        runId: { type: string }
        nodeId: { type: string }
        nodeVersionRef: { type: string }
        status: { $ref: '#/components/schemas/NodeRunStatus' }
        attempt: { type: integer }
        maxAttempts: { type: integer }
        currentAttemptId: { type: string, nullable: true }
        inputSnapshotRef: { type: string, nullable: true }
        outputSnapshotRef: { type: string, nullable: true }
        waitId: { type: string, nullable: true }
        actionProposalId: { type: string, nullable: true }
        idempotencyKey: { type: string }
        leaseOwner: { type: string, nullable: true }
        leaseFencingToken: { type: integer }
        leaseExpiresAt: { type: string, nullable: true }
        heartbeatAt: { type: string, nullable: true }
        timeoutAt: { type: string, nullable: true }
        retryNotBefore: { type: string, nullable: true }
        startedAt: { type: string, nullable: true }
        completedAt: { type: string, nullable: true }
        errorCode: { type: string, nullable: true }
        errorDetailRef: { type: string, nullable: true }
        compensationState: { $ref: '#/components/schemas/NodeRunCompensationState' }
        compensationRef: { type: string, nullable: true }
        version: { type: integer }
        createdAt: { type: string }
        updatedAt: { type: string }
    StartRunResult:
      description: Discriminated on `outcome` — `started` (fresh) or `already_started` (idempotent replay).
      oneOf:
        - type: object
          required: [outcome, run, nodeRunIds]
          properties:
            outcome: { type: string, enum: [started] }
            run: { $ref: '#/components/schemas/Run' }
            nodeRunIds: { type: array, items: { type: string } }
        - type: object
          required: [outcome, run]
          properties:
            outcome: { type: string, enum: [already_started] }
            run: { $ref: '#/components/schemas/Run' }
    AdvanceRunResult:
      type: object
      required: [run, createdNodeRunIds]
      properties:
        run: { $ref: '#/components/schemas/Run' }
        createdNodeRunIds: { type: array, items: { type: string } }
    CompensateRunResult:
      type: object
      required: [run, markedNodeRunIds]
      properties:
        run: { $ref: '#/components/schemas/Run' }
        markedNodeRunIds: { type: array, items: { type: string } }
    RetryNodeResult:
      type: object
      required: [run, nodeRun]
      properties:
        run: { $ref: '#/components/schemas/Run' }
        nodeRun: { $ref: '#/components/schemas/NodeRun' }
    ProvideNodeInputResult:
      type: object
      required: [nodeRun, run]
      properties:
        nodeRun: { $ref: '#/components/schemas/NodeRun' }
        run: { $ref: '#/components/schemas/Run' }

    # -- Proposals --------------------------------------------------------------
    CreateActionProposalBody:
      type: object
      required: [runId, nodeRunId, payloadDigest, policySnapshotRef, effectClass, previewRef, proposerType]
      properties:
        runId: { type: string, minLength: 1 }
        nodeRunId: { type: string, minLength: 1 }
        casePlanVersionId: { type: string, minLength: 1, nullable: true }
        capabilityRegistryId: { type: string, minLength: 1, nullable: true }
        supersedesActionProposalId: { type: string, minLength: 1, nullable: true }
        payloadDigest: { type: string, minLength: 1 }
        targetExpectedVersion: { type: integer, nullable: true }
        policySnapshotRef: { type: string, minLength: 1 }
        effectClass: { $ref: '#/components/schemas/CapabilityEffectClass' }
        previewRef: { type: string, minLength: 1 }
        expiresAt: { type: string, minLength: 1, nullable: true }
        proposerType: { $ref: '#/components/schemas/ProposerType' }
        idempotencyKey:
          type: string
          minLength: 1
          description: Required unless supplied as the `Idempotency-Key` header.
      additionalProperties: false

    CaseActionProposal:
      type: object
      required:
        [actionProposalId, organizationId, caseId, runId, nodeRunId, proposalVersion, payloadDigest,
         policySnapshotRef, effectClass, previewRef, status, idempotencyKey, createdByActorId,
         proposerType, version, createdAt, updatedAt]
      properties:
        actionProposalId: { type: string }
        organizationId: { type: string }
        projectId: { type: string, nullable: true }
        caseId: { type: string }
        runId: { type: string }
        nodeRunId: { type: string }
        proposalVersion: { type: integer }
        supersedesActionProposalId: { type: string, nullable: true }
        payloadDigest: { type: string }
        targetExpectedVersion: { type: integer, nullable: true }
        policySnapshotRef: { type: string }
        effectClass: { $ref: '#/components/schemas/CapabilityEffectClass' }
        previewRef: { type: string }
        casePlanVersionId: { type: string, nullable: true }
        capabilityRegistryId: { type: string, nullable: true }
        status: { $ref: '#/components/schemas/ActionProposalStatus' }
        expiresAt: { type: string, nullable: true }
        idempotencyKey: { type: string }
        createdByActorId: { type: string }
        proposerType: { $ref: '#/components/schemas/ProposerType' }
        version: { type: integer }
        createdAt: { type: string }
        updatedAt: { type: string }

    RecordApprovalDecisionBody:
      type: object
      required:
        [proposalVersion, payloadDigest, decision, source, authenticationAssurance,
         approvalChannelPolicy, policyVersion, expectedVersion]
      properties:
        proposalVersion: { type: integer }
        payloadDigest: { type: string, minLength: 1 }
        decision: { $ref: '#/components/schemas/ApprovalDecisionType' }
        source: { $ref: '#/components/schemas/ApprovalDecisionSource' }
        authenticationAssurance: { type: string, minLength: 1 }
        approvalChannelPolicy: { type: string, minLength: 1 }
        conversationId: { type: string, minLength: 1, nullable: true }
        sourceMessageId: { type: string, minLength: 1, nullable: true }
        sourceMessageDigest: { type: string, minLength: 1, nullable: true }
        policyVersion: { type: string, minLength: 1 }
        membershipSnapshotRef: { type: string, minLength: 1, nullable: true }
        reason: { type: string, minLength: 1, nullable: true }
        idempotencyKey:
          type: string
          minLength: 1
          description: Required unless supplied as the `Idempotency-Key` header.
        expectedVersion: { type: integer }
      additionalProperties: false

    ApprovalDecisionRecord:
      type: object
      required:
        [decisionId, actionProposalId, proposalVersion, payloadDigest, decision, decidedByActorId,
         decidedAt, source, authenticationAssurance, approvalChannelPolicy, policyVersion,
         idempotencyKey, createdAt]
      properties:
        decisionId: { type: string }
        actionProposalId: { type: string }
        proposalVersion: { type: integer }
        payloadDigest: { type: string }
        targetExpectedVersion: { type: integer, nullable: true }
        decision: { $ref: '#/components/schemas/ApprovalDecisionType' }
        decidedByActorId: { type: string }
        decidedAt: { type: string }
        source: { $ref: '#/components/schemas/ApprovalDecisionSource' }
        authenticationAssurance: { type: string }
        approvalChannelPolicy: { type: string }
        conversationId: { type: string, nullable: true }
        sourceMessageId: { type: string, nullable: true }
        sourceMessageDigest: { type: string, nullable: true }
        policyVersion: { type: string }
        membershipSnapshotRef: { type: string, nullable: true }
        reason: { type: string, nullable: true }
        idempotencyKey: { type: string }
        createdAt: { type: string }

    RecordApprovalDecisionResult:
      type: object
      required: [proposal, decision]
      properties:
        proposal: { $ref: '#/components/schemas/CaseActionProposal' }
        decision: { $ref: '#/components/schemas/ApprovalDecisionRecord' }

    # -- Waits ------------------------------------------------------------------
    CreateWaitBody:
      type: object
      description: |
        `required` below is the ROUTE's zod contract. The SERVICE additionally
        requires at least one of `runId` / `actionProposalId`
        (`400 WAIT_TARGET_REQUIRED`) — a constraint OpenAPI's `required` cannot
        express, and one that a route-schema-only reading of this endpoint
        would miss.
      required: [waitType]
      properties:
        runId: { type: string, minLength: 1, nullable: true }
        actionProposalId: { type: string, minLength: 1, nullable: true }
        nodeRunId: { type: string, minLength: 1, nullable: true }
        waitType: { $ref: '#/components/schemas/CaseWaitType' }
        correlationKey:
          type: string
          minLength: 1
          description: Required unless supplied as the `Idempotency-Key` header.
        expectedEventType: { type: string, minLength: 1, nullable: true }
        predicateRef: { type: string, minLength: 1, nullable: true }
        dueAt: { type: string, minLength: 1, nullable: true }
        timeoutAt: { type: string, minLength: 1, nullable: true }
        resumeTokenHash: { type: string, minLength: 1, nullable: true }
      additionalProperties: false

    CaseWait:
      type: object
      required:
        [waitId, organizationId, caseId, waitType, status, correlationKey, claimFencingToken,
         version, createdAt, updatedAt]
      properties:
        waitId: { type: string }
        organizationId: { type: string }
        projectId: { type: string, nullable: true }
        caseId: { type: string }
        runId: { type: string, nullable: true }
        nodeRunId: { type: string, nullable: true }
        actionProposalId: { type: string, nullable: true }
        waitType: { $ref: '#/components/schemas/CaseWaitType' }
        status: { $ref: '#/components/schemas/CaseWaitStatus' }
        correlationKey: { type: string }
        expectedEventType: { type: string, nullable: true }
        predicateRef: { type: string, nullable: true }
        dueAt: { type: string, nullable: true }
        timeoutAt: { type: string, nullable: true }
        resumeTokenHash: { type: string, nullable: true }
        satisfiedAt: { type: string, nullable: true }
        satisfiedByEventId: { type: string, nullable: true }
        claimOwnerToken: { type: string, nullable: true }
        claimFencingToken: { type: integer }
        claimLeaseExpiresAt: { type: string, nullable: true }
        version: { type: integer }
        createdAt: { type: string }
        updatedAt: { type: string }

    # -- Case history -----------------------------------------------------------
    AppendCaseHistoryEventBody:
      type: object
      required: [eventType, occurredAt, summary]
      properties:
        projectId: { type: string, minLength: 1, nullable: true }
        eventType:
          type: string
          minLength: 1
          description: Open catalog — not a DB CHECK enum.
        occurredAt: { type: string, minLength: 1 }
        summary: { type: string, minLength: 1 }
        payload: { type: object, additionalProperties: true, nullable: true }
        sourceTable: { type: string, minLength: 1, nullable: true }
        sourceId: { type: string, minLength: 1, nullable: true }
        correlationId: { type: string, minLength: 1, nullable: true }
        dedupeKey: { type: string, minLength: 1, nullable: true }
      additionalProperties: false

    CaseHistoryEvent:
      type: object
      required:
        [eventId, organizationId, caseId, eventType, actorId, occurredAt, recordedAt, summary,
         payload, globalSeq]
      properties:
        eventId: { type: string }
        organizationId: { type: string }
        projectId: { type: string, nullable: true }
        caseId: { type: string }
        eventType: { type: string }
        actorId: { type: string }
        occurredAt: { type: string }
        recordedAt: { type: string }
        summary: { type: string }
        payload: { type: object, additionalProperties: true }
        sourceTable: { type: string, nullable: true }
        sourceId: { type: string, nullable: true }
        correlationId: { type: string, nullable: true }
        dedupeKey: { type: string, nullable: true }
        globalSeq: { type: integer }

    RecordValueMeasurementBody:
      type: object
      required: [metricKey, metricName, measurementStatus, measurementDate, confidence, attribution]
      properties:
        metricKey: { type: string, minLength: 1 }
        metricName: { type: string, minLength: 1 }
        kpiRef: { type: string, minLength: 1, nullable: true }
        baselineValue: { type: number, nullable: true }
        baselineUnit: { type: string, minLength: 1, nullable: true }
        targetValue: { type: number, nullable: true }
        targetUnit: { type: string, minLength: 1, nullable: true }
        actualValue: { type: number, nullable: true }
        actualUnit: { type: string, minLength: 1, nullable: true }
        measurementStatus: { $ref: '#/components/schemas/ValueMeasurementStatus' }
        measurementDate: { type: string, minLength: 1 }
        measurementWindowStart: { type: string, minLength: 1, nullable: true }
        measurementWindowEnd: { type: string, minLength: 1, nullable: true }
        confidence: { $ref: '#/components/schemas/ValueMeasurementConfidence' }
        attribution: { type: string, minLength: 1 }
        benefitOwnerActorId: { type: string, minLength: 1, nullable: true }
        nextMeasurementDueAt: { type: string, minLength: 1, nullable: true }
        evidenceRef: { type: string, minLength: 1, nullable: true }
        dedupeKey: { type: string, minLength: 1, nullable: true }
      additionalProperties: false

    ValueMeasurement:
      type: object
      required:
        [measurementId, organizationId, caseId, metricKey, metricName, measurementStatus,
         measurementDate, confidence, attribution, measuredByActorId, createdAt]
      properties:
        measurementId: { type: string }
        organizationId: { type: string }
        projectId: { type: string, nullable: true }
        caseId: { type: string }
        metricKey: { type: string }
        metricName: { type: string }
        kpiRef: { type: string, nullable: true }
        baselineValue: { type: number, nullable: true }
        baselineUnit: { type: string, nullable: true }
        targetValue: { type: number, nullable: true }
        targetUnit: { type: string, nullable: true }
        actualValue: { type: number, nullable: true }
        actualUnit: { type: string, nullable: true }
        measurementStatus: { $ref: '#/components/schemas/ValueMeasurementStatus' }
        measurementDate: { type: string }
        measurementWindowStart: { type: string, nullable: true }
        measurementWindowEnd: { type: string, nullable: true }
        confidence: { $ref: '#/components/schemas/ValueMeasurementConfidence' }
        attribution: { type: string }
        benefitOwnerActorId: { type: string, nullable: true }
        nextMeasurementDueAt: { type: string, nullable: true }
        evidenceRef: { type: string, nullable: true }
        measuredByActorId: { type: string }
        dedupeKey: { type: string, nullable: true }
        createdAt: { type: string }

    # -- Plays ------------------------------------------------------------------
    ProcessDefinition:
      type: object
      required:
        [processDefinitionId, organizationId, name, visibility, ownerActorId, createdByActorId,
         version, createdAt, updatedAt]
      properties:
        processDefinitionId: { type: string }
        organizationId: { type: string }
        name: { type: string }
        description: { type: string, nullable: true }
        visibility: { $ref: '#/components/schemas/ProcessDefinitionVisibility' }
        teamId: { type: string, nullable: true }
        ownerActorId: { type: string }
        sharedAt: { type: string, nullable: true }
        sharedByActorId: { type: string, nullable: true }
        createdByActorId: { type: string }
        version: { type: integer }
        createdAt: { type: string }
        updatedAt: { type: string }

    ProcessVersion:
      type: object
      required:
        [processVersionId, processDefinitionId, versionNumber, status, semanticGraph, graphDigest,
         capabilityVersions, requiredBindings, reviewHistory, createdByActorId, version,
         createdAt, updatedAt]
      properties:
        processVersionId: { type: string }
        processDefinitionId: { type: string }
        versionNumber: { type: integer }
        status: { $ref: '#/components/schemas/ProcessVersionStatus' }
        semanticGraph: { $ref: '#/components/schemas/CanonicalGraph' }
        graphDigest: { type: string }
        capabilityVersions: { type: array, items: {} }
        policyRef: { type: string, nullable: true }
        requiredBindings: { type: array, items: {} }
        changeReason: { type: string, nullable: true }
        reviewHistory:
          type: array
          items:
            type: object
            required: [event, actorId, at]
            properties:
              event: { type: string, enum: [PROPOSED, CHANGES_REQUESTED, APPROVED, PUBLISHED, DEPRECATED, ARCHIVED] }
              actorId: { type: string }
              at: { type: string }
              reason: { type: string }
        proposedAt: { type: string, nullable: true }
        proposedByActorId: { type: string, nullable: true }
        reviewedAt: { type: string, nullable: true }
        reviewedByActorId: { type: string, nullable: true }
        reviewDecision:
          type: string
          enum: [APPROVED, CHANGES_REQUESTED]
          nullable: true
        publishedAt: { type: string, nullable: true }
        publishedByActorId: { type: string, nullable: true }
        deprecatedAt: { type: string, nullable: true }
        deprecatedByActorId: { type: string, nullable: true }
        deprecationReason: { type: string, nullable: true }
        archivedAt: { type: string, nullable: true }
        archivedByActorId: { type: string, nullable: true }
        createdByActorId: { type: string }
        version: { type: integer }
        createdAt: { type: string }
        updatedAt: { type: string }

    # -- Artifact links ---------------------------------------------------------
    CaseArtifactLink:
      type: object
      required:
        [linkId, organizationId, caseId, artifactType, artifactId, revisionPinHistory, relation,
         linkStatus, isStale, linkedByActorId, linkedAt, version, createdAt, updatedAt]
      properties:
        linkId: { type: string }
        organizationId: { type: string }
        projectId: { type: string, nullable: true }
        caseId: { type: string }
        artifactType: { type: string }
        artifactId: { type: string }
        artifactRevision: { type: string, nullable: true }
        revisionPinHistory:
          type: array
          items:
            type: object
            required: [revision, pinnedAt, pinnedByActorId]
            properties:
              revision: { type: string }
              pinnedAt: { type: string }
              pinnedByActorId: { type: string }
              reason: { type: string, nullable: true }
        relation: { $ref: '#/components/schemas/ArtifactLinkRelation' }
        linkStatus: { $ref: '#/components/schemas/ArtifactLinkStatus' }
        isStale: { type: boolean }
        staleMarkedAt: { type: string, nullable: true }
        staleMarkedByActorId: { type: string, nullable: true }
        staleReason: { type: string, nullable: true }
        unlinkedAt: { type: string, nullable: true }
        unlinkedByActorId: { type: string, nullable: true }
        unlinkReason: { type: string, nullable: true }
        unavailableMarkedAt: { type: string, nullable: true }
        unavailableMarkedByActorId: { type: string, nullable: true }
        unavailableReason: { type: string, nullable: true }
        linkedByActorId: { type: string }
        linkedAt: { type: string }
        dedupeKey: { type: string, nullable: true }
        version: { type: integer }
        createdAt: { type: string }
        updatedAt: { type: string }

    ArtifactLinkSetDigest:
      type: object
      required: [caseId, digest, linkCount, computedAt]
      properties:
        caseId: { type: string }
        digest: { type: string }
        linkCount: { type: integer }
        computedAt: { type: string }

    ArtifactLinkOpenState: { type: string, enum: [AVAILABLE, STALE, UNAVAILABLE, DELETED] }
    ArtifactLinkResultsGroup:
      type: string
      enum: [KEY_FINDINGS_AND_RECOMMENDATIONS, DECISIONS, NATIVE_DELIVERABLES, EFFECT_AND_VALUE, EVIDENCE_AND_LINEAGE]

    ArtifactLinkDeepLinkTarget:
      type: object
      required: [artifactType, artifactId, artifactRevision]
      description: |
        CW-RT-024's own stated minimum to construct a deep link into the
        owning module — never anything more (no content, no title, no
        payload).
      properties:
        artifactType: { type: string }
        artifactId: { type: string }
        artifactRevision: { type: string, nullable: true }

    ArtifactLinkReturnContext:
      type: object
      required: [caseId, casePhase, resultsGroup, linkId, relation]
      description: doc 03 §5 "a semantic return path to the same Case phase and selected step."
      properties:
        caseId: { type: string }
        casePhase: { type: string, description: 'case_core.case_status at resolution time.' }
        resultsGroup: { $ref: '#/components/schemas/ArtifactLinkResultsGroup' }
        linkId: { type: string }
        relation: { $ref: '#/components/schemas/ArtifactLinkRelation' }

    ArtifactLinkOpenResolution:
      type: object
      required: [linkId, caseId, relation, state, deepLink, isStale, returnContext, resolvedAt]
      properties:
        linkId: { type: string }
        caseId: { type: string }
        relation: { $ref: '#/components/schemas/ArtifactLinkRelation' }
        state: { $ref: '#/components/schemas/ArtifactLinkOpenState' }
        deepLink:
          allOf: [{ $ref: '#/components/schemas/ArtifactLinkDeepLinkTarget' }]
          nullable: true
          description: 'Populated for AVAILABLE/STALE only; null for UNAVAILABLE/DELETED.'
        isStale: { type: boolean }
        staleReason: { type: string, nullable: true }
        staleMarkedAt: { type: string, nullable: true }
        unavailableReason: { type: string, nullable: true }
        unavailableMarkedAt: { type: string, nullable: true }
        unlinkReason: { type: string, nullable: true }
        unlinkedAt: { type: string, nullable: true }
        returnContext: { $ref: '#/components/schemas/ArtifactLinkReturnContext' }
        resolvedAt: { type: string }

    # -- Execution graph --------------------------------------------------------
    RecordGatewayEvaluationBody:
      type: object
      required: [nodeRunId, gatewayNodeType, outcomeStatus, evaluatedAt]
      properties:
        nodeRunId: { type: string, minLength: 1 }
        gatewayNodeType: { $ref: '#/components/schemas/CaseGatewayNodeType' }
        joinPolicy:
          allOf: [{ $ref: '#/components/schemas/CaseGatewayJoinPolicy' }]
          nullable: true
        joinRequiredCount: { type: integer, nullable: true }
        joinBranchTotalCount: { type: integer, nullable: true }
        conditionExpression: { type: string, minLength: 1, nullable: true }
        conditionSchemaVersion: { type: string, minLength: 1, nullable: true }
        evaluationInputSnapshot: {}
        outcomeStatus: { $ref: '#/components/schemas/CaseGatewayOutcomeStatus' }
        outcomeDetail: {}
        evaluatedAt: { type: string, minLength: 1 }
      additionalProperties: false

    CaseGatewayEvaluation:
      type: object
      required:
        [nodeRunId, organizationId, caseId, runId, gatewayNodeType, evaluationInputDigest,
         outcomeStatus, evaluatedAt, recordedAt, recordedByActorId]
      properties:
        nodeRunId: { type: string }
        organizationId: { type: string }
        projectId: { type: string, nullable: true }
        caseId: { type: string }
        runId: { type: string }
        gatewayNodeType: { $ref: '#/components/schemas/CaseGatewayNodeType' }
        joinPolicy:
          allOf: [{ $ref: '#/components/schemas/CaseGatewayJoinPolicy' }]
          nullable: true
        joinRequiredCount: { type: integer, nullable: true }
        joinBranchTotalCount: { type: integer, nullable: true }
        conditionExpression: { type: string, nullable: true }
        conditionSchemaVersion: { type: string, nullable: true }
        evaluationInputSnapshot: {}
        evaluationInputDigest: { type: string }
        outcomeStatus: { $ref: '#/components/schemas/CaseGatewayOutcomeStatus' }
        outcomeDetail: {}
        evaluatedAt: { type: string }
        recordedAt: { type: string }
        recordedByActorId: { type: string }

    RecordNodeResultAcceptanceBody:
      type: object
      required: [nodeRunId, nodeType, nodeCompletionState, resultAcceptance, occurredAt]
      properties:
        nodeRunId: { type: string, minLength: 1 }
        nodeType: { $ref: '#/components/schemas/CaseExecutionNodeType' }
        nodeCompletionState: { $ref: '#/components/schemas/CaseNodeCompletionState' }
        resultAcceptance: { $ref: '#/components/schemas/CaseNodeResultAcceptanceValue' }
        skipAuthorizedByGraphCondition: { type: boolean, nullable: true }
        skipConditionRef: { type: string, minLength: 1, nullable: true }
        causedByGatewayNodeRunId: { type: string, minLength: 1, nullable: true }
        acceptanceInputSnapshot: {}
        occurredAt: { type: string, minLength: 1 }
      additionalProperties: false

    CaseNodeResultAcceptance:
      type: object
      required:
        [nodeRunId, organizationId, caseId, runId, nodeType, nodeCompletionState, resultAcceptance,
         acceptanceInputDigest, occurredAt, recordedAt, recordedByActorId]
      properties:
        nodeRunId: { type: string }
        organizationId: { type: string }
        projectId: { type: string, nullable: true }
        caseId: { type: string }
        runId: { type: string }
        nodeType: { $ref: '#/components/schemas/CaseExecutionNodeType' }
        nodeCompletionState: { $ref: '#/components/schemas/CaseNodeCompletionState' }
        resultAcceptance: { $ref: '#/components/schemas/CaseNodeResultAcceptanceValue' }
        skipAuthorizedByGraphCondition: { type: boolean, nullable: true }
        skipConditionRef: { type: string, nullable: true }
        causedByGatewayNodeRunId: { type: string, nullable: true }
        acceptanceInputSnapshot: {}
        acceptanceInputDigest: { type: string }
        occurredAt: { type: string }
        recordedAt: { type: string }
        recordedByActorId: { type: string }

    # -- Migration readiness ----------------------------------------------------
    FlagDefinition:
      type: object
      required: [flagKey, description, defaultEnabled, createdAt, createdBy]
      properties:
        flagKey: { type: string }
        parentFlagKey: { type: string, nullable: true }
        description: { type: string }
        defaultEnabled: { type: boolean }
        createdAt: { type: string }
        createdBy: { type: string }

    FeatureFlagState:
      type: object
      required: [flagId, organizationId, flagKey, enabled, rolloutPercentage, allowList, updatedAt]
      properties:
        flagId: { type: string }
        organizationId: { type: string }
        flagKey: { type: string }
        enabled: { type: boolean }
        cohort: { type: string, nullable: true }
        rolloutPercentage: { type: integer }
        allowList: { type: array, items: { type: string } }
        updatedAt: { type: string }
        updatedBy: { type: string, nullable: true }

    RecordQuarantineBody:
      type: object
      required:
        [rehearsalRunId, sourceSystem, sourceTable, sourceId, quarantineReasonCode,
         quarantineReasonDetail, recoveryPathRef, detectedAt]
      properties:
        rehearsalRunId: { type: string, minLength: 1 }
        sourceSystem: { type: string, minLength: 1 }
        sourceTable: { type: string, minLength: 1 }
        sourceId: { type: string, minLength: 1 }
        attemptedCaseId: { type: string, minLength: 1, nullable: true }
        quarantineReasonCode: { type: string, minLength: 1 }
        quarantineReasonDetail: { type: string, minLength: 1 }
        recoveryPathRef: { type: string, minLength: 1 }
        sourceRecordSnapshot: { type: object, additionalProperties: true, nullable: true }
        detectedAt: { type: string, minLength: 1 }
        dedupeKey: { type: string, minLength: 1, nullable: true }
      additionalProperties: false

    # -- Case intake ------------------------------------------------------------
    WorkOrderDraft:
      type: object
      description: |
        NOTE what is NOT trimmed by the route: `goal`, `scope[]`,
        `expectedOutcome`, `constraints[]` and `successCriteria[]` pass through
        exactly as sent. Normalization (NFC + trim) happens inside the service,
        in the same step as digesting, so the digested string is always the
        string the service saw.
      required: [projectId, goal, scope, expectedOutcome, contractedClosureType]
      properties:
        projectId: { type: string, minLength: 1 }
        goal: { type: string, minLength: 1 }
        scope:
          type: array
          minItems: 1
          items: { type: string }
          description: Ordered — the order is part of what the human read and is digested.
        expectedOutcome: { type: string, minLength: 1 }
        constraints: { type: array, items: { type: string }, nullable: true }
        successCriteria: { type: array, items: { type: string }, nullable: true }
        contractedClosureType: { $ref: '#/components/schemas/ClosureType' }
        caseProfile:
          allOf: [{ $ref: '#/components/schemas/CaseProfile' }]
          nullable: true
        governanceTier:
          allOf: [{ $ref: '#/components/schemas/GovernanceTier' }]
          nullable: true
        autonomyPolicy:
          allOf: [{ $ref: '#/components/schemas/AutonomyPolicy' }]
          nullable: true
        sourceConversationId: { type: string, minLength: 1, nullable: true }
        sourceMessageId: { type: string, minLength: 1, nullable: true }
      additionalProperties: false

    CanonicalWorkOrder:
      type: object
      description: The normalized, digested form. Optional inputs are defaulted, never null.
      required:
        [workOrderSchemaVersion, organizationId, projectId, goal, scope, expectedOutcome,
         constraints, successCriteria, contractedClosureType, caseProfile, governanceTier,
         autonomyPolicy]
      properties:
        workOrderSchemaVersion: { type: integer }
        organizationId: { type: string }
        projectId: { type: string }
        goal: { type: string }
        scope: { type: array, items: { type: string } }
        expectedOutcome: { type: string }
        constraints: { type: array, items: { type: string } }
        successCriteria: { type: array, items: { type: string } }
        contractedClosureType: { $ref: '#/components/schemas/ClosureType' }
        caseProfile: { $ref: '#/components/schemas/CaseProfile' }
        governanceTier: { $ref: '#/components/schemas/GovernanceTier' }
        autonomyPolicy: { $ref: '#/components/schemas/AutonomyPolicy' }
        sourceConversationId: { type: string, nullable: true }
        sourceMessageId: { type: string, nullable: true }

    ProposeWorkOrderResult:
      type: object
      required:
        [workOrderId, workOrderDigest, workOrder, proposedEventId, alreadyProposed,
         caseCreated, runCreated]
      properties:
        workOrderId:
          type: string
          description: Deterministic `wo-<sha256 hex>` — same content, same id, forever.
        workOrderDigest:
          type: string
          pattern: '^sha256:[0-9a-f]{64}$'
          description: What the human must confirm, verbatim.
        workOrder: { $ref: '#/components/schemas/CanonicalWorkOrder' }
        proposedEventId: { type: string }
        alreadyProposed: { type: boolean }
        caseCreated: { type: boolean, enum: [false], description: Always false (CW-CANON-01). }
        runCreated: { type: boolean, enum: [false], description: Always false. }

    ConfirmWorkOrderResult:
      type: object
      required:
        [caseId, workOrderId, workOrderDigest, caseCreated, reused, reuseReason,
         confirmedEventId, confirmedEventDeduplicated, runCreated]
      properties:
        caseId: { type: string }
        workOrderId: { type: string }
        workOrderDigest: { type: string }
        caseCreated:
          type: boolean
          description: |
            `true` = THIS call created the Case (HTTP 201); `false` = an
            existing Case was reused (HTTP 200). `reused` is its inverse.
        reused: { type: boolean }
        reuseReason:
          type: string
          enum: [none, work_order_already_confirmed, existing_case_for_project]
        confirmedEventId: { type: string }
        confirmedEventDeduplicated: { type: boolean }
        runCreated: { type: boolean, enum: [false], description: Always false — confirming does not start work. }

    ConfirmedWorkOrderRecord:
      type: object
      required: [eventId, caseId, workOrderId, workOrderDigest, confirmedByActorId, confirmedAt, summary]
      properties:
        eventId: { type: string }
        caseId: { type: string }
        workOrderId: { type: string }
        workOrderDigest: { type: string }
        confirmedByActorId: { type: string }
        confirmedAt: { type: string }
        summary: { type: object, additionalProperties: true }

    QuarantinedLegacyRecord:
      type: object
      required:
        [quarantineId, organizationId, rehearsalRunId, sourceSystem, sourceTable, sourceId,
         quarantineReasonCode, quarantineReasonDetail, recoveryPathRef, sourceRecordSnapshot,
         detectedAt, recordedAt]
      properties:
        quarantineId: { type: string }
        organizationId: { type: string }
        rehearsalRunId: { type: string }
        sourceSystem: { type: string }
        sourceTable: { type: string }
        sourceId: { type: string }
        attemptedCaseId: { type: string, nullable: true }
        quarantineReasonCode: { type: string }
        quarantineReasonDetail: { type: string }
        recoveryPathRef: { type: string }
        sourceRecordSnapshot: { type: object, additionalProperties: true }
        detectedAt: { type: string }
        recordedAt: { type: string }
        dedupeKey: { type: string, nullable: true }
