openapi: 3.0.3

# =============================================================================
# Case Workspace HTTP API — transcribed from the REAL route handlers.
# =============================================================================
#
# SOURCE OF TRUTH FOR THIS FILE IS CODE, NOT DESIGN DOCS.
# Every path, method, parameter, request schema, status code and error code
# below was read out of:
#
#   server/src/routes/caseWorkspace/*.routes.ts   (125 handlers)
#   server/src/routes/caseWorkspace/_shared/errors.ts     (status mapping)
#   server/src/routes/caseWorkspace/_shared/handler.ts    (actor resolution)
#   server/src/routes/caseWorkspace/_shared/validate.ts   (400 shape)
#   server/src/services/caseWorkspace/*.ts                (response types)
#
# Where a route does NOT implement something the design canon asks for
# (cursor pagination on most lists, PATCH verbs, /api/my-work projections,
# chat promotion), it is ABSENT here. This file
# describes what is mounted today, not what is planned. See
# docs/product/case-workspace/acceptance/API_EVENT_SCHEMA_COVERAGE.csv for the
# gap ledger.
#
# ---------------------------------------------------------------------------
# Mounting
# ---------------------------------------------------------------------------
# Gateway.ts:1235      app.use('/api/v8', v8FeatureGate, v8Router)
# routes/v8/index.ts   v8Router.use(verifyToken)
#                      v8Router.use(requireV8OrgContext)
#                      v8Router.use(attachV8Context)      (line 83)
#                      v8Router.use('/case-workspace', caseWorkspaceRoutes)  (line 100)
#
# organizationId and actorUserId are ALWAYS taken from the authenticated
# `req.v8Context` (handler.ts `resolveActor`), NEVER from a request body or
# query string. No request body below has an `organizationId` field; one
# supplied by a client is stripped by zod before the handler runs.
#
# ---------------------------------------------------------------------------
# Enumeration safety (SEC-009 / CW-DOD-D6)
# ---------------------------------------------------------------------------
# A cross-tenant `caseId` returns 404, never 403 (errors.ts: the
# CaseWorkspaceAuthError code `case_access_denied` maps to 404). Org-role
# failures (`not_org_member`, `insufficient_org_role`) DO return 403 because
# they leak nothing about resource existence. Do not "fix" the 404.
# =============================================================================

info:
  title: Consultify — Case Workspace API
  version: 1.0.0-as-built-2026-08-10
  description: |
    HTTP contract for the 11 Case Workspace domain services.

    **Envelope.** Every success response is `{ "data": <payload> }`. The one
    exception is `GET /process-definitions`, which is the only natively
    paginated list in the codebase and returns
    `{ "data": [...], "nextCursor": string|null }`.

    **Errors.** Every error response is produced by
    `server/src/utils/ErrorHandler.ts#errorHandlerMiddleware` and is shaped
    `{ "status": "fail"|"error", "correlationId": string|null,
       "error": { "code": string, "message": string, ... } }`.
    `error.code` is the SCREAMING_SNAKE upper-casing of the domain service's
    own `snake_case` error code (`_shared/errors.ts#toCaseWorkspaceAppError`),
    so it is stable across releases and safe to branch on.

    **Correlation.** An inbound `X-Correlation-ID` request header is honoured
    and echoed; when absent, one is minted per request
    (`_shared/errors.ts#resolveCorrelationId`).

    **Optimistic concurrency.** Mutations on versioned aggregates take
    `expectedVersion` in the request BODY (not an `If-Match` header). A stale
    value yields `409` with a `*_VERSION_CONFLICT` code and no mutation.

    **Idempotency.** Where a command has an idempotency primitive, the route
    reads the `Idempotency-Key` request header, falling back to a body field.
    The primitive differs per command and is documented per operation:
    proposals use `idempotencyKey`, waits use `correlationKey`, history
    events / value measurements / artifact links / quarantine records use
    `dedupeKey`, capability registration uses the natural
    `(capabilityId, capabilityVersion)` key.

servers:
  - url: /api/v8/case-workspace
    description: Mounted path (see routes/v8/index.ts:100).

security:
  - bearerAuth: []

tags:
  - name: Cases
    description: caseCoreService — the Case aggregate.
  - name: Light one-click
    description: |
      lightOneClickService — "Zatwierdź i rozpocznij" for a LIGHT Case: one
      semantic operation from DRAFT/ACTIVE to a published minimal canonical
      Plan v1 with exactly one bound Run, or an honest, typed refusal. Calls
      into caseCoreService/casePlanVersionService/runBindingService/
      nodeRunService rather than owning any table of its own.
  - name: Plan versions
    description: casePlanVersionService — Case plan drafts, review and publication.
  - name: Capabilities
    description: capabilityRegistryService — PLATFORM-GLOBAL registry (no tenant column).
  - name: Run bindings
    description: runBindingService — binds an execution runId to a published plan version.
  - name: Run lifecycle
    description: |
      runLifecycleService — the canonical §3.4/§4.4 Run aggregate and its
      command set (CreateRun, StartRun, PauseRun, ResumeRun, CancelRun,
      RetryNode, CompensateAction) plus AdvanceRun (graph-progression
      orchestration reaction) and the Wait→NodeRun ProvideNodeInput bridge.
      STANDARD/TRANSFORMATION only for CreateRun/StartRun — a LIGHT Case uses
      `POST /cases/{caseId}/light-start` (Light one-click tag) instead.
  - name: Action proposals
    description: proposalApprovalService — proposals, approval decisions, execution lifecycle.
  - name: Waits
    description: waitSubscriptionService — durable HUMAN/TIMER/DOMAIN_EVENT/EXTERNAL_CALLBACK waits.
  - name: Case history
    description: caseHistoryService — history events and value measurements.
  - name: Plays
    description: playService — reusable process definitions and versions.
  - name: Artifact links
    description: artifactLinkService — Case↔artifact evidence links.
  - name: Execution graph
    description: executionGraphService — gateway evaluations and node result acceptances.
  - name: Migration readiness
    description: migrationReadinessService — feature flags and legacy quarantine.
  - name: Case intake
    description: |
      caseIntakeService — the two-step propose/confirm contract the chat/Teresa
      layer calls to promote a conversation into exactly one Case.
  - name: External event ingress
    description: |
      eventInboxService (CW-T-B) — the authenticated HTTP entry point for
      external EXTERNAL_CALLBACK deliveries. Mounted OUTSIDE
      /api/v8/case-workspace and outside bearer auth — see the operation's
      own description.

paths:

  # ===========================================================================
  # intake.routes.ts — caseIntakeService
  # ===========================================================================
  # TWO-STEP BY DESIGN: there is deliberately NO combined propose-and-confirm
  # endpoint. The whole guarantee of CW-CANON-03 is that a human saw the exact
  # digested work order between the two calls.

  /case-intake/work-orders/propose:
    post:
      tags: [Case intake]
      operationId: proposeWorkOrder
      summary: Digest a work order for human confirmation. Creates NOTHING.
      description: |
        Returns `200`, not `201` — CW-CANON-01: proposing creates no Case and no
        Run, and `data.caseCreated`/`data.runCreated` are always `false` as an
        assertable statement of that. `organizationId` is forced to the
        authenticated org: it is part of the digested payload, so a
        client-supplied value would let a caller mint a digest for a tenant
        they do not belong to.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [workOrder]
              properties:
                workOrder: { $ref: '#/components/schemas/WorkOrderDraft' }
      responses:
        '200':
          description: Work order digested. Nothing was created.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/ProposeWorkOrderResult' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '403': { $ref: '#/components/responses/OrgRoleDenied' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '500': { $ref: '#/components/responses/InternalError' }

  /case-intake/work-orders/confirm:
    post:
      tags: [Case intake]
      operationId: confirmWorkOrder
      summary: Confirm a previously proposed work order; creates exactly one Case.
      description: |
        The status code IS the answer: `201` when this call created the Case,
        `200` when an existing Case was reused (idempotent retry, or a Case
        already existed for the project) — so a client distinguishes the two
        without parsing the body. `confirmedDigest` must be the verbatim
        `sha256:<64 hex>` returned by the propose step; anything else fails
        `422 INTAKE_WORK_ORDER_DIGEST_MISMATCH`. Confirming never starts work
        (`data.runCreated` is always `false`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [workOrder, confirmedDigest]
              properties:
                workOrder: { $ref: '#/components/schemas/WorkOrderDraft' }
                confirmedDigest:
                  type: string
                  pattern: '^sha256:[0-9a-f]{64}$'
      responses:
        '200':
          description: An existing Case was reused.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/ConfirmWorkOrderResult' }
        '201':
          description: Exactly one Case was created by this call.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/ConfirmWorkOrderResult' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '403': { $ref: '#/components/responses/OrgRoleDenied' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '500': { $ref: '#/components/responses/InternalError' }

  /case-intake/cases/{caseId}/work-orders:
    parameters:
      - $ref: '#/components/parameters/CaseId'
    get:
      tags: [Case intake]
      operationId: getConfirmedWorkOrders
      summary: The confirmed work orders behind one Case.
      description: |
        Access is gated inside the service by `requireCaseAccess`, so an unknown
        and a cross-tenant caseId both answer `404`.
      responses:
        '200':
          description: Confirmed work order records.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/ConfirmedWorkOrderRecord' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  # ===========================================================================
  # cases.routes.ts — caseCoreService
  # ===========================================================================

  /cases:
    post:
      tags: [Cases]
      operationId: createCase
      summary: Create a Case.
      description: |
        `organizationId` is forced to the authenticated org; `createdByActorId`
        to the authenticated user.

        ★ CARDINALITY (CW-T-A, binding owner ruling 2026-08-10): a Case is a
        WORK ORDER, and one project MAY and MUST be able to hold MANY
        independent Cases. `case_core.project_id` is a plain FK, NOT unique
        (`server/migrations/20260810d_case_workspace_case_identity.sql`
        dropped the prior `UNIQUE(project_id)`) — a second, third, … Case for
        the same project succeeds with its own `201` and its own `caseId`,
        it does not conflict. The previous revision of this file documented a
        `409 CASE_ALREADY_EXISTS_FOR_PROJECT` here; that error code is no
        longer thrown anywhere in `caseCoreService.createCase` (confirmed by
        reading the function body) and is REMOVED from this operation's
        responses below — it survives only as a now-unreachable entry in
        `_shared/errors.ts`'s status-override table, kept there for backward
        compatibility with any stored payload that still carries the old
        code, not because this route can still produce it.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateCaseBody' }
      responses:
        '201': { $ref: '#/components/responses/CaseCreated' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '403': { $ref: '#/components/responses/OrgRoleDenied' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '500': { $ref: '#/components/responses/InternalError' }
    get:
      tags: [Cases]
      operationId: listCases
      summary: List Cases in the authenticated organization.
      description: |
        Not paginated — the service returns a plain ordered array. There is no
        `cursor`/`limit` parameter on this route today (CW-DOD-I5 gap).
      parameters:
        - { in: query, name: caseStatus, required: false, schema: { $ref: '#/components/schemas/CaseStatus' } }
        - { in: query, name: caseProfile, required: false, schema: { $ref: '#/components/schemas/CaseProfile' } }
        - { in: query, name: governanceTier, required: false, schema: { $ref: '#/components/schemas/GovernanceTier' } }
      responses:
        '200':
          description: Case list.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/CaseCoreView' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '403': { $ref: '#/components/responses/OrgRoleDenied' }
        '500': { $ref: '#/components/responses/InternalError' }

  /cases/by-project/{projectId}:
    get:
      tags: [Cases]
      operationId: getCaseByProject
      summary: Fetch the single Case bound to a project.
      description: |
        Enumeration-safe: a Case belonging to another organization is reported
        as `404 CASE_NOT_FOUND`, identically to a projectId that has no Case.
      parameters:
        - { in: path, name: projectId, required: true, schema: { type: string, minLength: 1 } }
      responses:
        '200': { $ref: '#/components/responses/CaseOk' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  /cases/{caseId}:
    parameters:
      - $ref: '#/components/parameters/CaseId'
    get:
      tags: [Cases]
      operationId: getCase
      summary: Fetch one Case.
      responses:
        '200': { $ref: '#/components/responses/CaseOk' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  /cases/{caseId}/status:
    parameters:
      - $ref: '#/components/parameters/CaseId'
    post:
      tags: [Cases]
      operationId: transitionCaseStatus
      summary: Transition Case status.
      description: |
        Illegal transitions fail `409 CASE_STATUS_TRANSITION_NOT_ALLOWED`
        (the raw message carries a `:FROM->TO` suffix; `error.code` does not).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [targetStatus]
              properties:
                targetStatus: { $ref: '#/components/schemas/CaseStatus' }
                reason: { type: string, minLength: 1 }
      responses:
        '200': { $ref: '#/components/responses/CaseOk' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalError' }

  /cases/{caseId}/governance-tier:
    parameters:
      - $ref: '#/components/parameters/CaseId'
    post:
      tags: [Cases]
      operationId: updateCaseGovernanceTier
      summary: Change the governance tier (append-only history).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tier, reason]
              properties:
                tier: { $ref: '#/components/schemas/GovernanceTier' }
                reason: { type: string, minLength: 1 }
      responses:
        '200': { $ref: '#/components/responses/CaseOk' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalError' }

  /cases/{caseId}/autonomy-policy:
    parameters:
      - $ref: '#/components/parameters/CaseId'
    post:
      tags: [Cases]
      operationId: updateCaseAutonomyPolicy
      summary: Change the Case autonomy policy, capped by the org maximum.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [policy]
              properties:
                policy: { $ref: '#/components/schemas/AutonomyPolicy' }
                orgMaxAutonomyPolicy:
                  allOf: [{ $ref: '#/components/schemas/AutonomyPolicy' }]
                  nullable: true
      responses:
        '200': { $ref: '#/components/responses/CaseOk' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalError' }

  /cases/{caseId}/closure-axis:
    parameters:
      - $ref: '#/components/parameters/CaseId'
    post:
      tags: [Cases]
      operationId: updateCaseClosureAxisStatus
      summary: Set one of the four closure-axis statuses.
      description: |
        The route's zod enum accepts all four values
        (`NOT_APPLICABLE|PENDING|COMPLETED|VALIDATED`), but the service narrows
        per axis: `delivery|decision|implementation` accept `COMPLETED` and
        reject `VALIDATED`; `outcome` accepts `VALIDATED` and rejects
        `COMPLETED`. A mismatched pair is rejected by the service, not by zod.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [axis, status]
              properties:
                axis: { type: string, enum: [delivery, decision, implementation, outcome] }
                status: { type: string, enum: [NOT_APPLICABLE, PENDING, COMPLETED, VALIDATED] }
      responses:
        '200': { $ref: '#/components/responses/CaseOk' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '500': { $ref: '#/components/responses/InternalError' }

  /cases/{caseId}/closure:
    parameters:
      - $ref: '#/components/parameters/CaseId'
    post:
      tags: [Cases]
      operationId: recordCaseClosure
      summary: Record the contracted closure type.
      description: |
        Records `closure_type`; it does NOT set `case_status='CLOSED'` (that is
        `POST /cases/{caseId}/status`). A second call fails
        `409 CASE_CLOSURE_ALREADY_RECORDED`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [closureType]
              properties:
                closureType: { $ref: '#/components/schemas/ClosureType' }
                evidenceRef: { type: string, minLength: 1, nullable: true }
      responses:
        '200': { $ref: '#/components/responses/CaseOk' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalError' }

  /cases/{caseId}/cancel:
    parameters:
      - $ref: '#/components/parameters/CaseId'
    post:
      tags: [Cases]
      operationId: cancelCase
      summary: Cancel a Case (thin wrapper over the CANCELLED status transition).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 1 }
      responses:
        '200': { $ref: '#/components/responses/CaseOk' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalError' }

  # ===========================================================================
  # lightStart.routes.ts — lightOneClickService
  # ===========================================================================

  /cases/{caseId}/light-start:
    parameters:
      - $ref: '#/components/parameters/CaseId'
    post:
      tags: [Light one-click]
      operationId: startLightOneClick
      summary: "\"Zatwierdź i rozpocznij\" for a LIGHT Case — one-click plan + Run."
      description: |
        Takes no request body. Always responds `200`: the service's own
        discriminated `data.outcome` (`started` | `already_started` |
        `refused`) is the caller-facing decision, not an HTTP status — a
        `refused` result is a well-formed, typed answer with an exact reason
        and `blockers[]`, never an error the client must catch.

        Idempotent and safe to double-click: a repeat call for a Case that
        already completed returns `already_started` with the SAME
        `casePlanVersionId`/`runId`, creating nothing new (see the service's
        own header comment for the advisory-lock + resumable-steps design).
        Only a missing/inaccessible Case, an actor identity problem, or a
        genuinely wrong Case profile/status/plan-validation failure is
        reported — the first as `404`/`409`, the rest as the `refused`
        outcome in the `200` body.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      responses:
        '200':
          description: |
            `started` (fresh Run created), `already_started` (idempotent
            replay of a prior completion) or `refused` (zero Run, exact
            reason — see `reasonCode`/`reasonDetail`/`blockers`).
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    oneOf:
                      - type: object
                        required:
                          [outcome, alreadyStarted, caseId, case,
                           casePlanVersionId, planVersion, runId, nodeRunIds]
                        properties:
                          outcome: { type: string, enum: [started] }
                          alreadyStarted: { type: boolean, enum: [false] }
                          caseId: { type: string }
                          case: { $ref: '#/components/schemas/CaseCore' }
                          casePlanVersionId: { type: string }
                          planVersion: { $ref: '#/components/schemas/CasePlanVersion' }
                          runId: { type: string }
                          nodeRunIds: { type: array, items: { type: string } }
                      - type: object
                        required:
                          [outcome, alreadyStarted, caseId, case,
                           casePlanVersionId, planVersion, runId, nodeRunIds]
                        properties:
                          outcome: { type: string, enum: [already_started] }
                          alreadyStarted: { type: boolean, enum: [true] }
                          caseId: { type: string }
                          case: { $ref: '#/components/schemas/CaseCore' }
                          casePlanVersionId: { type: string }
                          planVersion: { $ref: '#/components/schemas/CasePlanVersion' }
                          runId: { type: string }
                          nodeRunIds: { type: array, items: { type: string } }
                      - type: object
                        required: [outcome, alreadyStarted, caseId, case, reasonCode, reasonDetail, blockers]
                        properties:
                          outcome: { type: string, enum: [refused] }
                          alreadyStarted: { type: boolean, enum: [false] }
                          caseId: { type: string }
                          case: { $ref: '#/components/schemas/CaseCore' }
                          reasonCode: { type: string }
                          reasonDetail: { type: string }
                          blockers:
                            type: array
                            items:
                              type: object
                              required: [code, detail, severity]
                              properties:
                                code: { type: string }
                                detail: { type: string }
                                severity: { type: string, enum: [BLOCKING, DEFERRED_EXTERNAL] }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '500': { $ref: '#/components/responses/InternalError' }

  # ===========================================================================
  # casePlanVersions.routes.ts — casePlanVersionService
  # ===========================================================================

  /cases/{caseId}/plan-versions:
    parameters:
      - $ref: '#/components/parameters/CaseId'
    post:
      tags: [Plan versions]
      operationId: createPlanDraft
      summary: Create a DRAFT plan version for a Case.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [semanticGraph]
              properties:
                sourceProcessVersionId: { type: string, minLength: 1, nullable: true }
                supersedesPlanVersionId: { type: string, minLength: 1, nullable: true }
                semanticGraph: { $ref: '#/components/schemas/CanonicalGraph' }
                changeReason: { type: string, minLength: 1, nullable: true }
      responses:
        '201': { $ref: '#/components/responses/PlanVersionCreated' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '500': { $ref: '#/components/responses/InternalError' }
    get:
      tags: [Plan versions]
      operationId: listPlanVersionsForCase
      summary: List all plan versions of a Case (not paginated).
      responses:
        '200':
          description: Plan versions.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/CasePlanVersion' } }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

