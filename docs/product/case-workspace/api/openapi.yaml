        '500': { $ref: '#/components/responses/InternalError' }

  # ===========================================================================
  # eventInbox.routes.ts — eventInboxService (CW-T-B)
  # ===========================================================================
  # NOT mounted under /api/v8/case-workspace and NOT bearer-authenticated —
  # see routes/caseWorkspace/eventInbox.routes.ts's own header comment for why
  # (attachV8Context 403s any caller without a first-party JWT, which every
  # external event sender is). Mounted directly in Gateway.ts, sibling to
  # /api/webhooks/sellix and /api/webhooks/v8-sync — see this packet's report
  # for the exact mount line. Hence the path-level `servers` override and the
  # operation-level `security: []` below (overriding the file-global bearerAuth).
  /{source}/deliveries:
    servers:
      - url: /api/webhooks/case-workspace
        description: |
          Public ingress mount (Gateway.ts, NOT routes/v8/index.ts — this path
          is deliberately outside the v8Router/attachV8Context chain).
    parameters:
      - in: path
        name: source
        required: true
        schema: { type: string, minLength: 1, maxLength: 200 }
        description: |
          The channel key. IS the allowlist: must name a channel a prior
          `registerInboxChannel()` call registered (env-bootstrapped from
          `CASE_WORKSPACE_INBOX_CHANNELS_JSON` in production — see the route
          file). Anything else answers `401 UNAUTHENTICATED`.
    post:
      tags: [External event ingress]
      operationId: receiveExternalEvent
      security: []
      summary: Authenticated delivery of one external event (EXTERNAL_CALLBACK).
      description: |
        The ONLY production entry point into `eventInboxService.
        receiveExternalEvent`'s four-gate trust boundary (authenticate ->
        deduplicate by `(source, eventId)` -> validate tenant/correlation/
        eventType/timestamp -> apply). Every outcome below is FINAL and
        durable except `unauthenticated`, which writes NOTHING (see the
        service's own "step 1 is the single exception" reasoning) — an
        unrecognized channel and a bad signature are answered with the SAME
        generic body so a caller cannot tell "wrong secret" from "channel does
        not exist".

        **Authentication.** HMAC-SHA256 (`eventInboxService.
        computeInboxSignature`) over the canonical-JSON form of `payload`
        ONLY, under the channel's registered secret, compared in constant
        time. `eventId`/`source`/`correlationKey`/`organizationId`/`caseId`
        are NOT covered by the signature — see the route file's header
        comment for the documented residual and why (a frozen 2-argument
        signing contract other test suites already depend on).

        **Timestamp tolerance / replay.** Every production-bootstrapped
        channel requires `payload.deliveredAt` (ISO-8601) and rejects it as
        `422 PAYLOAD_INVALID` when older than 5 minutes or more than 60
        seconds in the future (`eventInboxService.
        isDeliveredAtWithinTolerance`). Because `deliveredAt` lives INSIDE the
        signed `payload`, a party without the channel secret cannot refresh it
        on a captured delivery.

        **Idempotency.** `eventId` is the sender's id; redelivering the exact
        same `(source, eventId)` answers `200 duplicate` and produces NO
        second effect, proved both sequentially and under genuine concurrency
        — see `integration/inboxIngress.pg.test.ts`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [eventId, eventType, organizationId, correlationKey, payload, signature]
              properties:
                eventId: { type: string, minLength: 1, maxLength: 500 }
                eventType: { type: string, minLength: 1, maxLength: 200 }
                organizationId:
                  type: string
                  minLength: 1
                  maxLength: 256
                  description: The tenant the sender CLAIMS — verified against the resolved wait, never trusted on its own.
                projectId: { type: string, nullable: true }
                correlationKey: { type: string, minLength: 1, maxLength: 500 }
                caseId: { type: string, nullable: true }
                runId: { type: string, nullable: true }
                nodeRunId: { type: string, nullable: true }
                payload:
                  type: object
                  description: |
                    Sender-defined domain content. `deliveredAt` (ISO-8601) is
                    REQUIRED by every production channel — see this
                    operation's description.
                  additionalProperties: true
                signature:
                  type: string
                  minLength: 1
                  maxLength: 500
                  description: Hex HMAC-SHA256 — see this operation's Authentication section.
      responses:
        '200':
          description: Applied, or an idempotent duplicate of a previously applied/rejected delivery.
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    required: [received, outcome, inboxRecordId, waitId]
                    properties:
                      received: { type: boolean, enum: [true] }
                      outcome: { type: string, enum: [applied] }
                      inboxRecordId: { type: string }
                      waitId: { type: string }
                  - type: object
                    required: [received, outcome, inboxRecordId, firstReceivedAt]
                    properties:
                      received: { type: boolean, enum: [true] }
                      outcome: { type: string, enum: [duplicate] }
                      inboxRecordId: { type: string }
                      firstReceivedAt: { type: string, format: date-time }
        '400':
          description: Malformed request shape (zod).
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code: { type: string, enum: [VALIDATION_ERROR] }
        '401':
          description: |
            Unrecognized channel OR bad/missing signature — deliberately
            indistinguishable in the response body (see this operation's
            description). NO row is written for this outcome.
          content:
            application/json:
              schema:
                type: object
                properties:
                  received: { type: boolean, enum: [false] }
                  error:
                    type: object
                    properties:
                      code: { type: string, enum: [UNAUTHENTICATED] }
        '413':
          description: Redacted payload exceeds the service's size ceiling (`inbox_redacted_payload_too_large`).
        '422':
          description: |
            Authenticated and durably recorded, but not applied. `error.code`
            is one of `TENANT_MISMATCH`, `CORRELATION_UNKNOWN`,
            `CORRELATION_AMBIGUOUS`, `PAYLOAD_INVALID` (also covers: stale/
            future `deliveredAt`, and an `eventType` outside the channel's
            `allowedEventTypes`), `WAIT_NOT_ACTIVE`, `WAIT_TYPE_MISMATCH`.
          content:
            application/json:
              schema:
                type: object
                required: [received, outcome, inboxRecordId, error]
                properties:
                  received: { type: boolean, enum: [true] }
                  outcome: { type: string, enum: [rejected] }
                  inboxRecordId: { type: string }
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        enum:
                          - TENANT_MISMATCH
                          - CORRELATION_UNKNOWN
                          - CORRELATION_AMBIGUOUS
                          - PAYLOAD_INVALID
                          - WAIT_NOT_ACTIVE
                          - WAIT_TYPE_MISMATCH
        '500': { $ref: '#/components/responses/InternalError' }

# =============================================================================
components:
# =============================================================================

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Verified by `verifyToken` and `requireV8OrgContext` upstream of this
        router (routes/v8/index.ts:55-56, 83). The case-workspace handlers
        themselves never parse a token — they read the already-populated
        `req.v8Context`.

  parameters:
    CaseId:
      { in: path, name: caseId, required: true, schema: { type: string, minLength: 1 } }
    PlanVersionId:
      { in: path, name: planVersionId, required: true, schema: { type: string, minLength: 1 } }
    RunId:
      { in: path, name: runId, required: true, schema: { type: string, minLength: 1 } }
    NodeRunId:
      { in: path, name: nodeRunId, required: true, schema: { type: string, minLength: 1 } }
    NodeId:
      { in: path, name: nodeId, required: true, schema: { type: string, minLength: 1 } }
    WaitId:
      { in: path, name: waitId, required: true, schema: { type: string, minLength: 1 } }
    LinkId:
      { in: path, name: linkId, required: true, schema: { type: string, minLength: 1 } }
    ActionProposalId:
      { in: path, name: actionProposalId, required: true, schema: { type: string, minLength: 1 } }
    ProcessDefinitionId:
      { in: path, name: processDefinitionId, required: true, schema: { type: string, minLength: 1 } }
    ProcessVersionId:
      { in: path, name: processVersionId, required: true, schema: { type: string, minLength: 1 } }
    CapabilityRegistryId:
      { in: path, name: capabilityRegistryId, required: true, schema: { type: string, minLength: 1 } }
    FlagKey:
      { in: path, name: flagKey, required: true, schema: { type: string, minLength: 1 } }
    IdempotencyKeyHeader:
      in: header
      name: Idempotency-Key
      required: false
      schema: { type: string, minLength: 1 }
      description: |
        Read by `_shared/handler.ts#readIdempotencyKeyHeader`. What it maps to
        differs per command — see the operation description.

  # ---------------------------------------------------------------------------
  responses:
  # ---------------------------------------------------------------------------

    ValidationError:
      description: |
        Request body / query / path parameters failed zod validation, or a
        required idempotency key was absent. `error.code` is
        `VALIDATION_ERROR`; `error.issues[]` carries `{path,message,code}` per
        failure (see `_shared/validate.ts`). Some routes emit a bare
        `{ error: { code, message } }` for the missing-idempotency-key case
        without going through the error middleware.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    OrgRoleDenied:
      description: |
        `not_org_member` or `insufficient_org_role` (403), or a genuine
        caller-identity authorization failure (`SELF_APPROVAL_FORBIDDEN`,
        `PLAN_DIFF_CROSS_CASE_FORBIDDEN`,
        `PROCESS_DEFINITION_SHARE_NOT_AUTHORIZED`). NOT used for cross-tenant
        resource access — that is 404.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    NotFound:
      description: |
        The resource does not exist, OR it exists in a different tenant
        (`case_access_denied` → 404, SEC-009 enumeration safety).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Conflict:
      description: |
        Optimistic-concurrency conflict (`*_VERSION_CONFLICT`), uniqueness
        conflict (`*_ALREADY_*`, `IDEMPOTENCY_KEY_CONFLICT`), or the resource
        is in the wrong lifecycle state for this action (`*_NOT_EDITABLE`,
        `*_NOT_ACTIVE`, `*_EXPIRED`, `*_VALIDATION_FAILED`,
        `*_STATUS_TRANSITION_NOT_ALLOWED`). No mutation occurred.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Unprocessable:
      description: |
        Cross-reference / cross-tenant consistency failure between
        caller-supplied ids (`*_MISMATCH`, `*_INVALID`), or a business rule
        this codebase classifies as unprocessable. Also the fallback status for
        any unrecognized `snake_case` domain error code.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    InternalError:
      description: |
        Unexpected failure, or a genuine internal invariant breach
        (`*_INSERT_FAILED`, `*_IDEMPOTENCY_RECORD_NOT_FOUND`). Never leaks a
        stack trace or SQL text in production.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }

    CaseOk:
