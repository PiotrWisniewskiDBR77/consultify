  # ===========================================================================
  # capabilities.routes.ts — capabilityRegistryService (PLATFORM-GLOBAL)
  # ===========================================================================

  /capabilities:
    post:
      tags: [Capabilities]
      operationId: registerCapability
      summary: Register a capability version. Requires org role ADMIN.
      description: |
        **KNOWN DEFECT CW-API-CAP-ENUM-01 — this endpoint is UNREACHABLE today.**
        The route's zod enum for `approvalRecommendation`
        (`capabilities.routes.ts:44`: `AUTO | NOTIFY_ONLY | REQUIRE_APPROVAL`)
        is DISJOINT from the set the service validates against
        (`types/executionSpine.ts:43` `ApprovalClassValues`:
        `requires_human_approval | policy_approvable | auto_executable`). An
        uppercase value passes zod and dies in the service with
        `400 CAPABILITY_APPROVAL_RECOMMENDATION_INVALID`; a snake_case value
        dies in zod with `400 VALIDATION_ERROR`. So the Capability Registry has
        no working HTTP write path, and CW-DOD-C1 cannot be met through this
        API. Pinned by `idempotencyAndPagination.contract.pg.test.ts` →
        "KNOWN DEFECT CW-API-CAP-ENUM-01". The `ApprovalClass` schema below
        documents the ROUTE's enum, which is the one a client currently has to
        send to get past validation — it is not the accepted set.
        Fix: make the route enum `z.enum(ApprovalClassValues)`.

        Once reachable: the registry has no tenant column, so writes are gated
        on org role ADMIN as a platform-governance action, and re-registering
        the same `(capabilityId, capabilityVersion)` fails
        `409 CAPABILITY_ALREADY_REGISTERED` — the safe-replay signal.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterCapabilityBody' }
      responses:
        '201':
          description: Registered.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/CapabilityRegistryEntry' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '403': { $ref: '#/components/responses/OrgRoleDenied' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalError' }
    get:
      tags: [Capabilities]
      operationId: listCapabilities
      summary: List registry entries (platform-global, not paginated).
      parameters:
        - { in: query, name: ownerModule, required: false, schema: { type: string, minLength: 1 } }
        - { in: query, name: lifecycle, required: false, schema: { $ref: '#/components/schemas/CapabilityLifecycle' } }
        - { in: query, name: capabilityId, required: false, schema: { type: string, minLength: 1 } }
