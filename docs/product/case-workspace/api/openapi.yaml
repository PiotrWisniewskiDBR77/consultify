  # ===========================================================================
  # waitSubscriptions.routes.ts — waitSubscriptionService
  # ===========================================================================
  # NOT ROUTED (internal scheduler-only): claimTimerWait,
  # renewTimerWaitClaimLease, expireWait, listDueTimerWaitsForClaim. There is
  # therefore NO HTTP way to expire a wait; expiry is a worker concern.

  /cases/{caseId}/waits:
    parameters:
      - $ref: '#/components/parameters/CaseId'
    post:
      tags: [Waits]
      operationId: createWait
      summary: Register a durable wait on a Case.
      description: |
        The idempotency primitive is `correlationKey`, unique per
        `(caseId, correlationKey)`. Supply it in the body or as an
        `Idempotency-Key` header; neither present → `400 VALIDATION_ERROR`.

        Replaying the same `(correlationKey, waitType)` is IDEMPOTENT, not a
        conflict: the service does `INSERT ... ON CONFLICT DO NOTHING`, then
        re-SELECTs and compares `waitType`, so the replay returns `201` with the
        SAME `waitId` and no second row. Only a replay that DISAGREES about
        `waitType` fails closed with `409 WAIT_CORRELATION_KEY_CONFLICT`.

        A wait must also have a target: at least one of `runId` or
        `actionProposalId` is required by the SERVICE (zod does not enforce it),
        and omitting both is `400 WAIT_TARGET_REQUIRED`. A supplied `runId` must
        already have a run binding for this same Case, else
        `404 WAIT_RUN_BINDING_NOT_FOUND` / `422 WAIT_RUN_BINDING_CASE_MISMATCH`.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateWaitBody' }
      responses:
        '201':
          description: Wait registered.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/CaseWait' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '500': { $ref: '#/components/responses/InternalError' }
    get:
      tags: [Waits]
      operationId: listWaitsForCase
      summary: List a Case's waits (not paginated).
      parameters:
        - { in: query, name: status, required: false, schema: { $ref: '#/components/schemas/CaseWaitStatus' } }
        - { in: query, name: waitType, required: false, schema: { $ref: '#/components/schemas/CaseWaitType' } }
      responses:
        '200': { $ref: '#/components/responses/WaitListOk' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  /runs/{runId}/waits:
    parameters:
      - $ref: '#/components/parameters/RunId'
    get:
      tags: [Waits]
      operationId: listWaitsForRun
      summary: List one run's waits (all-or-nothing authorization, as for proposals).
      responses:
        '200': { $ref: '#/components/responses/WaitListOk' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  /waits/{waitId}:
    parameters:
      - $ref: '#/components/parameters/WaitId'
    get:
      tags: [Waits]
      operationId: getWait
      summary: Fetch one wait.
      responses:
        '200': { $ref: '#/components/responses/WaitOk' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  /waits/{waitId}/resolve:
    parameters:
      - $ref: '#/components/parameters/WaitId'
    post:
      tags: [Waits]
      operationId: resolveWait
      summary: ACTIVE → SATISFIED, attributed to the satisfying event.
      description: |
        `timerClaim` is REQUIRED and CAS-checked when the target wait's type is
        `TIMER`; a mismatched fencing token fails `409 WAIT_CLAIM_FENCED`.
        Re-resolving a non-ACTIVE wait fails `409 WAIT_NOT_ACTIVE`, so a
        duplicate or late callback is audited but never reactivates a
        completed wait.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [satisfiedByEventId, expectedVersion]
              properties:
                satisfiedByEventId: { type: string, minLength: 1 }
                timerClaim:
                  type: object
                  required: [ownerToken, fencingToken]
                  properties:
                    ownerToken: { type: string, minLength: 1 }
                    fencingToken: { type: integer }
                expectedVersion: { type: integer }
      responses:
        '200': { $ref: '#/components/responses/WaitOk' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalError' }

  /waits/{waitId}/human-input:
    parameters:
      - $ref: '#/components/parameters/WaitId'
    post:
      tags: [Waits]
      operationId: provideHumanInput
      summary: Satisfy a HUMAN wait with an input reference.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [inputRef, expectedVersion]
              properties:
                inputRef: { type: string, minLength: 1 }
                expectedVersion: { type: integer }
      responses:
        '200': { $ref: '#/components/responses/WaitOk' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalError' }

  /waits/{waitId}/cancel:
    parameters:
      - $ref: '#/components/parameters/WaitId'
    post:
      tags: [Waits]
      operationId: cancelWait
      summary: ACTIVE → CANCELLED with a recorded reason.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReasonAndExpectedVersionBody' }
      responses:
        '200': { $ref: '#/components/responses/WaitOk' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalError' }

  # ===========================================================================
  # caseHistory.routes.ts — caseHistoryService
  # ===========================================================================

  /cases/{caseId}/history-events:
    parameters:
      - $ref: '#/components/parameters/CaseId'
    post:
      tags: [Case history]
      operationId: appendCaseHistoryEvent
      summary: Append one immutable Case history event.
      description: |
        `organizationId` and `actorId` are forced to the authenticated actor.
        `dedupeKey` (body, or the `Idempotency-Key` header) makes the append
        idempotent. `correlationId` defaults to the request's correlation id.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AppendCaseHistoryEventBody' }
      responses:
        '201':
          description: Appended (or deduplicated to the existing row).
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/CaseHistoryEvent' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '500': { $ref: '#/components/responses/InternalError' }
    get:
      tags: [Case history]
      operationId: listCaseHistoryEventsForCase
      summary: Read the Case history stream.
      description: |
        The ONE keyset-paginated read in this API that is not the process
        definition list: `afterSeq` is the global sequence cursor and `limit`
        caps the page (max 1000). No `nextCursor` is returned — the caller
        advances `afterSeq` from the last item's `globalSeq`.
      parameters:
        - { in: query, name: eventType, required: false, schema: { type: string, minLength: 1 } }
        - { in: query, name: sourceTable, required: false, schema: { type: string, minLength: 1 } }
        - { in: query, name: occurredSince, required: false, schema: { type: string, minLength: 1 } }
        - { in: query, name: occurredUntil, required: false, schema: { type: string, minLength: 1 } }
        - { in: query, name: afterSeq, required: false, schema: { type: integer } }
        - { in: query, name: limit, required: false, schema: { type: integer, minimum: 1, maximum: 1000 } }
      responses:
        '200':
          description: History events, ascending by globalSeq.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/CaseHistoryEvent' } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  /history-events/{eventId}:
    parameters:
      - { in: path, name: eventId, required: true, schema: { type: string, minLength: 1 } }
    get:
      tags: [Case history]
      operationId: getCaseHistoryEvent
      summary: Fetch one history event by id.
      responses:
        '200':
          description: History event.
          content:
            application/json:
              schema:
                type: object
