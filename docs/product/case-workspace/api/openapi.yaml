      operationId: recordCapabilityIdempotencyKeyCheck
      summary: Claim (or detect a replay of) an idempotency key. Requires org role ADMIN.
      description: |
        Status code IS the answer: `201` on first claim, `200` when the key was
        already recorded (`data.isDuplicate === true`). The key comes from the
