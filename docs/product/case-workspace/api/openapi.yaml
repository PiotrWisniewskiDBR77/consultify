  # ===========================================================================
  # runLifecycle.routes.ts — runLifecycleService
  # ===========================================================================
  # §3.4/§4.4 Run aggregate. STANDARD/TRANSFORMATION only for createRun/
  # startRun — a LIGHT Case's one-click path is `POST /cases/{caseId}/
  # light-start` (lightOneClickService, "Light one-click" tag); this file
  # never duplicates that planning/binding decision. Every mutation takes
  # `expectedVersion` in the body (OCC — see the top-level description's
  # "Optimistic concurrency" section) except createRun (idempotencyKey-keyed
  # instead, no prior version to race against) and advanceRun/retryNode
  # (progression commands with their own idempotency, not version-guarded
  # writes from the caller's point of view).

  /cases/{caseId}/runs:
    parameters:
      - $ref: '#/components/parameters/CaseId'
    post:
      tags: [Run lifecycle]
      operationId: createRun
      summary: Create a Run (CREATED, zero NodeRuns) against a PUBLISHED plan version.
      description: |
        STANDARD/TRANSFORMATION only — a LIGHT Case's `casePlanVersionId`
        refuses with `409 RUN_LIFECYCLE_LIGHT_CASE_REQUIRES_ONE_CLICK`
        (use `POST /cases/{caseId}/light-start` instead). Requires the
        referenced `casePlanVersionId` to already be `PUBLISHED`
        (`422 RUN_LIFECYCLE_PLAN_NOT_PUBLISHED` otherwise) and creates NO
        NodeRuns — only a separate `POST /runs/{runId}/start` call ever
        moves the Run to `RUNNING`. A `DRAFT` Case is auto-activated to
        `ACTIVE` as part of this call.

        An `Idempotency-Key` request header or `body.idempotencyKey` is
        REQUIRED; omitting both is `400 VALIDATION_ERROR`. Idempotent on
        `(caseId, idempotencyKey)`: a replay returns the SAME Run unchanged
        and creates nothing new.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [casePlanVersionId]
              properties:
                casePlanVersionId: { type: string, minLength: 1 }
                idempotencyKey: { type: string, minLength: 1 }
                correlationId: { type: string, minLength: 1, nullable: true }
      responses:
        '201': { $ref: '#/components/responses/RunCreated' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '403': { $ref: '#/components/responses/OrgRoleDenied' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '500': { $ref: '#/components/responses/InternalError' }
    get:
      tags: [Run lifecycle]
      operationId: listRunsForCase
      summary: List every Run for a Case, newest first.
      responses:
        '200': { $ref: '#/components/responses/RunListOk' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '403': { $ref: '#/components/responses/OrgRoleDenied' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  /runs/{runId}:
    parameters:
      - $ref: '#/components/parameters/RunId'
    get:
      tags: [Run lifecycle]
      operationId: getRun
      summary: Fetch one Run.
      description: |
        A nonexistent runId responds `404 RUN_NOT_FOUND` via a bare
        `{ "error": { "code", "message" } }` body (not routed through the
        error middleware — same convention as this file's own
        "missing-idempotency-key" bare-error case, see the top-level
        description). A cross-tenant runId is indistinguishable from this
        same `404` (SEC-009), raised from `requireCaseAccess` instead.
      responses:
        '200':
          description: Run readback.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Run' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '403': { $ref: '#/components/responses/OrgRoleDenied' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  /runs/{runId}/start:
    parameters:
      - $ref: '#/components/parameters/RunId'
    post:
      tags: [Run lifecycle]
      operationId: startRun
      summary: CREATED → RUNNING — mints entry NodeRuns and enters the graph.
      description: |
        Takes no request body. Idempotent: a Run already past `CREATED`
        responds `200` with `data.outcome = "already_started"` and the Run
        unchanged, rather than erroring — EXCEPT a `CANCELLED`/`FAILED` Run,
        which refuses `409 RUN_LIFECYCLE_STATUS_TRANSITION_NOT_ALLOWED`. On a
        fresh `CREATED` Run: re-verifies the bound plan version is still
        `PUBLISHED` with at least one entry node
        (`422 RUN_LIFECYCLE_PLAN_NOT_PUBLISHED`,
        `409 RUN_LIFECYCLE_START_VALIDATION_FAILED` if it has zero entry
        nodes), mints a `READY` NodeRun for every entry node, and lands on
        `RUNNING` with `startedAt` stamped as one physical transition.
      responses:
        '200':
          description: '`started` (fresh entry NodeRuns minted) or `already_started` (idempotent replay).'
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/StartRunResult' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '403': { $ref: '#/components/responses/OrgRoleDenied' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '500': { $ref: '#/components/responses/InternalError' }

  /runs/{runId}/pause:
    parameters:
      - $ref: '#/components/parameters/RunId'
    post:
      tags: [Run lifecycle]
      operationId: pauseRun
      summary: RUNNING → PAUSED. Stops new automatic dispatch.
      description: |
        `advanceRun` refuses on a `PAUSED` Run (only its active family —
        RUNNING/WAITING/BLOCKED/RETRY_SCHEDULED — is eligible). Any other
        source status fails `409 RUN_LIFECYCLE_STATUS_TRANSITION_NOT_ALLOWED`;
        a stale `expectedVersion` fails `409 RUN_LIFECYCLE_VERSION_CONFLICT`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExpectedVersionBody' }
      responses:
        '200': { $ref: '#/components/responses/RunOk' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '403': { $ref: '#/components/responses/OrgRoleDenied' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalError' }

  /runs/{runId}/resume:
    parameters:
      - $ref: '#/components/parameters/RunId'
    post:
      tags: [Run lifecycle]
      operationId: resumeRun
      summary: PAUSED → RUNNING.
      description: |
        Any source status other than `PAUSED` fails
        `409 RUN_LIFECYCLE_STATUS_TRANSITION_NOT_ALLOWED`; a stale
        `expectedVersion` fails `409 RUN_LIFECYCLE_VERSION_CONFLICT`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExpectedVersionBody' }
      responses:
        '200': { $ref: '#/components/responses/RunOk' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '403': { $ref: '#/components/responses/OrgRoleDenied' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalError' }

  /runs/{runId}/cancel:
    parameters:
      - $ref: '#/components/parameters/RunId'
    post:
      tags: [Run lifecycle]
      operationId: cancelRun
      summary: Any pre-terminal status → CANCELLED, cascading to cancellable NodeRuns.
      description: |
        Cascades: every NodeRun of this Run currently `PENDING`/`READY`/
        `WAITING_HUMAN`/`WAITING_TIMER`/`WAITING_EVENT`/`FAILED_RETRYABLE` is
        transitioned to `CANCELLED` too. A `RUNNING`/`CLAIMED` NodeRun is left
        alone — it must terminate or time out on its own (nodeRunService's
        own §4.5 rule). A Run already in a terminal status
        (`COMPLETED`/`COMPLETED_WITH_WARNINGS`/`FAILED`/`CANCELLED`/
        `COMPENSATED`) fails `409 RUN_LIFECYCLE_STATUS_TRANSITION_NOT_ALLOWED`;
        a stale `expectedVersion` fails `409 RUN_LIFECYCLE_VERSION_CONFLICT`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expectedVersion]
              properties:
                expectedVersion: { type: integer }
                reason: { type: string, minLength: 1 }
      responses:
        '200': { $ref: '#/components/responses/RunOk' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '403': { $ref: '#/components/responses/OrgRoleDenied' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalError' }

  /runs/{runId}/advance:
    parameters:
      - $ref: '#/components/parameters/RunId'
    post:
      tags: [Run lifecycle]
      operationId: advanceRun
      summary: Graph-progression reaction — creates NodeRuns for now-satisfied successors and recomputes Run status.
      description: |
        Takes no request body. A no-op (Run returned unchanged,
        `createdNodeRunIds: []`) unless the Run is currently in its active
        family (RUNNING/WAITING/BLOCKED/RETRY_SCHEDULED). Resolves
        `DECISION_GATEWAY` nodes from an ALREADY-recorded gateway evaluation
        only — never guesses a branch
        (`422 RUN_LIFECYCLE_GATEWAY_EVALUATION_MISSING_AFTER_SUCCESS` /
        `_UNEXPECTED_OUTCOME` / `_MISSING_SELECTED_EDGE` if the recorded fact
        is malformed; `404 RUN_LIFECYCLE_GATEWAY_EVALUATION_SELECTED_EDGE_NOT_FOUND`
        if it points at an edge that does not belong to that gateway — an
        `_not_found`-suffixed code, mapped generically like every other
        not-found code in this file, even though it signals malformed data
        rather than a missing resource). `PARALLEL_SPLIT`/`PARALLEL_JOIN`
        nodes are resolved by this endpoint itself the moment their own
        readiness is satisfied. Never auto-declares a Run `FAILED` — a stuck
        Run settles into `BLOCKED` for a human to `retryNode`/`failRun`/
        `cancelRun`.
      responses:
        '200':
          description: Run (possibly unchanged) plus any NodeRuns created this call.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/AdvanceRunResult' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '403': { $ref: '#/components/responses/OrgRoleDenied' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '500': { $ref: '#/components/responses/InternalError' }

  /runs/{runId}/fail:
    parameters:
      - $ref: '#/components/parameters/RunId'
    post:
      tags: [Run lifecycle]
      operationId: failRun
      summary: Explicit, human-authored write-off — BLOCKED or RUNNING → FAILED.
      description: |
        Never inferred automatically — `advanceRun` settles a stuck Run into
        `BLOCKED` and waits for exactly this call (or `retryNode`/
        `cancelRun`) rather than declaring failure itself. A source status
        other than `RUNNING`/`BLOCKED` (per the documented transition table)
        fails `409 RUN_LIFECYCLE_STATUS_TRANSITION_NOT_ALLOWED`; a stale
        `expectedVersion` fails `409 RUN_LIFECYCLE_VERSION_CONFLICT`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReasonAndExpectedVersionBody' }
      responses:
        '200': { $ref: '#/components/responses/RunOk' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '403': { $ref: '#/components/responses/OrgRoleDenied' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalError' }

  /runs/{runId}/outcome:
    parameters:
      - $ref: '#/components/parameters/RunId'
    post:
      tags: [Run lifecycle]
      operationId: recordRunOutcome
      summary: Set the business outcomeStatus once the Run has technically completed.
      description: |
        §4.4: "Technical completion is separate from outcomeStatus" — never
        inferred automatically. Only legal once the Run's status is
        `COMPLETED`/`COMPLETED_WITH_WARNINGS`/`FAILED`/`CANCELLED`/
        `COMPENSATED` (`422 RUN_LIFECYCLE_NOT_TECHNICALLY_COMPLETE`
        otherwise). A stale `expectedVersion` fails
        `409 RUN_LIFECYCLE_VERSION_CONFLICT`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expectedVersion, outcomeStatus]
              properties:
                expectedVersion: { type: integer }
                outcomeStatus: { $ref: '#/components/schemas/RunOutcomeStatus' }
      responses:
        '200': { $ref: '#/components/responses/RunOk' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '403': { $ref: '#/components/responses/OrgRoleDenied' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '500': { $ref: '#/components/responses/InternalError' }

  /runs/{runId}/compensate:
    parameters:
      - $ref: '#/components/parameters/RunId'
    post:
      tags: [Run lifecycle]
      operationId: compensateRun
      summary: Start compensation — RUNNING|CANCELLED → COMPENSATING, marks REQUIRED NodeRuns IN_PROGRESS.
      description: |
        Records the fact only — the actual reversal of an external effect is
        a capability-adapter concern; the caller/worker performs it and
        reports back via `POST /runs/{runId}/node-runs/{nodeRunId}/compensation-outcome`
        per marked node. A source status other than `RUNNING`/`CANCELLED`
        fails `409 RUN_LIFECYCLE_STATUS_TRANSITION_NOT_ALLOWED`; a stale
        `expectedVersion` fails `409 RUN_LIFECYCLE_VERSION_CONFLICT`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExpectedVersionBody' }
      responses:
        '200':
          description: Run (now COMPENSATING) plus the NodeRun ids marked IN_PROGRESS.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/CompensateRunResult' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '403': { $ref: '#/components/responses/OrgRoleDenied' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalError' }

  /runs/{runId}/nodes/{nodeId}/retry:
    parameters:
      - $ref: '#/components/parameters/RunId'
      - $ref: '#/components/parameters/NodeId'
    post:
      tags: [Run lifecycle]
      operationId: retryNode
      summary: Human-authorized new attempt at a node — mints a NEW NodeRun, never a second parallel effect.
      description: |
        Only legal once the node's latest NodeRun has exhausted its
        automatic retry budget (`FAILED_TERMINAL`) or was `CANCELLED`
        (`422 RUN_LIFECYCLE_NODE_NOT_RETRYABLE` if it is still live or
        already succeeded; `422 RUN_LIFECYCLE_NODE_NEVER_RAN` if the node has
        no NodeRun at all). The Run itself must be in a "work can still
        happen" status (RUNNING/PAUSED/WAITING/BLOCKED/RETRY_SCHEDULED —
        `409 RUN_LIFECYCLE_STATUS_TRANSITION_NOT_ALLOWED` otherwise); if it
        was WAITING/BLOCKED/RETRY_SCHEDULED it is brought back to RUNNING as
        part of this call. Idempotent on `idempotencyKey` (header or body) —
        a duplicated click mints no second business effect.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                idempotencyKey: { type: string, minLength: 1 }
                maxAttempts: { type: integer, minimum: 1 }
      responses:
        '200':
          description: Run (resumed to RUNNING if it was WAITING/BLOCKED/RETRY_SCHEDULED) plus the newly minted NodeRun.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/RetryNodeResult' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '403': { $ref: '#/components/responses/OrgRoleDenied' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '500': { $ref: '#/components/responses/InternalError' }

  /runs/{runId}/node-runs/{nodeRunId}/compensation-outcome:
    parameters:
      - $ref: '#/components/parameters/RunId'
      - $ref: '#/components/parameters/NodeRunId'
    post:
      tags: [Run lifecycle]
      operationId: recordNodeCompensationOutcome
      summary: A worker reports one node's compensation outcome.
      description: |
        Only legal while the Run is `COMPENSATING`
        (`409 RUN_LIFECYCLE_STATUS_TRANSITION_NOT_ALLOWED` otherwise). Once
        every node this Run marked `IN_PROGRESS` (via
        `POST /runs/{runId}/compensate`) has reached a terminal compensation
        state, the Run itself resolves: all `COMPLETED` →
        Run `COMPENSATED`; any `FAILED` → Run `FAILED`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [outcome]
              properties:
                outcome: { type: string, enum: [COMPLETED, FAILED] }
      responses:
        '200': { $ref: '#/components/responses/RunOk' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '403': { $ref: '#/components/responses/OrgRoleDenied' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalError' }

  /node-runs/{nodeRunId}/provide-input:
    parameters:
      - $ref: '#/components/parameters/NodeRunId'
    post:
      tags: [Run lifecycle]
      operationId: provideNodeInput
      summary: Bridges a satisfied HUMAN wait back to the WAITING_HUMAN NodeRun parked on it.
      description: |
        The NEW NodeRun-scoped connective tissue — the `wait.human_input_
        provided` event still fires on the Wait aggregate itself (via
        `waitSubscriptionService.provideHumanInput`, called internally), then
        this endpoint transitions the NodeRun `WAITING_HUMAN` → `READY` and,
        if the Run itself is `WAITING` and no OTHER NodeRun is still waiting,
        resumes the Run to `RUNNING`. `422 RUN_LIFECYCLE_NODE_RUN_NOT_WAITING_HUMAN`
        if the NodeRun is not currently `WAITING_HUMAN`. NOT one atomic
        transaction across the wait/NodeRun/Run writes — each step is itself
        OCC/idempotent-guarded, so a crash between steps leaves a safely
        re-driveable state, never a lost update.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [inputRef]
              properties:
                inputRef: { type: string, minLength: 1 }
      responses:
        '200':
          description: The NodeRun (now READY) plus its Run (resumed to RUNNING if nothing else is still waiting).
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/ProvideNodeInputResult' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '403': { $ref: '#/components/responses/OrgRoleDenied' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '500': { $ref: '#/components/responses/InternalError' }

  # ===========================================================================
  # actionProposals.routes.ts — proposalApprovalService
  # ===========================================================================

  /cases/{caseId}/proposals:
    parameters:
      - $ref: '#/components/parameters/CaseId'
    post:
      tags: [Action proposals]
      operationId: createActionProposal
      summary: Create an action proposal (idempotent on idempotencyKey).
      description: |
        An `Idempotency-Key` header or `body.idempotencyKey` is REQUIRED;
        omitting both is `400 VALIDATION_ERROR`. Replaying the same key with a
        different payload digest fails `409 IDEMPOTENCY_KEY_CONFLICT`.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateActionProposalBody' }
      responses:
        '201':
          description: Created (or replayed).
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/CaseActionProposal' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '500': { $ref: '#/components/responses/InternalError' }
    get:
      tags: [Action proposals]
      operationId: listActionProposalsForCase
