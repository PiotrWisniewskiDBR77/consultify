sonar.projectKey=consultify-platform
sonar.organization=dbr77
sonar.projectName=Consultify Platform
sonar.sources=src,server/src,packages/shared/src
sonar.tests=tests
sonar.sourceEncoding=UTF-8

# Exclusions
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,**/*.spec.ts,**/*.test.ts,**/*.test.tsx,**/migrations/**,public/**
sonar.test.inclusions=tests/**/*.test.ts,tests/**/*.test.tsx,tests/**/*.test.js

# TypeScript / Javascript
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Duplication
sonar.cpd.exclusions=tests/**,**/types/**,**/config/**
