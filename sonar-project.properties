# SonarQube/SonarCloud Project Configuration
# https://docs.sonarqube.org/latest/analysis/analysis-parameters/

# Project identification
sonar.projectKey=consultify
sonar.projectName=Consultify
sonar.projectVersion=1.0

# Source code location
sonar.sources=server,src,components
sonar.sourceEncoding=UTF-8

# Test code location
sonar.tests=tests
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.test.js,**/*.spec.ts,**/*.spec.tsx,**/*.spec.js

# Exclusions
sonar.exclusions=**/*.test.ts,**/*.test.tsx,**/*.test.js,**/*.spec.ts,**/*.spec.tsx,**/*.spec.js,**/__mocks__/**,**/node_modules/**,**/dist/**,**/build/**,**/*.d.ts,**/*.map,server/scripts/**,server/workers/**,server/seed_*.js,server/fix_*.js,server/inspect_*.js,server/migrate_*.js,server/test-*.js,server/database.postgres.js,server/database.sqlite.js

# Coverage reports
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.typescript.lcov.reportPaths=coverage/lcov.info
sonar.coverage.exclusions=**/*.test.ts,**/*.test.tsx,**/*.test.js,**/*.spec.ts,**/*.spec.tsx,**/*.spec.js,**/__mocks__/**,**/node_modules/**,**/dist/**,**/build/**,**/*.d.ts,**/*.map,server/scripts/**,server/workers/**,server/seed_*.js,server/fix_*.js,server/inspect_*.js,server/migrate_*.js,server/test-*.js,server/database.postgres.js,server/database.sqlite.js

# Language settings
sonar.language=js,ts

# TypeScript configuration
sonar.typescript.tsconfigPath=tsconfig.json

# Code quality gates
sonar.qualitygate.wait=true

# Coverage thresholds
sonar.coverage.minimum=85
sonar.coverage.minimumForNewCode=80

# Duplication settings
sonar.cpd.exclusions=**/*.test.ts,**/*.test.tsx,**/*.test.js,**/*.spec.ts,**/*.spec.tsx,**/*.spec.js,**/__mocks__/**,**/node_modules/**,**/dist/**,**/build/**

# Complexity settings
sonar.complexity.max=15

# Security hotspot settings
sonar.security.hotspots.enabled=true

# Code smells
sonar.codeSmells.enabled=true
