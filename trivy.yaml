# Trivy Configuration
# https://aquasecurity.github.io/trivy/latest/docs/configuration/

# DB settings
db:
  # Cache directory
  cache-dir: .trivy-cache
  # No progress bar in CI
  no-progress: true

# Security settings
security:
  # Check for vulnerabilities
  checks: ['vuln', 'config', 'secret']
  # Severity levels to check
  severity: ['CRITICAL', 'HIGH', 'MEDIUM']
  # Ignore unpatched vulnerabilities
  ignore-unfixed: false

# Scan settings
scan:
  # Exit code on errors
  exit-code: 1
  # Exit on errors
  exit-on-eula: false
  # Format output
  format: table
  # Include ignored vulnerabilities
  ignorefile: .trivyignore

# Report settings
report:
  # Format
  format: table
  # Template
  template: ""

# Cache settings
cache:
  # Cache directory
  dir: .trivy-cache

# Ignore settings
ignore:
  # Ignore file
  file: .trivyignore








