# Rollback Deployment Workflow
# Allows quick rollback to previous deployment version

name: Rollback Deployment

on:
  workflow_dispatch:
    inputs:
      app:
        description: 'App to rollback'
        required: true
        type: choice
        options:
          - consultify
          - new-app
      environment:
        description: 'Environment'
        required: true
        type: choice
        options:
          - staging
          - production
      version:
        description: 'Version to rollback to (leave empty for previous)'
        required: false
        type: string

env:
  NODE_VERSION: '20'

jobs:
  rollback:
    name: Rollback Deployment
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.event.inputs.environment }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get Previous Deployment
        id: get-previous
        run: |
          echo "🔍 Finding previous deployment..."
          
          if [ -z "${{ github.event.inputs.version }}" ]; then
            # Get previous successful deployment
            # Example for Railway:
            # PREVIOUS=$(railway deployments list --environment ${{ github.event.inputs.environment }} --json | jq -r '.[1].id')
            
            # For now, simulate getting previous version
            PREVIOUS="previous-$(date +%s)"
            echo "Previous deployment: $PREVIOUS"
          else
            PREVIOUS="${{ github.event.inputs.version }}"
            echo "Using specified version: $PREVIOUS"
          fi
          
          echo "version=$PREVIOUS" >> $GITHUB_OUTPUT

      - name: Verify Rollback Target
        run: |
          echo "✅ Verifying rollback target..."
          echo "App: ${{ github.event.inputs.app }}"
          echo "Environment: ${{ github.event.inputs.environment }}"
          echo "Version: ${{ steps.get-previous.outputs.version }}"
          
          # Verify version exists and is valid
          # Example:
          # railway deployments get --environment ${{ github.event.inputs.environment }} --id ${{ steps.get-previous.outputs.version }}

      - name: Rollback Deployment
        id: rollback-deploy
        run: |
          echo "🔄 Rolling back deployment..."
          
          # Rollback to previous version
          # Example for Railway:
          # railway rollback --environment ${{ github.event.inputs.environment }} --version ${{ steps.get-previous.outputs.version }}
          
          # Example for Kubernetes:
          # kubectl rollout undo deployment/${{ github.event.inputs.app }}-${{ github.event.inputs.environment }} --to-revision=${{ steps.get-previous.outputs.version }}
          
          echo "✅ Rollback initiated"
          echo "rolled_back=true" >> $GITHUB_OUTPUT
          
        env:
          RAILWAY_TOKEN: ${{ secrets[format('RAILWAY_{0}_TOKEN', upper(github.event.inputs.environment))] }}

      - name: Wait for Rollback to Complete
        run: |
          echo "⏳ Waiting for rollback to complete..."
          
          MAX_RETRIES=30
          RETRY_COUNT=0
          
          while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
            HEALTH=$(curl -s -o /dev/null -w "%{http_code}" https://${{ github.event.inputs.environment }}.${{ github.event.inputs.app }}.app/api/health || echo "000")
            
            if [ "$HEALTH" == "200" ]; then
              echo "✅ Rollback completed successfully!"
              exit 0
            fi
            
            RETRY_COUNT=$((RETRY_COUNT + 1))
            echo "Attempt $RETRY_COUNT/$MAX_RETRIES: Health check returned $HEALTH"
            sleep 10
          done
          
          echo "⚠️ Rollback health check timeout"
          exit 1

      - name: Verify Rollback Success
        run: |
          echo "✅ Verifying rollback..."
          
          ROLLBACK_URL="https://${{ github.event.inputs.environment }}.${{ github.event.inputs.app }}.app"
          
          # Health check
          curl -f "$ROLLBACK_URL/api/health" || exit 1
          
          # Ready check
          curl -f "$ROLLBACK_URL/api/health/ready" || exit 1
          
          # Basic API check
          curl -f "$ROLLBACK_URL/api/health/live" || exit 1
          
          echo "✅ All rollback verification checks passed!"

      - name: Notify Rollback Success
        if: success()
        run: |
          echo "✅ Rollback completed successfully!"
          echo "App: ${{ github.event.inputs.app }}"
          echo "Environment: ${{ github.event.inputs.environment }}"
          echo "Version: ${{ steps.get-previous.outputs.version }}"
          
          # Send notification (Slack, Discord, etc.)
          # Example:
          # curl -X POST ${{ secrets.SLACK_WEBHOOK_URL }} \
          #   -H 'Content-Type: application/json' \
          #   -d '{"text":"✅ Rollback successful: ${{ github.event.inputs.app }} (${{ github.event.inputs.environment }})"}'

      - name: Notify Rollback Failure
        if: failure()
        run: |
          echo "❌ Rollback failed!"
          echo "App: ${{ github.event.inputs.app }}"
          echo "Environment: ${{ github.event.inputs.environment }}"
          
          # Send alert notification
          # Example:
          # curl -X POST ${{ secrets.SLACK_WEBHOOK_URL }} \
          #   -H 'Content-Type: application/json' \
          #   -d '{"text":"❌ Rollback failed: ${{ github.event.inputs.app }} (${{ github.event.inputs.environment }}) - Manual intervention required!"}'
          
          exit 1





