# Monorepo CI/CD Pipeline
# Supports: consultify, new-app, and shared packages
# Uses Nx affected for efficient builds

name: Monorepo CI/CD

on:
  push:
    branches: [main, develop, staging]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      app:
        description: 'App to build (consultify, new-app, or all)'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - consultify
          - new-app

env:
  NODE_VERSION: '20'
  PNPM_VERSION: '8'

jobs:
  # ==========================================
  # STAGE 0: Detect Changes (Nx Affected)
  # ==========================================
  detect-changes:
    name: Detect Affected Projects
    runs-on: ubuntu-latest
    outputs:
      consultify: ${{ steps.affected.outputs.consultify }}
      new-app: ${{ steps.affected.outputs.new-app }}
      shared: ${{ steps.affected.outputs.shared }}
      any-changes: ${{ steps.affected.outputs.any }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Full history for Nx affected

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Nx
        run: npm install -g nx@latest

      - name: Detect affected projects
        id: affected
        run: |
          # Get affected projects
          AFFECTED=$(nx show projects --affected --base=origin/main --head=HEAD 2>/dev/null || echo "")
          
          CONSULTIFY_AFFECTED="false"
          NEW_APP_AFFECTED="false"
          SHARED_AFFECTED="false"
          ANY_CHANGES="false"
          
          if echo "$AFFECTED" | grep -q "consultify"; then
            CONSULTIFY_AFFECTED="true"
            ANY_CHANGES="true"
          fi
          
          if echo "$AFFECTED" | grep -q "new-app"; then
            NEW_APP_AFFECTED="true"
            ANY_CHANGES="true"
          fi
          
          if echo "$AFFECTED" | grep -q "shared"; then
            SHARED_AFFECTED="true"
            ANY_CHANGES="true"
          fi
          
          # If manual trigger, check input
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            APP_INPUT="${{ github.event.inputs.app }}"
            if [ "$APP_INPUT" == "consultify" ]; then
              CONSULTIFY_AFFECTED="true"
              ANY_CHANGES="true"
            elif [ "$APP_INPUT" == "new-app" ]; then
              NEW_APP_AFFECTED="true"
              ANY_CHANGES="true"
            elif [ "$APP_INPUT" == "all" ]; then
              CONSULTIFY_AFFECTED="true"
              NEW_APP_AFFECTED="true"
              SHARED_AFFECTED="true"
              ANY_CHANGES="true"
            fi
          fi
          
          # Always run on main/develop pushes
          if [ "${{ github.ref }}" == "refs/heads/main" ] || [ "${{ github.ref }}" == "refs/heads/develop" ]; then
            CONSULTIFY_AFFECTED="true"
            NEW_APP_AFFECTED="true"
            SHARED_AFFECTED="true"
            ANY_CHANGES="true"
          fi
          
          echo "consultify=$CONSULTIFY_AFFECTED" >> $GITHUB_OUTPUT
          echo "new-app=$NEW_APP_AFFECTED" >> $GITHUB_OUTPUT
          echo "shared=$SHARED_AFFECTED" >> $GITHUB_OUTPUT
          echo "any=$ANY_CHANGES" >> $GITHUB_OUTPUT
          
          echo "Affected projects:"
          echo "  - consultify: $CONSULTIFY_AFFECTED"
          echo "  - new-app: $NEW_APP_AFFECTED"
          echo "  - shared: $SHARED_AFFECTED"

  # ==========================================
  # STAGE 1: Shared Modules Pipeline
  # ==========================================
  build-shared:
    name: Build Shared Modules
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.shared == 'true' || needs.detect-changes.outputs.any-changes == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            node_modules
            **/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Cache Nx
        uses: actions/cache@v4
        with:
          path: .nx/cache
          key: ${{ runner.os }}-nx-${{ hashFiles('.nx/cache/**') }}
          restore-keys: |
            ${{ runner.os }}-nx-

      - name: Install dependencies
        run: npm ci

      - name: Install Nx
        run: npm install -g nx@latest

      - name: Build Shared Package
        run: nx build shared
        env:
          NODE_ENV: production

      - name: Run Shared Package Tests
        run: nx test shared
        env:
          NODE_ENV: test
          MOCK_DB: 'true'

      - name: Upload Shared Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: shared-build
          path: packages/shared/dist/**
          retention-days: 7

      - name: Publish Shared Package (if version changed)
        if: github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[release]')
        run: |
          cd packages/shared
          npm version patch --no-git-tag-version
          npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # ==========================================
  # STAGE 2: Consultify App Pipeline
  # ==========================================
  consultify-lint:
    name: Consultify - Lint & Type Check
    runs-on: ubuntu-latest
    needs: [detect-changes, build-shared]
    if: needs.detect-changes.outputs.consultify == 'true' || needs.detect-changes.outputs.any-changes == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            node_modules
            **/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Cache Nx
        uses: actions/cache@v4
        with:
          path: .nx/cache
          key: ${{ runner.os }}-nx-${{ hashFiles('.nx/cache/**') }}
          restore-keys: |
            ${{ runner.os }}-nx-

      - name: Install dependencies
        run: npm ci

      - name: Download Shared Build
        uses: actions/download-artifact@v4
        with:
          name: shared-build
          path: packages/shared/dist

      - name: Install Nx
        run: npm install -g nx@latest

      - name: Lint Consultify
        run: nx lint consultify

      - name: Type Check Consultify
        run: nx run consultify:type-check || npx tsc --noEmit --project apps/consultify/frontend/tsconfig.json

  consultify-test:
    name: Consultify - Tests
    runs-on: ubuntu-latest
    needs: [detect-changes, build-shared]
    if: needs.detect-changes.outputs.consultify == 'true' || needs.detect-changes.outputs.any-changes == 'true'
    strategy:
      matrix:
        test-type: [unit, integration, e2e]
      fail-fast: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            node_modules
            **/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Cache Nx
        uses: actions/cache@v4
        with:
          path: .nx/cache
          key: ${{ runner.os }}-nx-${{ hashFiles('.nx/cache/**') }}
          restore-keys: |
            ${{ runner.os }}-nx-

      - name: Install dependencies
        run: npm ci

      - name: Download Shared Build
        uses: actions/download-artifact@v4
        with:
          name: shared-build
          path: packages/shared/dist

      - name: Install Nx
        run: npm install -g nx@latest

      - name: Run ${{ matrix.test-type }} Tests
        run: |
          if [ "${{ matrix.test-type }}" == "unit" ]; then
            nx test consultify --testPathPattern=unit --reporter=junit --outputFile=junit-consultify-unit.xml
          elif [ "${{ matrix.test-type }}" == "integration" ]; then
            nx test consultify --testPathPattern=integration --reporter=junit --outputFile=junit-consultify-integration.xml
          elif [ "${{ matrix.test-type }}" == "e2e" ]; then
            npx playwright install chromium
            nx e2e consultify --reporter=junit --outputFile=junit-consultify-e2e.xml
          fi
        env:
          NODE_ENV: test
          MOCK_DB: 'true'
          MOCK_REDIS: 'true'

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: consultify-test-results-${{ matrix.test-type }}
          path: |
            coverage/**
            playwright-report/**
            junit-consultify-*.xml
          retention-days: 7

  consultify-build:
    name: Consultify - Build
    runs-on: ubuntu-latest
    needs: [detect-changes, build-shared, consultify-test]
    if: needs.detect-changes.outputs.consultify == 'true' || needs.detect-changes.outputs.any-changes == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Download Shared Build
        uses: actions/download-artifact@v4
        with:
          name: shared-build
          path: packages/shared/dist

      - name: Install Nx
        run: npm install -g nx@latest

      - name: Build Consultify Frontend
        run: nx build consultify:frontend
        env:
          NODE_ENV: production
          VITE_API_URL: ${{ vars.API_URL }}
          VITE_SENTRY_DSN: ${{ secrets.SENTRY_DSN }}

      - name: Build Consultify Backend
        run: nx build consultify:backend
        env:
          NODE_ENV: production

      - name: Upload Consultify Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: consultify-build
          path: |
            apps/consultify/frontend/dist/**
            apps/consultify/backend/dist/**
          retention-days: 7

  # ==========================================
  # STAGE 3: New-App Pipeline
  # ==========================================
  new-app-lint:
    name: New-App - Lint & Type Check
    runs-on: ubuntu-latest
    needs: [detect-changes, build-shared]
    if: needs.detect-changes.outputs.new-app == 'true' || needs.detect-changes.outputs.any-changes == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Download Shared Build
        uses: actions/download-artifact@v4
        with:
          name: shared-build
          path: packages/shared/dist

      - name: Install Nx
        run: npm install -g nx@latest

      - name: Lint New-App
        run: nx lint new-app

      - name: Type Check New-App
        run: nx run new-app:type-check || npx tsc --noEmit --project apps/new-app/frontend/tsconfig.json

  new-app-test:
    name: New-App - Tests
    runs-on: ubuntu-latest
    needs: [detect-changes, build-shared]
    if: needs.detect-changes.outputs.new-app == 'true' || needs.detect-changes.outputs.any-changes == 'true'
    strategy:
      matrix:
        test-type: [unit, integration, e2e]
      fail-fast: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Download Shared Build
        uses: actions/download-artifact@v4
        with:
          name: shared-build
          path: packages/shared/dist

      - name: Install Nx
        run: npm install -g nx@latest

      - name: Run ${{ matrix.test-type }} Tests
        run: |
          if [ "${{ matrix.test-type }}" == "unit" ]; then
            nx test new-app --testPathPattern=unit --reporter=junit --outputFile=junit-new-app-unit.xml
          elif [ "${{ matrix.test-type }}" == "integration" ]; then
            nx test new-app --testPathPattern=integration --reporter=junit --outputFile=junit-new-app-integration.xml
          elif [ "${{ matrix.test-type }}" == "e2e" ]; then
            npx playwright install chromium
            nx e2e new-app --reporter=junit --outputFile=junit-new-app-e2e.xml
          fi
        env:
          NODE_ENV: test
          MOCK_DB: 'true'
          MOCK_REDIS: 'true'

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: new-app-test-results-${{ matrix.test-type }}
          path: |
            coverage/**
            playwright-report/**
            junit-new-app-*.xml
          retention-days: 7

  new-app-build:
    name: New-App - Build
    runs-on: ubuntu-latest
    needs: [detect-changes, build-shared, new-app-test]
    if: needs.detect-changes.outputs.new-app == 'true' || needs.detect-changes.outputs.any-changes == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Download Shared Build
        uses: actions/download-artifact@v4
        with:
          name: shared-build
          path: packages/shared/dist

      - name: Install Nx
        run: npm install -g nx@latest

      - name: Build New-App Frontend
        run: nx build new-app:frontend
        env:
          NODE_ENV: production
          VITE_API_URL: ${{ vars.API_URL }}
          VITE_SENTRY_DSN: ${{ secrets.SENTRY_DSN }}

      - name: Build New-App Backend
        run: nx build new-app:backend
        env:
          NODE_ENV: production

      - name: Upload New-App Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: new-app-build
          path: |
            apps/new-app/frontend/dist/**
            apps/new-app/backend/dist/**
          retention-days: 7

  # ==========================================
  # STAGE 3.5: Security Scanning
  # ==========================================
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.any-changes == 'true'
    permissions:
      security-events: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            node_modules
            **/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: npm ci

      - name: Run NPM Audit
        run: npm audit --audit-level=high || true
        continue-on-error: true

      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true

      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@v2
        with:
          sarif_file: 'trivy-results.sarif'
        if: always()

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v2
        with:
          languages: javascript,typescript

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v2

      - name: Security Scan Summary
        if: always()
        run: |
          echo "## Security Scan Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f trivy-results.sarif ]; then
            echo "✅ Trivy scan completed" >> $GITHUB_STEP_SUMMARY
          fi
          echo "✅ CodeQL analysis completed" >> $GITHUB_STEP_SUMMARY

  # ==========================================
  # STAGE 4.5: Test Result Aggregation
  # ==========================================
  aggregate-test-results:
    name: Aggregate Test Results
    runs-on: ubuntu-latest
    needs: [consultify-test, new-app-test]
    if: always()
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all test results
        uses: actions/download-artifact@v4
        with:
          pattern: '*-test-results-*'
          path: test-results/
          merge-multiple: true

      - name: Generate Test Report
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: All Tests
          path: test-results/**/*.xml
          reporter: java-junit
          list-suites: all
          list-tests: all
          max-annotations: 50

      - name: Test Summary
        if: always()
        run: |
          echo "## Test Results Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "All test results have been aggregated and reported above." >> $GITHUB_STEP_SUMMARY

  # ==========================================
  # STAGE 5: Summary
  # ==========================================
  pipeline-summary:
    name: Pipeline Summary
    runs-on: ubuntu-latest
    needs: [consultify-build, new-app-build, security-scan, aggregate-test-results]
    if: always()
    steps:
      - name: Generate Summary
        run: |
          echo "## Monorepo CI/CD Pipeline Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Component | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Consultify | ${{ needs.consultify-build.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| New-App | ${{ needs.new-app-build.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Shared | ${{ needs.build-shared.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Security Scan | ${{ needs.security-scan.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Test Results | ${{ needs.aggregate-test-results.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Pipeline Duration" >> $GITHUB_STEP_SUMMARY
          echo "Check Actions tab for detailed timing information." >> $GITHUB_STEP_SUMMARY

