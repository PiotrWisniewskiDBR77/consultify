name: IRIS 6.0 Automated Test Suite

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      test_type:
        description: 'Test type to run'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - unit
          - integration
          - e2e
          - security
          - performance

env:
  NODE_VERSION: '20.x'
  CI: true

jobs:
  # ═══════════════════════════════════════════════════════════════
  # QUALITY GATES
  # ═══════════════════════════════════════════════════════════════
  lint-typecheck:
    name: 🔍 Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript check
        run: npm run type-check

  # ═══════════════════════════════════════════════════════════════
  # TEST QUALITY (Anti-Placeholder)
  # ═══════════════════════════════════════════════════════════════
  test-quality-check:
    name: 🛡️ Test Quality (Anti-Placeholder)
    runs-on: ubuntu-latest
    needs: lint-typecheck
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Run quality check
        run: npm run test:quality-check

  # ═══════════════════════════════════════════════════════════════
  # UNIT TESTS (Sharded 4-way)
  # ═══════════════════════════════════════════════════════════════
  unit-tests:
    name: 🧪 Unit Tests (Shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    needs: lint-typecheck
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests (Shard ${{ matrix.shard }})
        run: npx vitest run tests/unit --shard=${{ matrix.shard }}/4 --reporter=junit --outputFile=junit-unit-${{ matrix.shard }}.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results-${{ matrix.shard }}
          path: junit-unit-${{ matrix.shard }}.xml
          retention-days: 30

  # ═══════════════════════════════════════════════════════════════
  # COMPONENT & INTEGRATION TESTS
  # ═══════════════════════════════════════════════════════════════
  component-tests:
    name: 🎨 Component Tests
    runs-on: ubuntu-latest
    needs: lint-typecheck
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run component tests
        run: npm run test:component -- --reporter=junit --outputFile=junit-component.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: component-test-results
          path: junit-component.xml
          retention-days: 30

  integration-tests:
    name: 🔗 Integration Tests
    runs-on: ubuntu-latest
    needs: lint-typecheck
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: iris
          POSTGRES_PASSWORD: iris_test
          POSTGRES_DB: iris_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run integration tests
        run: npm run test:integration -- --reporter=junit --outputFile=junit-integration.xml
        env:
          DATABASE_URL: postgres://iris:iris_test@localhost:5432/iris_test

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-results
          path: junit-integration.xml
          retention-days: 30

  # ═══════════════════════════════════════════════════════════════
  # SECURITY INTEGRITY GATE (P0 — blocks merge)
  # ═══════════════════════════════════════════════════════════════
  security-integrity:
    name: 🔒 Security Integrity Gate
    runs-on: ubuntu-latest
    needs: lint-typecheck
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run security integrity check
        run: npx tsx scripts/security/verify-security-integrity.ts

      - name: Run npm audit (high/critical blocking)
        run: npm audit --audit-level=high --omit=dev

  # ═══════════════════════════════════════════════════════════════
  # SECURITY TESTS
  # ═══════════════════════════════════════════════════════════════
  security-tests:
    name: 🔒 Security Tests
    runs-on: ubuntu-latest
    needs: [lint-typecheck, security-integrity]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run security tests
        run: npm run test:security -- --reporter=junit --outputFile=junit-security.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-test-results
          path: junit-security.xml
          retention-days: 30

  # ═══════════════════════════════════════════════════════════════
  # E2E TESTS (Playwright)
  # ═══════════════════════════════════════════════════════════════
  e2e-tests:
    name: 🌐 E2E Tests
    runs-on: ubuntu-latest
    needs: [unit-tests, component-tests]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build application
        run: npm run build

      - name: Run E2E tests
        # Deterministic spec-based L6 health suite (no web servers required)
        run: npx playwright test tests/e2e/ai-system-health.spec.ts --reporter=junit

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e-results.xml
            test-results/
          retention-days: 30

      - name: Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: test-results/
          retention-days: 7

  # ═══════════════════════════════════════════════════════════════
  # RUNTIME SMOKE (Playwright + started web servers)
  # Deterministic AI Chat end-to-end guarantee.
  # ═══════════════════════════════════════════════════════════════
  e2e-runtime-smoke:
    name: 🔥 Runtime Smoke (AI Chat)
    runs-on: ubuntu-latest
    needs: [unit-tests, component-tests]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Runtime Smoke (AI Chat)
        run: npx playwright test tests/e2e/runtime --reporter=junit
        env:
          CI: true
          NODE_ENV: test
          E2E_MODE: true
          E2E_USE_WEB_SERVER: 'true'
          E2E_API_URL: http://127.0.0.1:3001
          E2E_BASE_URL: http://127.0.0.1:3000

      - name: Upload Runtime Smoke report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-runtime-smoke-report
          path: |
            e2e-results.xml
            test-results/
          retention-days: 30

  # ═══════════════════════════════════════════════════════════════
  # PERFORMANCE TESTS
  # ═══════════════════════════════════════════════════════════════
  performance-tests:
    name: ⚡ Performance Tests
    runs-on: ubuntu-latest
    needs: [unit-tests]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run performance tests
        run: npm run test:performance -- --reporter=junit --outputFile=junit-performance.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-test-results
          path: junit-performance.xml
          retention-days: 30

  # ═══════════════════════════════════════════════════════════════
  # CRITICAL PATH COVERAGE CHECK
  # ═══════════════════════════════════════════════════════════════
  critical-path-coverage:
    name: 🔒 Critical Path Coverage Check
    runs-on: ubuntu-latest
    needs: [unit-tests]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install bc + jq (for numeric comparison + JSON)
        run: sudo apt-get update && sudo apt-get install -y bc jq

      - name: Run critical tests with coverage
        run: |
          npm run test:unit:critical -- --coverage

      - name: Check critical path coverage threshold
        run: |
          if [ ! -f coverage/coverage-summary.json ]; then
            echo "::error::Coverage report not found (coverage/coverage-summary.json). Failing gate."
            exit 1
          fi

          get_pct () {
            local suffix="$1"
            jq -r --arg suf "$suffix" '
              to_entries
              | map(select(.key | endswith($suf)))
              | .[0].value.lines.pct // empty
            ' coverage/coverage-summary.json
          }

          check_min () {
            local suffix="$1"
            local min="$2"
            local pct
            pct="$(get_pct "$suffix")"

            if [ -z "$pct" ]; then
              echo "::error::Coverage entry not found for $suffix"
              exit 1
            fi

            echo "Coverage lines for $suffix: $pct% (min $min%)"
            if (( $(echo "$pct < $min" | bc -l) )); then
              echo "::error::Coverage for $suffix ($pct%) below $min% threshold!"
              exit 1
            fi
          }

          # Critical path coverage checks (focused, not global total)
          check_min "/server/src/middleware/csrf.middleware.ts" 90
          check_min "/server/src/middleware/auth.middleware.ts" 70
          check_min "/server/src/middleware/permission.middleware.ts" 75
          check_min "/server/src/middleware/inputSanitization.middleware.ts" 70

      - name: Upload critical coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: critical-coverage-report
          path: coverage/
          retention-days: 30

  # ═══════════════════════════════════════════════════════════════
  # COVERAGE REPORT
  # ═══════════════════════════════════════════════════════════════
  coverage:
    name: 📊 Coverage Report
    runs-on: ubuntu-latest
    needs: [unit-tests, component-tests, integration-tests]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install bc + jq (for numeric comparison + JSON)
        run: sudo apt-get update && sudo apt-get install -y bc jq

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 30

      - name: Check coverage thresholds
        run: |
          if [ ! -f coverage/coverage-summary.json ]; then
            echo "::error::Coverage report not found (coverage/coverage-summary.json). Failing gate."
            exit 1
          fi

          get_pct () {
            local suffix="$1"
            jq -r --arg suf "$suffix" '
              to_entries
              | map(select(.key | endswith($suf)))
              | .[0].value.lines.pct // empty
            ' coverage/coverage-summary.json
          }

          check_min () {
            local suffix="$1"
            local min="$2"
            local pct
            pct="$(get_pct "$suffix")"

            if [ -z "$pct" ]; then
              echo "::error::Coverage entry not found for $suffix"
              exit 1
            fi

            echo "Coverage lines for $suffix: $pct% (min $min%)"
            if (( $(echo "$pct < $min" | bc -l) )); then
              echo "::error::Coverage for $suffix ($pct%) below $min% threshold!"
              exit 1
            fi
          }

          # Same critical coverage checks (focused, not global total)
          check_min "/server/src/middleware/csrf.middleware.ts" 90
          check_min "/server/src/middleware/auth.middleware.ts" 70
          check_min "/server/src/middleware/permission.middleware.ts" 75
          check_min "/server/src/middleware/inputSanitization.middleware.ts" 70

  # ═══════════════════════════════════════════════════════════════
  # FINAL REPORT
  # ═══════════════════════════════════════════════════════════════
  test-summary:
    name: 📋 Test Summary
    runs-on: ubuntu-latest
    needs:
      [
        unit-tests,
        component-tests,
        integration-tests,
        security-integrity,
        security-tests,
        e2e-tests,
        performance-tests,
        critical-path-coverage,
      ]
    if: always()
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: test-artifacts

      - name: Generate summary
        run: |
          echo "# 🧪 IRIS 6.0 Test Suite Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Suite | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Security Integrity Gate | ${{ needs.security-integrity.result == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Unit Tests | ${{ needs.unit-tests.result == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Component Tests | ${{ needs.component-tests.result == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Integration Tests | ${{ needs.integration-tests.result == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Security Tests | ${{ needs.security-tests.result == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| E2E Tests | ${{ needs.e2e-tests.result == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Performance Tests | ${{ needs.performance-tests.result == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Critical Path Coverage | ${{ needs.critical-path-coverage.result == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
