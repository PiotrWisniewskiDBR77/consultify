name: IRIS 6.0 Automated Test Suite

on:
  push:
    branches: [main, develop, Londyn, demo]
  pull_request:
    branches: [main, develop, Londyn, demo]
  workflow_dispatch:
    inputs:
      test_type:
        description: 'Test type to run'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - unit
          - integration
          - e2e
          - security
          - performance

permissions:
  contents: read
  issues: write
  pull-requests: read

env:
  NODE_VERSION: '20.x'
  CI: true

jobs:
  # ═══════════════════════════════════════════════════════════════
  # QUALITY GATES (PR-blocking)
  # ═══════════════════════════════════════════════════════════════
  lint-typecheck:
    name: 🔍 Lint & Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          # check:a11y-focus (VF0-7) diffs against the PR base / previous commit —
          # needs history beyond the default depth-1 shallow clone (same pattern
          # as the test-impact job below).
          fetch-depth: 50
      - name: Capture job start
        run: echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript check
        run: npm run type-check

      - name: Hardcoded-color ratchet gate (VEGAS V7.7)
        run: npm run check:colors

      - name: a11y jsx ratchet gate (VF0-7)
        run: npm run check:a11y-jsx

      - name: a11y focus-visible gate (VF0-7, diff vs base)
        run: npm run check:a11y-focus -- --base "${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || 'HEAD~1' }}"

      - name: Triada full-repo ratchet gate (crimson primary-*, audyt strażników 2026-07-26)
        run: npm run check:triada:all

      - name: List-canon full-repo ratchet gate (StandardTable/StandardModuleBar, R1/R2/R2b)
        run: npm run check:list-canon

      - name: Artefakt shell ratchet gate (crimson w powłoce SPEC-A)
        run: npm run check:artefakt

      - name: Job duration
        if: always()
        run: |
          end=$(date +%s)
          dur=$((end - JOB_START))
          echo "Job duration: ${dur}s" >> "$GITHUB_STEP_SUMMARY"

  test-impact:
    name: 🎯 Test Impact (Summary)
    runs-on: ubuntu-latest
    timeout-minutes: 3
    needs: lint-typecheck
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 50
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Run test impact analysis
        run: mkdir -p test-results && npx tsx scripts/testing/test-impact-analysis.ts --base ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || 'HEAD~1' }} | tee test-results/test-impact.txt
      - name: Upload test impact summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-impact
          path: test-results/test-impact.txt
          retention-days: 30

  # ═══════════════════════════════════════════════════════════════
  # TEST QUALITY (Anti-Placeholder)
  # ═══════════════════════════════════════════════════════════════
  test-quality-check:
    name: 🛡️ Test Quality (Anti-Placeholder)
    runs-on: ubuntu-latest
    timeout-minutes: 3
    needs: lint-typecheck
    steps:
      - uses: actions/checkout@v4
      - name: Capture job start
        run: echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Run quality check
        run: npm run test:quality-check
        env:
          QUALITY_CHECK_FAIL_ON_RISK: '1'
      - name: Job duration
        if: always()
        run: |
          end=$(date +%s)
          dur=$((end - JOB_START))
          echo "Job duration: ${dur}s" >> "$GITHUB_STEP_SUMMARY"

  quality-scorecard:
    name: 📊 Quality Scorecard + Flaky Report
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: lint-typecheck
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Generate quality scorecard (JSON)
        run: mkdir -p test-results && npx tsx scripts/testing/quality-scorecard.ts --json --output test-results/quality-scorecard.json
      - name: Generate flaky test report
        run: npx tsx scripts/testing/flaky-test-tracker.ts --report
      - name: Upload quality artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-scorecard-and-flaky-report
          path: |
            test-results/quality-scorecard.json
            test-results/flaky-tests.json
          retention-days: 30

      - name: PR summary (quality + flaky + impact)
        if: ${{ github.event_name == 'pull_request' && always() }}
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            const impactPath = path.resolve('test-results/test-impact.txt');
            const flakyPath = path.resolve('test-results/flaky-tests.json');
            const scorecardPath = path.resolve('test-results/quality-scorecard.json');

            let out = '## ✅ Test Quality Summary\n\n';

            if (fs.existsSync(impactPath)) {
              const impact = fs.readFileSync(impactPath, 'utf8').trim();
              out += '### Test Impact\n';
              out += '```\n' + impact + '\n```\n\n';
            }

            if (fs.existsSync(scorecardPath)) {
              try {
                const score = JSON.parse(fs.readFileSync(scorecardPath, 'utf8'));
                out += '### Quality Scorecard\n';
                out += `- modules: ${score.length}\n`;
                const critical = score.filter((s) => s.riskLevel === 'critical');
                const criticalLow = critical.filter((s) => s.grade === 'D' || s.grade === 'F');
                out += `- critical modules: ${critical.length}\n`;
                out += `- critical with grade D/F: ${criticalLow.length}\n\n`;
              } catch (e) {
                out += '### Quality Scorecard\n- failed to parse JSON\n\n';
              }
            }

            if (fs.existsSync(flakyPath)) {
              try {
                const flaky = JSON.parse(fs.readFileSync(flakyPath, 'utf8'));
                const tests = Array.isArray(flaky.tests) ? flaky.tests : [];
                const flakyCount = tests.filter((t) => t.passRate < 0.7).length;
                const quarantined = tests.filter((t) => t.quarantined).length;
                out += '### Flaky Tests\n';
                out += `- tracked: ${tests.length}\n`;
                out += `- flaky (<70% pass rate): ${flakyCount}\n`;
                out += `- quarantined: ${quarantined}\n\n`;
              } catch (e) {
                out += '### Flaky Tests\n- failed to parse JSON\n\n';
              }
            }

            try {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: out,
              });
            } catch (error) {
              core.warning(`Unable to create PR quality summary comment: ${error.message}`);
              core.summary.addRaw(out).write();
            }

  # ═══════════════════════════════════════════════════════════════
  # LEVEL GATES (L1–L3 coverage)
  # Enforces per-file 95% coverage gates defined in vitest.l*.config.ts
  # ═══════════════════════════════════════════════════════════════
  skip-scan-gate:
    name: 🚫 Skip/Only Gate
    runs-on: ubuntu-latest
    timeout-minutes: 3
    needs: lint-typecheck
    steps:
      - uses: actions/checkout@v4
      - name: Capture job start
        run: echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Run skip-scan gate
        run: npm run test:skip-scan
      - name: Job duration
        if: always()
        run: |
          end=$(date +%s)
          dur=$((end - JOB_START))
          echo "Job duration: ${dur}s" >> "$GITHUB_STEP_SUMMARY"

  levels-coverage-gates:
    name: 🎯 Levels Coverage Gates (L1–L3)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: lint-typecheck
    steps:
      - uses: actions/checkout@v4
      - name: Deferred outside main/develop
        if: ${{ !(github.event_name == 'workflow_dispatch' || github.ref_name == 'main' || github.ref_name == 'develop') }}
        run: |
          echo "Coverage gates deferred (run on main/develop or via workflow_dispatch)." >> "$GITHUB_STEP_SUMMARY"
      - name: Capture job start
        if: ${{ github.event_name == 'workflow_dispatch' || github.ref_name == 'main' || github.ref_name == 'develop' }}
        run: echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"
      - name: Setup Node.js
        if: ${{ github.event_name == 'workflow_dispatch' || github.ref_name == 'main' || github.ref_name == 'develop' }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - name: Install dependencies
        if: ${{ github.event_name == 'workflow_dispatch' || github.ref_name == 'main' || github.ref_name == 'develop' }}
        run: npm ci
      - name: Run L1 coverage gate
        if: ${{ github.event_name == 'workflow_dispatch' || github.ref_name == 'main' || github.ref_name == 'develop' }}
        run: npm run test:l1:coverage
      - name: Run L2 coverage gate
        if: ${{ github.event_name == 'workflow_dispatch' || github.ref_name == 'main' || github.ref_name == 'develop' }}
        run: npm run test:l2:coverage
      - name: Run L3 coverage gate
        if: ${{ github.event_name == 'workflow_dispatch' || github.ref_name == 'main' || github.ref_name == 'develop' }}
        run: npm run test:l3:coverage
      - name: Job duration
        if: always()
        run: |
          end=$(date +%s)
          dur=$((end - JOB_START))
          echo "Job duration: ${dur}s" >> "$GITHUB_STEP_SUMMARY"

  # ═══════════════════════════════════════════════════════════════
  # UNIT TESTS (Sharded 4-way)
  # ═══════════════════════════════════════════════════════════════
  unit-tests:
    name: 🧪 Unit Tests (Shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: lint-typecheck
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - name: Deferred outside main/develop
        if: ${{ !(github.event_name == 'workflow_dispatch' || github.ref_name == 'main' || github.ref_name == 'develop') }}
        run: |
          echo "Unit test shards deferred (run on main/develop or via workflow_dispatch)." >> "$GITHUB_STEP_SUMMARY"
      - name: Capture job start
        if: ${{ github.event_name == 'workflow_dispatch' || github.ref_name == 'main' || github.ref_name == 'develop' }}
        run: echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"

      - name: Setup Node.js
        if: ${{ github.event_name == 'workflow_dispatch' || github.ref_name == 'main' || github.ref_name == 'develop' }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        if: ${{ github.event_name == 'workflow_dispatch' || github.ref_name == 'main' || github.ref_name == 'develop' }}
        run: npm ci

      - name: Run unit tests (Shard ${{ matrix.shard }})
        if: ${{ github.event_name == 'workflow_dispatch' || github.ref_name == 'main' || github.ref_name == 'develop' }}
        run: npx vitest run tests/unit --shard=${{ matrix.shard }}/4 --reporter=junit --outputFile=junit-unit-${{ matrix.shard }}.xml

      - name: Upload test results
        if: ${{ always() && (github.event_name == 'workflow_dispatch' || github.ref_name == 'main' || github.ref_name == 'develop') }}
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results-${{ matrix.shard }}
          path: junit-unit-${{ matrix.shard }}.xml
          retention-days: 30
      - name: Job duration
        if: always()
        run: |
          end=$(date +%s)
          dur=$((end - JOB_START))
          echo "Job duration: ${dur}s" >> "$GITHUB_STEP_SUMMARY"

  # ═══════════════════════════════════════════════════════════════
  # INITIATIVES UNIT GATE (deterministic, zero external deps)
  # ═══════════════════════════════════════════════════════════════
  initiatives-tests:
    name: 🏗️ Initiatives Unit Gate
    runs-on: ubuntu-latest
    timeout-minutes: 8
    needs: lint-typecheck
    if: ${{ github.event_name == 'pull_request' || github.ref_name == 'Londyn' || github.ref_name == 'main' || github.ref_name == 'develop' }}
    steps:
      - uses: actions/checkout@v4
      - name: Capture job start
        run: echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Run initiatives unit tests
        run: npm run test:initiatives
      - name: Job duration
        if: always()
        run: |
          end=$(date +%s)
          dur=$((end - JOB_START))
          echo "Job duration: ${dur}s" >> "$GITHUB_STEP_SUMMARY"

  # ═══════════════════════════════════════════════════════════════
  # COMPONENT & INTEGRATION TESTS
  # ═══════════════════════════════════════════════════════════════
  component-tests:
    name: 🎨 Component Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: lint-typecheck
    steps:
      - uses: actions/checkout@v4
      - name: Deferred outside main/develop
        if: ${{ !(github.event_name == 'workflow_dispatch' || github.ref_name == 'main' || github.ref_name == 'develop') }}
        run: |
          echo "Component tests deferred (run on main/develop or via workflow_dispatch)." >> "$GITHUB_STEP_SUMMARY"
      - name: Capture job start
        if: ${{ github.event_name == 'workflow_dispatch' || github.ref_name == 'main' || github.ref_name == 'develop' }}
        run: echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"

      - name: Setup Node.js
        if: ${{ github.event_name == 'workflow_dispatch' || github.ref_name == 'main' || github.ref_name == 'develop' }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        if: ${{ github.event_name == 'workflow_dispatch' || github.ref_name == 'main' || github.ref_name == 'develop' }}
        run: npm ci

      - name: Run component tests
        if: ${{ github.event_name == 'workflow_dispatch' || github.ref_name == 'main' || github.ref_name == 'develop' }}
        run: npm run test:component -- --reporter=junit --outputFile=junit-component.xml

      # M08 L-05: My Work co-located component tests live under src/**/__tests__ and
      # are NOT matched by `vitest run tests/components` (explicit path overrides the
      # config include). Run them here so the ~195 cases (table cells/provenance/forms,
      # ideas canvas, etc.) actually gate merges to main/develop.
      - name: Run My Work co-located tests (M08 L-05)
        if: ${{ github.event_name == 'workflow_dispatch' || github.ref_name == 'main' || github.ref_name == 'develop' }}
        run: npx vitest run src/components/MyWork --reporter=junit --outputFile=junit-mywork-colocated.xml

      - name: Upload test results
        if: ${{ always() && (github.event_name == 'workflow_dispatch' || github.ref_name == 'main' || github.ref_name == 'develop') }}
        uses: actions/upload-artifact@v4
        with:
          name: component-test-results
          path: |
            junit-component.xml
            junit-mywork-colocated.xml
          retention-days: 30
      - name: Job duration
        if: always()
        run: |
          end=$(date +%s)
          dur=$((end - JOB_START))
          echo "Job duration: ${dur}s" >> "$GITHUB_STEP_SUMMARY"

  performance-tests:
    name: ⚡ Performance Tests (Real DB)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: lint-typecheck
    if: ${{ github.event_name != 'pull_request' }}
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: iris
          POSTGRES_PASSWORD: iris_test
          POSTGRES_DB: iris_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Deferred outside main/develop
        if: ${{ !(github.event_name == 'workflow_dispatch' || github.ref_name == 'main' || github.ref_name == 'develop') }}
        run: |
          echo "Performance tests deferred (run on main/develop or via workflow_dispatch)." >> "$GITHUB_STEP_SUMMARY"
      - name: Capture job start
        if: ${{ github.event_name == 'workflow_dispatch' || github.ref_name == 'main' || github.ref_name == 'develop' }}
        run: echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"

      - name: Setup Node.js
        if: ${{ github.event_name == 'workflow_dispatch' || github.ref_name == 'main' || github.ref_name == 'develop' }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        if: ${{ github.event_name == 'workflow_dispatch' || github.ref_name == 'main' || github.ref_name == 'develop' }}
        run: npm ci

      - name: Migrate DB (strict)
        if: ${{ github.event_name == 'workflow_dispatch' || github.ref_name == 'main' || github.ref_name == 'develop' }}
        run: DB_TYPE=postgres DATABASE_URL=postgres://iris:iris_test@localhost:5432/iris_test npm run db:migrate:strict

      - name: Run performance tests (real DB)
        if: ${{ github.event_name == 'workflow_dispatch' || github.ref_name == 'main' || github.ref_name == 'develop' }}
        run: npm run test:performance:real -- --reporter=junit --outputFile=junit-performance.xml
        env:
          DATABASE_URL: postgres://iris:iris_test@localhost:5432/iris_test
          RUN_DB_TESTS: '1'
          MOCK_DB: 'false'
          PERF_DB_SELECT_MS: '400'
          PERF_DB_SIMPLE_SELECT_MS: '100'
          PERF_DB_JOIN_MS: '250'
          PERF_DB_AGG_MS: '500'
          PERF_DB_COMPLEX_JOIN_MS: '800'
          PERF_DB_CONCURRENT_SELECTS_MS: '3000'
          PERF_DB_CONCURRENT_INSERTS_MS: '2000'
          PERF_DB_BULK_INSERT_MS: '3000'
          PERF_DB_BULK_UPDATE_MS: '3000'
          PERF_DB_INDEX_WHERE_MS: '250'
          PERF_DB_INDEX_JOIN_MS: '350'
          PERF_SCALABILITY_CONCURRENT_QUERIES_MS: '10000'
          PERF_SCALABILITY_CONCURRENT_WRITES_MS: '20000'
          PERF_SCALABILITY_QUERY_1000_MS: '8000'
          PERF_SCALABILITY_TX_MS: '20000'

      - name: Upload test results
        if: ${{ always() && (github.event_name == 'workflow_dispatch' || github.ref_name == 'main' || github.ref_name == 'develop') }}
        uses: actions/upload-artifact@v4
        with:
          name: performance-test-results
          path: junit-performance.xml
          retention-days: 30
      - name: Job duration
        if: always()
        run: |
          end=$(date +%s)
          dur=$((end - JOB_START))
          echo "Job duration: ${dur}s" >> "$GITHUB_STEP_SUMMARY"

  # ═══════════════════════════════════════════════════════════════
  # COLOCATED __tests__ (server/src + src)
  # These never ran in CI: the unit/component/integration jobs pass explicit
  # paths (tests/unit|tests/components|tests/integration) which override the
  # vitest `include`, so server/src/**/__tests__ and src/**/__tests__ were
  # silently skipped (~580 tests). Server colocated tests need Postgres.
  # ═══════════════════════════════════════════════════════════════
  colocated-tests:
    name: 🧬 Colocated __tests__ (server + src)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: lint-typecheck
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: iris
          POSTGRES_PASSWORD: iris_test
          POSTGRES_DB: iris_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Deferred outside main/develop
        if: ${{ !(github.event_name == 'workflow_dispatch' || github.ref_name == 'main' || github.ref_name == 'develop') }}
        run: |
          echo "Colocated __tests__ deferred (run on main/develop or via workflow_dispatch)." >> "$GITHUB_STEP_SUMMARY"
      - name: Capture job start
        if: ${{ github.event_name == 'workflow_dispatch' || github.ref_name == 'main' || github.ref_name == 'develop' }}
        run: echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"

      - name: Setup Node.js
        if: ${{ github.event_name == 'workflow_dispatch' || github.ref_name == 'main' || github.ref_name == 'develop' }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        if: ${{ github.event_name == 'workflow_dispatch' || github.ref_name == 'main' || github.ref_name == 'develop' }}
        run: npm ci

      - name: Migrate DB (strict)
        if: ${{ github.event_name == 'workflow_dispatch' || github.ref_name == 'main' || github.ref_name == 'develop' }}
        run: DB_TYPE=postgres DATABASE_URL=postgres://iris:iris_test@localhost:5432/iris_test npm run db:migrate:strict

      # Server colocated tests run under the `node` environment + Postgres.
      # `vitest run server/src` only matches *.test.* files that are covered by
      # the config `include` (server/src/**/__tests__/**), so it does NOT
      # duplicate tests/unit|integration|components.
      - name: Run server/src colocated __tests__
        if: ${{ github.event_name == 'workflow_dispatch' || github.ref_name == 'main' || github.ref_name == 'develop' }}
        run: npx vitest run server/src --no-file-parallelism --reporter=junit --outputFile=junit-colocated-server.xml
        env:
          DB_TYPE: postgres
          DATABASE_URL: postgres://iris:iris_test@localhost:5432/iris_test
          # Without these two, getDatabaseAsync() (server/src/database/Database.ts)
          # substitutes an in-memory mock because vitest sets NODE_ENV=test — so the
          # Postgres service started above and migrated by the previous step would be
          # provisioned and then never touched by a single assertion.
          RUN_DB_TESTS: '1'
          MOCK_DB: 'false'

      # Frontend colocated tests run under jsdom (no DB).
      - name: Run src colocated __tests__
        if: ${{ github.event_name == 'workflow_dispatch' || github.ref_name == 'main' || github.ref_name == 'develop' }}
        run: npx vitest run src --reporter=junit --outputFile=junit-colocated-src.xml

      - name: Upload test results
        if: ${{ always() && (github.event_name == 'workflow_dispatch' || github.ref_name == 'main' || github.ref_name == 'develop') }}
        uses: actions/upload-artifact@v4
        with:
          name: colocated-test-results
          path: |
            junit-colocated-server.xml
            junit-colocated-src.xml
          retention-days: 30
      - name: Job duration
        if: always()
        run: |
          end=$(date +%s)
          dur=$((end - JOB_START))
          echo "Job duration: ${dur}s" >> "$GITHUB_STEP_SUMMARY"

  integration-tests:
    name: 🔗 Integration Tests (Shard ${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    needs: lint-typecheck
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: iris
          POSTGRES_PASSWORD: iris_test
          POSTGRES_DB: iris_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Deferred outside main/develop
        if: ${{ !(github.event_name == 'workflow_dispatch' || github.ref_name == 'main' || github.ref_name == 'develop') }}
        run: |
          echo "Integration tests deferred (run on main/develop or via workflow_dispatch)." >> "$GITHUB_STEP_SUMMARY"
      - name: Capture job start
        if: ${{ github.event_name == 'workflow_dispatch' || github.ref_name == 'main' || github.ref_name == 'develop' }}
        run: echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"

      - name: Setup Node.js
        if: ${{ github.event_name == 'workflow_dispatch' || github.ref_name == 'main' || github.ref_name == 'develop' }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        if: ${{ github.event_name == 'workflow_dispatch' || github.ref_name == 'main' || github.ref_name == 'develop' }}
        run: npm ci

      - name: Migrate DB (strict)
        if: ${{ github.event_name == 'workflow_dispatch' || github.ref_name == 'main' || github.ref_name == 'develop' }}
        run: DB_TYPE=postgres DATABASE_URL=postgres://iris:iris_test@localhost:5432/iris_test npm run db:migrate:strict

      - name: Run integration tests (Shard ${{ matrix.shard }})
        if: ${{ github.event_name == 'workflow_dispatch' || github.ref_name == 'main' || github.ref_name == 'develop' }}
        run: npx vitest run tests/integration --no-file-parallelism --shard=${{ matrix.shard }}/3 --reporter=junit --outputFile=junit-integration-${{ matrix.shard }}.xml
        env:
          DB_TYPE: postgres
          DATABASE_URL: postgres://iris:iris_test@localhost:5432/iris_test
          # See the note in colocated-tests: without these, the migrated Postgres
          # service is ignored and every assertion runs against the in-memory mock.
          RUN_DB_TESTS: '1'
          MOCK_DB: 'false'

      - name: Upload test results
        if: ${{ always() && (github.event_name == 'workflow_dispatch' || github.ref_name == 'main' || github.ref_name == 'develop') }}
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-results-${{ matrix.shard }}
          path: junit-integration-${{ matrix.shard }}.xml
          retention-days: 30
      - name: Job duration
        if: always()
        run: |
          end=$(date +%s)
          dur=$((end - JOB_START))
          echo "Job duration: ${dur}s" >> "$GITHUB_STEP_SUMMARY"

  # ═══════════════════════════════════════════════════════════════
  # SECURITY INTEGRITY GATE (P0 — blocks merge)
  # ═══════════════════════════════════════════════════════════════
  security-integrity:
    name: 🔒 Security Integrity Gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: lint-typecheck
    steps:
      - uses: actions/checkout@v4
      - name: Capture job start
        run: echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run security integrity check
        run: npx tsx scripts/security/verify-security-integrity.ts

      - name: Run npm audit gate (high/critical blocking; allowlisted)
        run: npx tsx scripts/security/npm-audit-gate.ts
      - name: Job duration
        if: always()
        run: |
          end=$(date +%s)
          dur=$((end - JOB_START))
          echo "Job duration: ${dur}s" >> "$GITHUB_STEP_SUMMARY"

  # ═══════════════════════════════════════════════════════════════
  # SECURITY TESTS
  # ═══════════════════════════════════════════════════════════════
  security-tests:
    name: 🔒 Security Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [lint-typecheck, security-integrity]
    if: ${{ github.event_name != 'pull_request' }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run security tests
        run: npm run test:security -- --reporter=junit --outputFile=junit-security.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-test-results
          path: junit-security.xml
          retention-days: 30

  # ═══════════════════════════════════════════════════════════════
  # E2E TESTS (Playwright)
  # ═══════════════════════════════════════════════════════════════
  e2e-tests:
    name: 🌐 E2E Tests (Tier-0)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [unit-tests, component-tests]
    steps:
      - uses: actions/checkout@v4
      - name: Deferred outside main/develop
        if: ${{ !(github.event_name == 'workflow_dispatch' || github.ref_name == 'main' || github.ref_name == 'develop') }}
        run: |
          echo "E2E Tier-0 deferred (run on main/develop or via workflow_dispatch)." >> "$GITHUB_STEP_SUMMARY"
      - name: Capture job start
        if: ${{ github.event_name == 'workflow_dispatch' || github.ref_name == 'main' || github.ref_name == 'develop' }}
        run: echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"

      - name: Setup Node.js
        if: ${{ github.event_name == 'workflow_dispatch' || github.ref_name == 'main' || github.ref_name == 'develop' }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        if: ${{ github.event_name == 'workflow_dispatch' || github.ref_name == 'main' || github.ref_name == 'develop' }}
        run: npm ci

      - name: Install Playwright browsers
        if: ${{ github.event_name == 'workflow_dispatch' || github.ref_name == 'main' || github.ref_name == 'develop' }}
        run: npx playwright install --with-deps chromium

      - name: Build application
        if: ${{ github.event_name == 'workflow_dispatch' || github.ref_name == 'main' || github.ref_name == 'develop' }}
        run: npm run build

      - name: Run E2E tests
        # Tier-0 deterministic smoke suite (PR gate)
        if: ${{ github.event_name == 'workflow_dispatch' || github.ref_name == 'main' || github.ref_name == 'develop' }}
        run: npm run test:e2e:tier0
        env:
          CI: true
          NODE_ENV: test
          E2E_USE_WEB_SERVER: 'true'
          E2E_BACKEND_RUNNER: build
          E2E_MODE: 'true'
          E2E_API_URL: http://127.0.0.1:3001
          E2E_BASE_URL: http://127.0.0.1:3000
          TEST_SUPPORT_KEY: local-test-support-key-change-me

      - name: Upload Playwright report
        if: ${{ always() && (github.event_name == 'workflow_dispatch' || github.ref_name == 'main' || github.ref_name == 'develop') }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e-results.xml
            test-results/
          retention-days: 30

      - name: Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: test-results/
          retention-days: 7
      - name: Job duration
        if: always()
        run: |
          end=$(date +%s)
          dur=$((end - JOB_START))
          echo "Job duration: ${dur}s" >> "$GITHUB_STEP_SUMMARY"

  # ═══════════════════════════════════════════════════════════════
  # E2E M06 MIND MAP GATE (Playwright, deterministic subset)
  # 5 critical specs: routing → canvas, fit-to-view, Tab=create-node
  # + POST /map/sync contract (baseVersion), repeated create,
  # reload persistence. Full deterministic M06 subset runs nightly
  # (e2e-nightly.yml → m06-mindmap). Same deferral model as
  # e2e-tests, so PR wall-time is unaffected.
  # ═══════════════════════════════════════════════════════════════
  e2e-m06-gate:
    name: 🧠 E2E M06 Mind Map Gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [unit-tests, component-tests]
    steps:
      - uses: actions/checkout@v4
      - name: Deferred outside main/develop
        if: ${{ !(github.event_name == 'workflow_dispatch' || github.ref_name == 'main' || github.ref_name == 'develop') }}
        run: |
          echo "E2E M06 gate deferred (run on main/develop or via workflow_dispatch)." >> "$GITHUB_STEP_SUMMARY"
      - name: Capture job start
        if: ${{ github.event_name == 'workflow_dispatch' || github.ref_name == 'main' || github.ref_name == 'develop' }}
        run: echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"

      - name: Setup Node.js
        if: ${{ github.event_name == 'workflow_dispatch' || github.ref_name == 'main' || github.ref_name == 'develop' }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        if: ${{ github.event_name == 'workflow_dispatch' || github.ref_name == 'main' || github.ref_name == 'develop' }}
        run: npm ci

      - name: Install Playwright browsers
        if: ${{ github.event_name == 'workflow_dispatch' || github.ref_name == 'main' || github.ref_name == 'develop' }}
        run: npx playwright install --with-deps chromium

      - name: Run M06 gate specs
        # Base playwright.config.ts webServer builds the frontend itself
        # (npm run build && vite preview) — no separate build step needed.
        if: ${{ github.event_name == 'workflow_dispatch' || github.ref_name == 'main' || github.ref_name == 'develop' }}
        run: npm run test:e2e:m06:gate
        env:
          CI: true
          NODE_ENV: test
          TEST_SUPPORT_KEY: local-test-support-key-change-me

      - name: Upload M06 gate artifacts
        if: ${{ always() && (github.event_name == 'workflow_dispatch' || github.ref_name == 'main' || github.ref_name == 'develop') }}
        uses: actions/upload-artifact@v4
        with:
          name: e2e-m06-gate-report
          path: |
            e2e-results.xml
            test-results/
            tests/e2e/screenshots/m06/
          retention-days: 30
      - name: Job duration
        if: always()
        run: |
          end=$(date +%s)
          dur=$((end - JOB_START))
          echo "Job duration: ${dur}s" >> "$GITHUB_STEP_SUMMARY"

  readiness-paths:
    name: 🧭 Readiness Smoke Scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run_readiness: ${{ steps.decide.outputs.run_readiness }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect readiness-related changes
        if: ${{ github.event_name == 'pull_request' }}
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            readiness:
              - 'src/views/SettingsView.tsx'
              - 'src/views/settings/**'
              - 'src/views/admin/**'
              - 'src/views/superadmin/**'
              - 'src/components/Admin/**'
              - 'src/components/Organization/**'
              - 'src/components/layout/SuperAdminSidebar.tsx'
              - 'src/routes/**'
              - 'src/services/api.ts'
              - 'src/services/api/**'
              - 'server/src/routes/testSupport.routes.ts'
              - 'tests/e2e/smoke/admin-settings-superadmin-readiness.spec.ts'
              - 'tests/e2e/smoke/global-setup.ts'
              - 'tests/e2e/smoke/global-teardown.ts'
              - 'playwright.config.ts'
              - 'playwright.smoke.config.ts'
              - 'package.json'
              - '.github/workflows/test-suite.yml'

      - name: Decide readiness smoke scope
        id: decide
        env:
          GH_EVENT: ${{ github.event_name }}
          GH_REF_NAME: ${{ github.ref_name }}
          READINESS_CHANGED: ${{ steps.filter.outputs.readiness || 'false' }}
        run: |
          if [ "$GH_EVENT" != "pull_request" ]; then
            echo "run_readiness=true" >> "$GITHUB_OUTPUT"
            echo "Readiness smoke enabled: non-PR run." >> "$GITHUB_STEP_SUMMARY"
          elif [ "$READINESS_CHANGED" = "true" ]; then
            echo "run_readiness=true" >> "$GITHUB_OUTPUT"
            echo "Readiness smoke enabled: relevant files changed in PR." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "run_readiness=false" >> "$GITHUB_OUTPUT"
            echo "Readiness smoke skipped: PR does not touch settings/admin/superadmin readiness surface." >> "$GITHUB_STEP_SUMMARY"
          fi

  readiness-smoke:
    name: ✅ Readiness Smoke (Settings/Admin/SuperAdmin)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [unit-tests, component-tests, readiness-paths]
    if: ${{ needs.readiness-paths.outputs.run_readiness == 'true' && (github.event_name == 'workflow_dispatch' || github.ref_name == 'main' || github.ref_name == 'develop') }}
    steps:
      - uses: actions/checkout@v4
      - name: Capture job start
        run: echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run readiness smoke gate
        run: npm run test:e2e:readiness
        env:
          CI: true
          NODE_ENV: test
          PLAYWRIGHT_NO_GIT_INFO: 1
          TEST_SUPPORT_KEY: local-test-support-key-change-me

      - name: Upload readiness smoke artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: readiness-smoke-artifacts
          path: |
            e2e-results.xml
            test-results/
          retention-days: 30

      - name: Job duration
        if: always()
        run: |
          end=$(date +%s)
          dur=$((end - JOB_START))
          echo "Job duration: ${dur}s" >> "$GITHUB_STEP_SUMMARY"

  # ═══════════════════════════════════════════════════════════════
  # L4 SMOKE (Playwright + started web servers)
  # Small, deterministic UI+API smoke suite for merge gating.
  # ═══════════════════════════════════════════════════════════════
  l4-smoke:
    name: 🧨 L4 Smoke (Remote-only)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [unit-tests, component-tests]
    if: ${{ github.event_name != 'pull_request' }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Precheck remote secrets
        id: precheck
        run: |
          if [ -z "${E2E_API_URL}" ] || [ -z "${E2E_BASE_URL}" ] || [ -z "${TEST_SUPPORT_KEY}" ]; then
            echo "run_l4=false" >> "$GITHUB_OUTPUT"
            echo "L4 smoke skipped: required secrets are not configured." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "run_l4=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          E2E_API_URL: ${{ secrets.E2E_API_URL }}
          E2E_BASE_URL: ${{ secrets.E2E_BASE_URL }}
          TEST_SUPPORT_KEY: ${{ secrets.TEST_SUPPORT_KEY }}

      - name: Install Playwright browsers
        if: ${{ steps.precheck.outputs.run_l4 == 'true' }}
        run: npx playwright install --with-deps chromium

      - name: Run L4 smoke
        if: ${{ steps.precheck.outputs.run_l4 == 'true' }}
        run: npm run test:l4:remote
        env:
          CI: true
          NODE_ENV: test
          E2E_USE_WEB_SERVER: 'false'
          E2E_API_URL: ${{ secrets.E2E_API_URL }}
          E2E_BASE_URL: ${{ secrets.E2E_BASE_URL }}
          TEST_SUPPORT_KEY: ${{ secrets.TEST_SUPPORT_KEY }}

      - name: Upload L4 smoke artifacts
        if: ${{ always() && steps.precheck.outputs.run_l4 == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: l4-smoke-artifacts
          path: |
            e2e-results.xml
            test-results/
          retention-days: 30

  # ═══════════════════════════════════════════════════════════════
  # RUNTIME SMOKE (Playwright + started web servers)
  # Deterministic AI Chat end-to-end guarantee.
  #
  # STATUS 2026-07-14: blocking again. Was informational (continue-on-error) because
  # the ai-chat spec was deterministically red due to product drift: the E2E identity
  # had no organization_members row (team-conversation permission model added after
  # the spec was written), and the E2E_MODE stub in /ai/chat/stream didn't persist
  # messages despite its comment. Fixed: server/src/middleware/auth.middleware.ts now
  # seeds an organization_members row for the E2E_MODE bypass identity, and the
  # /ai/chat/stream E2E_MODE stub persists both messages (server/src/routes/ai.routes.ts).
  # Verified green locally (tests/e2e/runtime, 3/3 passed) before re-enabling the gate.
  # ═══════════════════════════════════════════════════════════════
  e2e-runtime-smoke:
    name: 🔥 Runtime Smoke (AI Chat)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [unit-tests, component-tests]
    if: ${{ github.event_name != 'pull_request' }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install server dependencies
        # webServer bootuje backend z server/src przez tsx; Node szuka pakietów
        # w server/node_modules → root. Bez tego kroku pakiety obecne TYLKO w
        # server/package.json (np. cheerio) dają ERR_MODULE_NOT_FOUND (run
        # 29347143754), choć lokalnie działa przez symlink node_modules.
        run: npm ci --prefix server

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Runtime Smoke (AI Chat)
        # list reporter keeps webServer/globalSetup failures visible in the CI
        # log (junit-only swallowed them: the 29323160229 run printed a bare
        # <testsuites tests="0"> after 287s with no cause); junit still goes to
        # e2e-results.xml via PLAYWRIGHT_JUNIT_OUTPUT_NAME so the artifact
        # upload below actually has a file (previously junit went to stdout).
        run: npx playwright test tests/e2e/runtime --reporter=list,junit
        env:
          CI: true
          NODE_ENV: test
          E2E_MODE: true
          E2E_USE_WEB_SERVER: 'true'
          E2E_API_URL: http://127.0.0.1:3001
          E2E_BASE_URL: http://127.0.0.1:3000
          TEST_SUPPORT_KEY: local-test-support-key-change-me
          PLAYWRIGHT_JUNIT_OUTPUT_NAME: e2e-results.xml

      - name: Upload Runtime Smoke report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-runtime-smoke-report
          path: |
            e2e-results.xml
            test-results/
          retention-days: 30

  # ═══════════════════════════════════════════════════════════════
  # PERFORMANCE TESTS
  # ═══════════════════════════════════════════════════════════════
  # ═══════════════════════════════════════════════════════════════
  # CRITICAL PATH COVERAGE CHECK
  # ═══════════════════════════════════════════════════════════════
  critical-path-coverage:
    name: 🔒 Critical Path Coverage Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [unit-tests]
    steps:
      - uses: actions/checkout@v4
      - name: Deferred outside main/develop
        if: ${{ !(github.event_name == 'workflow_dispatch' || github.ref_name == 'main' || github.ref_name == 'develop') }}
        run: |
          echo "Critical path coverage deferred (run on main/develop or via workflow_dispatch)." >> "$GITHUB_STEP_SUMMARY"
      - name: Capture job start
        if: ${{ github.event_name == 'workflow_dispatch' || github.ref_name == 'main' || github.ref_name == 'develop' }}
        run: echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"

      - name: Setup Node.js
        if: ${{ github.event_name == 'workflow_dispatch' || github.ref_name == 'main' || github.ref_name == 'develop' }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        if: ${{ github.event_name == 'workflow_dispatch' || github.ref_name == 'main' || github.ref_name == 'develop' }}
        run: npm ci

      - name: Install bc + jq (for numeric comparison + JSON)
        if: ${{ github.event_name == 'workflow_dispatch' || github.ref_name == 'main' || github.ref_name == 'develop' }}
        run: sudo apt-get update && sudo apt-get install -y bc jq

      - name: Run critical tests with coverage
        if: ${{ github.event_name == 'workflow_dispatch' || github.ref_name == 'main' || github.ref_name == 'develop' }}
        run: |
          npm run test:unit:critical -- --coverage --reporter=junit --outputFile=junit-critical.xml

      - name: Check critical path coverage threshold
        if: ${{ github.event_name == 'workflow_dispatch' || github.ref_name == 'main' || github.ref_name == 'develop' }}
        run: |
          if [ ! -f coverage/coverage-summary.json ]; then
            echo "::error::Coverage report not found (coverage/coverage-summary.json). Failing gate."
            exit 1
          fi

          get_pct () {
            local suffix="$1"
            jq -r --arg suf "$suffix" '
              to_entries
              | map(select(.key | endswith($suf)))
              | .[0].value.lines.pct // empty
            ' coverage/coverage-summary.json
          }

          check_min () {
            local suffix="$1"
            local min="$2"
            local pct
            pct="$(get_pct "$suffix")"

            if [ -z "$pct" ]; then
              echo "::error::Coverage entry not found for $suffix"
              exit 1
            fi

            echo "Coverage lines for $suffix: $pct% (min $min%)"
            if (( $(echo "$pct < $min" | bc -l) )); then
              echo "::error::Coverage for $suffix ($pct%) below $min% threshold!"
              exit 1
            fi
          }

          # Critical path coverage checks (focused, not global total)
          check_min "/server/src/middleware/csrf.middleware.ts" 95
          check_min "/server/src/middleware/auth.middleware.ts" 95
          check_min "/server/src/middleware/permission.middleware.ts" 95
          check_min "/server/src/middleware/inputSanitization.middleware.ts" 95

      - name: Upload critical coverage report
        if: ${{ always() && (github.event_name == 'workflow_dispatch' || github.ref_name == 'main' || github.ref_name == 'develop') }}
        uses: actions/upload-artifact@v4
        with:
          name: critical-coverage-report
          path: coverage/
          retention-days: 30

      - name: Upload critical JUnit report
        if: ${{ always() && (github.event_name == 'workflow_dispatch' || github.ref_name == 'main' || github.ref_name == 'develop') }}
        uses: actions/upload-artifact@v4
        with:
          name: critical-junit-report
          path: junit-critical.xml
          retention-days: 30
      - name: Job duration
        if: always()
        run: |
          end=$(date +%s)
          dur=$((end - JOB_START))
          echo "Job duration: ${dur}s" >> "$GITHUB_STEP_SUMMARY"

  # ═══════════════════════════════════════════════════════════════
  # PATCH COVERAGE GATE (PR only — ≥80% on changed files)
  # ═══════════════════════════════════════════════════════════════
  patch-coverage:
    name: 📈 Patch Coverage Gate (≥80%)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [unit-tests, component-tests, integration-tests]
    if: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Deferred outside main/develop
        if: ${{ !(github.event_name == 'workflow_dispatch' || github.ref_name == 'main' || github.ref_name == 'develop') }}
        run: |
          echo "Patch coverage deferred (run on main/develop or via workflow_dispatch)." >> "$GITHUB_STEP_SUMMARY"

      - name: Setup Node.js
        if: ${{ github.event_name == 'workflow_dispatch' || github.ref_name == 'main' || github.ref_name == 'develop' }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        if: ${{ github.event_name == 'workflow_dispatch' || github.ref_name == 'main' || github.ref_name == 'develop' }}
        run: npm ci

      - name: Run tests with coverage
        if: ${{ github.event_name == 'workflow_dispatch' || github.ref_name == 'main' || github.ref_name == 'develop' }}
        run: npm run test:coverage

      - name: Run patch coverage gate
        if: ${{ github.event_name == 'workflow_dispatch' || github.ref_name == 'main' || github.ref_name == 'develop' }}
        run: npx tsx scripts/testing/patch-coverage-gate.ts --coverage-json coverage/coverage-final.json --threshold 80 --base origin/${{ github.base_ref }}

      - name: Upload patch coverage report
        if: ${{ always() && (github.event_name == 'workflow_dispatch' || github.ref_name == 'main' || github.ref_name == 'develop') }}
        uses: actions/upload-artifact@v4
        with:
          name: patch-coverage-report
          path: coverage/
          retention-days: 7

  # ═══════════════════════════════════════════════════════════════
  # COVERAGE REPORT
  # ═══════════════════════════════════════════════════════════════
  coverage:
    name: 📊 Coverage Report
    runs-on: ubuntu-latest
    timeout-minutes: 75
    needs: [unit-tests, component-tests, integration-tests]
    if: ${{ github.event_name != 'pull_request' }}
    # INFORMATIONAL (2026-07-14): pierwszy pełny przebieg w historii (75 min,
    # realny PG) odsłonił zastany dług 256 failing / 220 plików z 17 369 testów
    # — testy biegające WYŁĄCZNIE tutaj (nie w shardowanych jobach, które są
    # zielone). Do spłaty programem burn-down; po zejściu do 0 usunąć
    # continue-on-error, żeby coverage znów blokował.
    continue-on-error: true
    # Coverage odpala PEŁNY test:coverage (w tym tests/integration wymagające
    # realnego Postgresa) — bez serwisu DB 228 plików testowych padało na
    # ECONNREFUSED (2026-07-14). Serwis + migracje skopiowane 1:1 z joba
    # integration-tests (którego krok testowy jest gate'owany do main/develop,
    # więc na innych gałęziach to coverage jest jedynym realnym wykonaniem
    # testów integracyjnych).
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: iris
          POSTGRES_PASSWORD: iris_test
          POSTGRES_DB: iris_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install server dependencies
        # tests/integration/routes/** importują server/src, którego zależności
        # (socket.io, cheerio) żyją TYLKO w server/package.json. Bez tego kroku
        # ~112 plików routes/ crashuje na imporcie (ERR_MODULE_NOT_FOUND) — to
        # gros z 220 failing plików wykrytych 2026-07-14 (nie regresja, dług
        # nigdy nieodpalany na demo). Ten sam wzorzec co job Runtime Smoke.
        run: npm ci --prefix server

      - name: Install bc + jq (for numeric comparison + JSON)
        run: sudo apt-get update && sudo apt-get install -y bc jq

      - name: Migrate DB (strict)
        run: DB_TYPE=postgres DATABASE_URL=postgres://iris:iris_test@localhost:5432/iris_test npm run db:migrate:strict

      - name: Run tests with coverage
        run: npm run test:coverage
        env:
          DB_TYPE: postgres
          DATABASE_URL: postgres://iris:iris_test@localhost:5432/iris_test
          # See the note in colocated-tests. This job carries no branch gate, so it is
          # the one that actually runs on demo/Londyn — and it was measuring the mock.
          RUN_DB_TESTS: '1'
          MOCK_DB: 'false'

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 30

      - name: Check coverage thresholds
        run: |
          if [ ! -f coverage/coverage-summary.json ]; then
            echo "::error::Coverage report not found (coverage/coverage-summary.json). Failing gate."
            exit 1
          fi

          get_pct () {
            local suffix="$1"
            jq -r --arg suf "$suffix" '
              to_entries
              | map(select(.key | endswith($suf)))
              | .[0].value.lines.pct // empty
            ' coverage/coverage-summary.json
          }

          check_min () {
            local suffix="$1"
            local min="$2"
            local pct
            pct="$(get_pct "$suffix")"

            if [ -z "$pct" ]; then
              echo "::error::Coverage entry not found for $suffix"
              exit 1
            fi

            echo "Coverage lines for $suffix: $pct% (min $min%)"
            if (( $(echo "$pct < $min" | bc -l) )); then
              echo "::error::Coverage for $suffix ($pct%) below $min% threshold!"
              exit 1
            fi
          }

          # Same critical coverage checks (focused, not global total)
          check_min "/server/src/middleware/csrf.middleware.ts" 95
          check_min "/server/src/middleware/auth.middleware.ts" 95
          check_min "/server/src/middleware/permission.middleware.ts" 95
          check_min "/server/src/middleware/inputSanitization.middleware.ts" 95

  # ═══════════════════════════════════════════════════════════════
  # FINAL REPORT
  # ═══════════════════════════════════════════════════════════════
  pr-gate:
    name: ✅ PR Gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      [
        lint-typecheck,
        test-quality-check,
        skip-scan-gate,
        levels-coverage-gates,
        unit-tests,
        component-tests,
        integration-tests,
        colocated-tests,
        security-integrity,
        e2e-tests,
        e2e-m06-gate,
        readiness-smoke,
        patch-coverage,
        initiatives-tests,
      ]
    if: ${{ github.event_name == 'pull_request' }}
    steps:
      - name: Fail if any required job failed
        env:
          LINT: ${{ needs.lint-typecheck.result }}
          TEST_QUALITY: ${{ needs.test-quality-check.result }}
          SKIP_GATE: ${{ needs.skip-scan-gate.result }}
          LEVELS: ${{ needs.levels-coverage-gates.result }}
          UNIT: ${{ needs.unit-tests.result }}
          COMPONENT: ${{ needs.component-tests.result }}
          INTEGRATION: ${{ needs.integration-tests.result }}
          COLOCATED: ${{ needs.colocated-tests.result }}
          SECURITY_INTEGRITY: ${{ needs.security-integrity.result }}
          E2E_TIER0: ${{ needs.e2e-tests.result }}
          E2E_M06_GATE: ${{ needs.e2e-m06-gate.result }}
          READINESS: ${{ needs.readiness-smoke.result }}
          PATCH_COVERAGE: ${{ needs.patch-coverage.result }}
        run: |
          echo "PR Gate results:"
          echo "  lint-typecheck=$LINT"
          echo "  test-quality-check=$TEST_QUALITY"
          echo "  skip-scan-gate=$SKIP_GATE"
          echo "  levels-coverage-gates=$LEVELS"
          echo "  unit-tests=$UNIT"
          echo "  component-tests=$COMPONENT"
          echo "  integration-tests=$INTEGRATION"
          echo "  colocated-tests=$COLOCATED"
          echo "  security-integrity=$SECURITY_INTEGRITY"
          echo "  e2e-tests=$E2E_TIER0"
          echo "  e2e-m06-gate=$E2E_M06_GATE"
          echo "  readiness-smoke=$READINESS"
          echo "  patch-coverage=$PATCH_COVERAGE"

          fail=0

          req_ok () {
            name="$1"
            val="$2"
            if [ "$val" != "success" ]; then
              echo "::error::$name is $val (expected success)"
              fail=1
            fi
          }

          # readiness-smoke may be scoped out on PRs; skipped is acceptable.
          req_ok_or_skipped () {
            name="$1"
            val="$2"
            if [ "$val" != "success" ] && [ "$val" != "skipped" ]; then
              echo "::error::$name is $val (expected success or skipped)"
              fail=1
            fi
          }

          req_ok "lint-typecheck" "$LINT"
          req_ok "test-quality-check" "$TEST_QUALITY"
          req_ok "skip-scan-gate" "$SKIP_GATE"
          req_ok "levels-coverage-gates" "$LEVELS"
          req_ok "unit-tests" "$UNIT"
          req_ok "component-tests" "$COMPONENT"
          req_ok "integration-tests" "$INTEGRATION"
          req_ok "colocated-tests" "$COLOCATED"
          req_ok "security-integrity" "$SECURITY_INTEGRITY"
          req_ok "e2e-tests" "$E2E_TIER0"
          req_ok "e2e-m06-gate" "$E2E_M06_GATE"
          req_ok_or_skipped "readiness-smoke" "$READINESS"
          req_ok "patch-coverage" "$PATCH_COVERAGE"

          exit "$fail"

  test-summary:
    name: 📋 Test Summary
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      [
        pr-gate,
        lint-typecheck,
        test-quality-check,
        skip-scan-gate,
        levels-coverage-gates,
        unit-tests,
        component-tests,
        integration-tests,
        colocated-tests,
        security-integrity,
        security-tests,
        e2e-tests,
        readiness-smoke,
        performance-tests,
        critical-path-coverage,
        patch-coverage,
      ]
    if: always()
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: test-artifacts

      - name: Generate summary
        run: |
          echo "# 🧪 IRIS 6.0 Test Suite Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # PR Golden Gates section
          echo "## 🔒 PR Golden Gates (must pass for merge)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Gate | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Lint & Type Check | ${{ needs.lint-typecheck.result == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Test Quality (Anti-Placeholder) | ${{ needs.test-quality-check.result == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Skip/Only Gate | ${{ needs.skip-scan-gate.result == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Security Integrity (29 checks) | ${{ needs.security-integrity.result == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Coverage Gates (L1–L3, 95%) | ${{ needs.levels-coverage-gates.result == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Critical Path Coverage (95%) | ${{ needs.critical-path-coverage.result == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Unit Tests (4 shards) | ${{ needs.unit-tests.result == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Component Tests | ${{ needs.component-tests.result == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Integration Tests | ${{ needs.integration-tests.result == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Colocated __tests__ (server + src) | ${{ needs.colocated-tests.result == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| E2E Tests (Tier-0) | ${{ needs.e2e-tests.result == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Readiness Smoke (Settings/Admin/SuperAdmin) | ${{ needs.readiness-smoke.result == 'success' && '✅' || (needs.readiness-smoke.result == 'skipped' && '⏭️ scoped out' || '❌') }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Patch Coverage (≥80%) | ${{ needs.patch-coverage.result == 'success' && '✅' || (needs.patch-coverage.result == 'skipped' && '⏭️ non-PR' || '❌') }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Nightly/non-PR suites
          echo "## 🌙 Extended Suites (nightly / non-PR)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Suite | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Security Tests | ${{ needs.security-tests.result == 'success' && '✅' || (needs.security-tests.result == 'skipped' && '⏭️ skipped' || '❌') }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Performance Tests | ${{ needs.performance-tests.result == 'success' && '✅' || (needs.performance-tests.result == 'skipped' && '⏭️ skipped' || '❌') }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

      - name: Append job durations
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
          REPO: ${{ github.repository }}
        run: |
          python3 <<'PY'
          import json
          import os
          import urllib.request
          from datetime import datetime

          token = os.environ["GH_TOKEN"]
          run_id = os.environ["RUN_ID"]
          repo = os.environ["REPO"]
          url = f"https://api.github.com/repos/{repo}/actions/runs/{run_id}/jobs?per_page=100"
          req = urllib.request.Request(url, headers={
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
          })
          with urllib.request.urlopen(req) as resp:
              payload = json.loads(resp.read().decode("utf-8"))

          jobs = payload.get("jobs", [])
          rows = []
          for job in jobs:
              started = job.get("started_at")
              completed = job.get("completed_at")
              duration = "n/a"
              if started and completed:
                  s = datetime.fromisoformat(started.replace("Z", "+00:00"))
                  c = datetime.fromisoformat(completed.replace("Z", "+00:00"))
                  total = int((c - s).total_seconds())
                  duration = f"{total//60}m {total%60}s"
              rows.append((job.get("name", "unknown"), job.get("conclusion", "unknown"), duration))

          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          with open(summary, "a", encoding="utf-8") as f:
              f.write("## ⏱️ Job Durations\n\n")
              f.write("| Job | Result | Duration |\n")
              f.write("|-----|--------|----------|\n")
              for name, result, duration in rows:
                  f.write(f"| {name} | {result} | {duration} |\n")
              f.write("\n")
          PY

      - name: Parse JUnit artifacts for flaky detection
        if: always()
        run: |
          echo "## 📊 Test Results from JUnit Reports" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          TOTAL_TESTS=0
          TOTAL_FAILURES=0
          TOTAL_ERRORS=0
          TOTAL_SKIPPED=0

          for xml in $(find test-artifacts -name '*.xml' -type f 2>/dev/null); do
            suite_name=$(basename "$xml" .xml)
            tests=$(grep -oP 'tests="\K[0-9]+' "$xml" 2>/dev/null | head -1 || echo "0")
            failures=$(grep -oP 'failures="\K[0-9]+' "$xml" 2>/dev/null | head -1 || echo "0")
            errors=$(grep -oP 'errors="\K[0-9]+' "$xml" 2>/dev/null | head -1 || echo "0")
            skipped=$(grep -oP 'skipped="\K[0-9]+' "$xml" 2>/dev/null | head -1 || echo "0")
            time=$(grep -oP 'time="\K[0-9.]+' "$xml" 2>/dev/null | head -1 || echo "0")

            TOTAL_TESTS=$((TOTAL_TESTS + tests))
            TOTAL_FAILURES=$((TOTAL_FAILURES + failures))
            TOTAL_ERRORS=$((TOTAL_ERRORS + errors))
            TOTAL_SKIPPED=$((TOTAL_SKIPPED + skipped))

            echo "- **${suite_name}**: ${tests} tests, ${failures} failures, ${errors} errors, ${skipped} skipped (${time}s)" >> $GITHUB_STEP_SUMMARY
          done

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Totals**: ${TOTAL_TESTS} tests, ${TOTAL_FAILURES} failures, ${TOTAL_ERRORS} errors, ${TOTAL_SKIPPED} skipped" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Flaky indicator: tests that appear in retry results
          RETRIED=$(find test-artifacts -name '*.xml' -exec grep -l 'retry' {} \; 2>/dev/null | wc -l || echo "0")
          if [ "$RETRIED" -gt 0 ]; then
            echo "⚠️ **Flaky signal**: ${RETRIED} JUnit files contain retried tests." >> $GITHUB_STEP_SUMMARY
          else
            echo "✅ **No flaky signals detected** in JUnit reports." >> $GITHUB_STEP_SUMMARY
          fi

      - name: Generate flaky report artifact
        if: always()
        run: |
          npx tsx scripts/testing/junit-flaky-report.ts --dir test-artifacts --out test-results/flaky-report

      - name: Upload flaky report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flaky-report
          path: test-results/flaky-report
          retention-days: 30

      - name: Generate flaky trend (top retries)
        if: always()
        run: |
          npx tsx scripts/testing/junit-retry-trend.ts --dir test-artifacts --out test-results/flaky-trend --top 10

      - name: Upload flaky trend
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flaky-trend
          path: test-results/flaky-trend
          retention-days: 30

      - name: High-risk scan
        if: always()
        run: |
          npx tsx scripts/testing/high-risk-scan.ts

      - name: Upload high-risk scan
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: high-risk-scan
          path: test-results/high-risk-scan
          retention-days: 30
