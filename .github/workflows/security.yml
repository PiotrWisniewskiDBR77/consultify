# Enterprise Security Scanning Workflow
# Runs on schedule and can be triggered manually

name: Security Audit

on:
  schedule:
    # Run every Monday at 9:00 AM UTC
    - cron: '0 9 * * 1'
  workflow_dispatch: # Allow manual trigger

env:
  NODE_VERSION: '20'

jobs:
  # ==========================================
  # Comprehensive Security Audit
  # ==========================================
  security-audit:
    name: Full Security Audit
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Full history for better analysis

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # ==========================================
      # NPM Audit (Dependency vulnerabilities)
      # ==========================================
      - name: NPM Audit - Production Dependencies
        run: npm audit --omit=dev --audit-level=moderate
        continue-on-error: true

      - name: NPM Audit - All Dependencies
        run: npm audit --audit-level=high
        continue-on-error: true

      # ==========================================
      # Snyk Security Scan
      # ==========================================
      - name: Snyk Security Scan
        uses: snyk/actions/node@master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high

      # ==========================================
      # OWASP Dependency Check
      # ==========================================
      - name: OWASP Dependency Check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: 'Consultify'
          path: '.'
          format: 'HTML'
          out: 'reports'
        continue-on-error: true

      - name: Upload OWASP Report
        uses: actions/upload-artifact@v4
        with:
          name: owasp-report
          path: reports/
          retention-days: 30

      # ==========================================
      # Trivy Vulnerability Scanner
      # ==========================================
      - name: Trivy Filesystem Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-fs-results.sarif'
          severity: 'CRITICAL,HIGH,MEDIUM'

      - name: Upload Trivy Results
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: 'trivy-fs-results.sarif'

      # ==========================================
      # Secret Detection (GitLeaks)
      # ==========================================
      - name: GitLeaks Secret Scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
        continue-on-error: true

      # ==========================================
      # CodeQL Analysis
      # ==========================================
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript, typescript
          queries: security-extended, security-and-quality

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:javascript"

  # ==========================================
  # Docker Image Security (if applicable)
  # ==========================================
  docker-security:
    name: Docker Security Scan
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: docker build -t consultify:scan .
        continue-on-error: true

      - name: Trivy Container Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'consultify:scan'
          format: 'sarif'
          output: 'trivy-docker-results.sarif'
          severity: 'CRITICAL,HIGH'
        continue-on-error: true

  # ==========================================
  # Generate Security Report
  # ==========================================
  security-report:
    name: Generate Security Report
    runs-on: ubuntu-latest
    needs: [security-audit]
    steps:
      - name: Download OWASP Report
        uses: actions/download-artifact@v4
        with:
          name: owasp-report
          path: reports/
        continue-on-error: true

      - name: Create Security Summary
        run: |
          echo "# Security Audit Report" > security-summary.md
          echo "Generated: $(date)" >> security-summary.md
          echo "" >> security-summary.md
          echo "## Scan Results" >> security-summary.md
          echo "- NPM Audit: Check workflow logs" >> security-summary.md
          echo "- Snyk: Check workflow logs" >> security-summary.md
          echo "- OWASP: See attached report" >> security-summary.md
          echo "- Trivy: See GitHub Security tab" >> security-summary.md
          echo "- CodeQL: See GitHub Security tab" >> security-summary.md
          echo "- GitLeaks: Check workflow logs" >> security-summary.md

      - name: Upload Security Summary
        uses: actions/upload-artifact@v4
        with:
          name: security-summary
          path: security-summary.md
          retention-days: 90
