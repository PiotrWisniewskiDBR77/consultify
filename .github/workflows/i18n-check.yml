name: i18n Translation Check

on:
  pull_request:
    paths:
      - 'public/locales/en/**'
      - 'scripts/i18n/**'
  push:
    branches:
      - main
      - Londyn
    paths:
      - 'public/locales/en/**'

jobs:
  check-translations:
    name: Check for Missing Translations
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check for missing translations
        run: npm run i18n:check
        continue-on-error: true
        id: check

      - name: Validate JSON structure
        run: npm run i18n:validate

      - name: Comment on PR (if translations missing)
        if: steps.check.outcome == 'failure' && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `⚠️ **Missing Translations Detected**
              
              Changes to English locale files require translations in other languages.
              
              Run locally to translate:
              \`\`\`bash
              npm run i18n:translate
              \`\`\`
              
              Or run with force to regenerate all:
              \`\`\`bash
              npm run i18n:translate -- --force
              \`\`\``
            })

  auto-translate:
    name: Auto-Translate (on main)
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: check-translations

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run auto-translation
        run: npm run i18n:translate
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      - name: Check for changes
        id: git-check
        run: |
          git diff --exit-code public/locales/ || echo "changes=true" >> $GITHUB_OUTPUT

      - name: Create Pull Request
        if: steps.git-check.outputs.changes == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'chore(i18n): auto-translate help documentation'
          title: '🌐 Auto-translate help documentation'
          body: |
            This PR was automatically generated by the i18n translation workflow.

            ## Changes
            - Updated translations for help documentation in all supported languages

            ## Checklist
            - [ ] Review translated content for accuracy
            - [ ] Run app locally to verify UI
          branch: auto-i18n-translations
          delete-branch: true
          labels: |
            i18n
            automated
