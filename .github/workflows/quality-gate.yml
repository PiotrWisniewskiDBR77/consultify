# Quality Gate Workflow
# Blocks PRs that don't meet quality standards

name: Quality Gate

on:
  pull_request:
    branches: [main, develop]

env:
  NODE_VERSION: '20.11.0'

jobs:
  quality-gate:
    name: Quality Gate Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for SonarCloud

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: |
          npm run test:unit -- --coverage
          npm run test:component -- --coverage
        env:
          NODE_ENV: test
          MOCK_DB: 'true'
          MOCK_REDIS: 'true'
          CI: 'true'

      - name: SonarCloud Scan
        uses: sonarsource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        if: ${{ secrets.SONAR_TOKEN != '' }}

      - name: Check Coverage Thresholds
        id: coverage-check
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            STATEMENTS=$(node -p "require('./coverage/coverage-summary.json').total.statements.pct")
            BRANCHES=$(node -p "require('./coverage/coverage-summary.json').total.branches.pct")
            FUNCTIONS=$(node -p "require('./coverage/coverage-summary.json').total.functions.pct")
            LINES=$(node -p "require('./coverage/coverage-summary.json').total.lines.pct")
            
            echo "Current Coverage:"
            echo "  Statements: ${STATEMENTS}%"
            echo "  Branches: ${BRANCHES}%"
            echo "  Functions: ${FUNCTIONS}%"
            echo "  Lines: ${LINES}%"
            
            # Thresholds
            THRESHOLD_STATEMENTS=85
            THRESHOLD_BRANCHES=80
            THRESHOLD_FUNCTIONS=85
            THRESHOLD_LINES=85
            
            FAILED=0
            
            if (( $(echo "$STATEMENTS < $THRESHOLD_STATEMENTS" | bc -l) )); then
              echo "::error::Statements coverage ${STATEMENTS}% is below threshold ${THRESHOLD_STATEMENTS}%"
              FAILED=1
            fi
            
            if (( $(echo "$BRANCHES < $THRESHOLD_BRANCHES" | bc -l) )); then
              echo "::warning::Branches coverage ${BRANCHES}% is below threshold ${THRESHOLD_BRANCHES}%"
            fi
            
            if (( $(echo "$FUNCTIONS < $THRESHOLD_FUNCTIONS" | bc -l) )); then
              echo "::error::Functions coverage ${FUNCTIONS}% is below threshold ${THRESHOLD_FUNCTIONS}%"
              FAILED=1
            fi
            
            if (( $(echo "$LINES < $THRESHOLD_LINES" | bc -l) )); then
              echo "::error::Lines coverage ${LINES}% is below threshold ${THRESHOLD_LINES}%"
              FAILED=1
            fi
            
            if [ $FAILED -eq 1 ]; then
              echo "coverage_passed=false" >> $GITHUB_OUTPUT
              exit 1
            else
              echo "coverage_passed=true" >> $GITHUB_OUTPUT
              echo "✅ All coverage thresholds met!"
            fi
          else
            echo "::warning::Coverage summary not found"
            echo "coverage_passed=false" >> $GITHUB_OUTPUT
          fi

      - name: Check Code Quality
        id: quality-check
        run: |
          # Run linting
          npm run lint || echo "lint_passed=false" >> $GITHUB_OUTPUT
          
          # Run type checking
          npm run type-check || echo "typecheck_passed=false" >> $GITHUB_OUTPUT
          
          echo "quality_passed=true" >> $GITHUB_OUTPUT

      - name: Quality Gate Summary
        if: always()
        run: |
          echo "## Quality Gate Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Coverage | ${{ steps.coverage-check.outcome }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Code Quality | ${{ steps.quality-check.outcome }} |" >> $GITHUB_STEP_SUMMARY
          echo "| SonarCloud | ${{ job.status }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ steps.coverage-check.outcome }}" != "success" ] || [ "${{ steps.quality-check.outcome }}" != "success" ]; then
            echo "### ❌ Quality Gate Failed" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "This PR does not meet quality standards. Please:" >> $GITHUB_STEP_SUMMARY
            echo "- Add tests to increase coverage" >> $GITHUB_STEP_SUMMARY
            echo "- Fix linting errors" >> $GITHUB_STEP_SUMMARY
            echo "- Fix type errors" >> $GITHUB_STEP_SUMMARY
            echo "- Address SonarCloud issues" >> $GITHUB_STEP_SUMMARY
          else
            echo "### ✅ Quality Gate Passed" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "All quality checks passed!" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Comment PR
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '❌ **Quality Gate Failed**\n\nThis PR does not meet quality standards. Please review the quality gate results and address the issues.'
            })




