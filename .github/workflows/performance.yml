# Performance Testing Pipeline
# Runs performance benchmarks and load tests

name: Performance Testing

on:
  pull_request:
    branches: [main]
    paths:
      - 'server/**'
      - 'src/**'
      - 'package.json'
  schedule:
    # Run every Sunday at 2:00 AM UTC
    - cron: '0 2 * * 0'
  workflow_dispatch:
    inputs:
      load_test_duration:
        description: 'Load test duration (seconds)'
        required: false
        default: '60'
      concurrent_users:
        description: 'Number of concurrent users'
        required: false
        default: '50'

env:
  NODE_VERSION: '20'

jobs:
  # ==========================================
  # STAGE 1: API Performance Benchmarks
  # ==========================================
  api-benchmarks:
    name: API Performance Benchmarks
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: consultify_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install k6 for load testing
        run: |
          sudo gpg -k
          sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install k6

      - name: Start Backend Server
        run: |
          cd server
          npm run start:test &
          sleep 15
        env:
          NODE_ENV: test
          PORT: 3001
          DB_TYPE: postgres
          DATABASE_URL: postgresql://test:test@localhost:5432/consultify_test
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: test-jwt-secret-for-performance-testing
          MOCK_AI: 'true'

      - name: Run API Benchmark Tests
        run: |
          # Health endpoint benchmark
          echo "## API Benchmark Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Simple latency test
          echo "### Health Endpoint" >> $GITHUB_STEP_SUMMARY
          ab -n 1000 -c 10 http://localhost:3001/api/health 2>&1 | tee health-benchmark.txt
          
          # Extract key metrics
          REQUESTS_PER_SEC=$(grep "Requests per second" health-benchmark.txt | awk '{print $4}')
          MEAN_TIME=$(grep "Time per request" health-benchmark.txt | head -1 | awk '{print $4}')
          
          echo "- Requests/sec: $REQUESTS_PER_SEC" >> $GITHUB_STEP_SUMMARY
          echo "- Mean response time: ${MEAN_TIME}ms" >> $GITHUB_STEP_SUMMARY

      - name: Run k6 Load Tests
        run: |
          k6 run --out json=k6-results.json tests/performance/load-test.js
        env:
          K6_DURATION: ${{ github.event.inputs.load_test_duration || '60' }}s
          K6_VUS: ${{ github.event.inputs.concurrent_users || '50' }}
        continue-on-error: true

      - name: Process k6 Results
        if: always()
        run: |
          if [ -f k6-results.json ]; then
            echo "### Load Test Results" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            
            # Parse k6 results
            node -e "
              const fs = require('fs');
              const data = fs.readFileSync('k6-results.json', 'utf8')
                .split('\n')
                .filter(line => line.trim())
                .map(line => JSON.parse(line));
              
              const metrics = data.filter(d => d.type === 'Point');
              const httpReqs = metrics.filter(m => m.metric === 'http_reqs').length;
              const avgDuration = metrics
                .filter(m => m.metric === 'http_req_duration')
                .reduce((sum, m) => sum + m.data.value, 0) / httpReqs || 0;
              
              console.log('- Total requests:', httpReqs);
              console.log('- Avg response time:', avgDuration.toFixed(2), 'ms');
            " >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload Performance Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: performance-reports
          path: |
            health-benchmark.txt
            k6-results.json
          retention-days: 30

  # ==========================================
  # STAGE 2: Frontend Performance (Lighthouse)
  # ==========================================
  frontend-performance:
    name: Frontend Performance
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Frontend
        run: npm run build
        env:
          NODE_ENV: production

      - name: Start Preview Server
        run: |
          npx serve -s dist -l 3000 &
          sleep 5

      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v11
        with:
          urls: |
            http://localhost:3000/
            http://localhost:3000/login
          budgetPath: .github/lighthouse-budget.json
          uploadArtifacts: true
          temporaryPublicStorage: true

      - name: Performance Budget Check
        run: |
          echo "## Frontend Performance" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Bundle Analysis" >> $GITHUB_STEP_SUMMARY
          
          # Check bundle sizes
          TOTAL_SIZE=$(du -sb dist | cut -f1)
          TOTAL_SIZE_MB=$(echo "scale=2; $TOTAL_SIZE / 1048576" | bc)
          
          echo "- Total build size: ${TOTAL_SIZE_MB}MB" >> $GITHUB_STEP_SUMMARY
          
          # Check individual chunks
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Largest Files" >> $GITHUB_STEP_SUMMARY
          find dist -name "*.js" -o -name "*.css" | xargs ls -lS | head -10 | while read line; do
            SIZE=$(echo $line | awk '{print $5}')
            FILE=$(echo $line | awk '{print $9}')
            SIZE_KB=$(echo "scale=2; $SIZE / 1024" | bc)
            echo "- ${FILE}: ${SIZE_KB}KB" >> $GITHUB_STEP_SUMMARY
          done

  # ==========================================
  # STAGE 3: Memory & CPU Profiling
  # ==========================================
  resource-profiling:
    name: Resource Profiling
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Profile Memory Usage
        run: |
          cd server
          node --expose-gc --inspect=0 -e "
            const used = process.memoryUsage();
            console.log('Initial memory usage:');
            for (let key in used) {
              console.log(key + ': ' + Math.round(used[key] / 1024 / 1024 * 100) / 100 + ' MB');
            }
            
            // Require main modules
            require('./src/index.js');
            
            setTimeout(() => {
              global.gc();
              const afterLoad = process.memoryUsage();
              console.log('\\nAfter loading:');
              for (let key in afterLoad) {
                console.log(key + ': ' + Math.round(afterLoad[key] / 1024 / 1024 * 100) / 100 + ' MB');
              }
              process.exit(0);
            }, 5000);
          " 2>&1 | tee memory-profile.txt || true

      - name: Generate Profiling Summary
        if: always()
        run: |
          echo "## Resource Profiling" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f memory-profile.txt ]; then
            echo '```' >> $GITHUB_STEP_SUMMARY
            cat memory-profile.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi

  # ==========================================
  # STAGE 4: Database Query Performance
  # ==========================================
  database-performance:
    name: Database Query Performance
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: consultify_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Database Performance Tests
        run: |
          cd server
          npm run test:db-performance || echo "Database performance tests not yet implemented"
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/consultify_test
          DB_TYPE: postgres
        continue-on-error: true

      - name: Check Slow Queries
        run: |
          echo "## Database Performance" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Query performance checks completed." >> $GITHUB_STEP_SUMMARY
          echo "Monitor slow queries in production via Prometheus metrics." >> $GITHUB_STEP_SUMMARY

  # ==========================================
  # Summary Job
  # ==========================================
  performance-summary:
    name: Performance Summary
    runs-on: ubuntu-latest
    needs: [api-benchmarks, frontend-performance, resource-profiling, database-performance]
    if: always()
    steps:
      - name: Download All Reports
        uses: actions/download-artifact@v7
        with:
          path: reports/
        continue-on-error: true

      - name: Create Performance Report
        run: |
          echo "# Performance Test Summary" > performance-report.md
          echo "Run: $(date)" >> performance-report.md
          echo "" >> performance-report.md
          echo "## Job Results" >> performance-report.md
          echo "- API Benchmarks: ${{ needs.api-benchmarks.result }}" >> performance-report.md
          echo "- Frontend Performance: ${{ needs.frontend-performance.result }}" >> performance-report.md
          echo "- Resource Profiling: ${{ needs.resource-profiling.result }}" >> performance-report.md
          echo "- Database Performance: ${{ needs.database-performance.result }}" >> performance-report.md
          
          # Check if any job failed
          if [[ "${{ needs.api-benchmarks.result }}" == "failure" ]] || \
             [[ "${{ needs.frontend-performance.result }}" == "failure" ]]; then
            echo "" >> performance-report.md
            echo "⚠️ Some performance tests failed. Review before deployment." >> performance-report.md
          fi

      - name: Upload Performance Report
        uses: actions/upload-artifact@v4
        with:
          name: performance-summary
          path: performance-report.md
          retention-days: 30

      - name: Comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('performance-report.md', 'utf8');
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: report
            });

