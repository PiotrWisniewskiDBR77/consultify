name: Tests

on:
    push:
        branches: [main, develop]
    pull_request:
        branches: [main, develop]

jobs:
    test:
        runs-on: ubuntu-latest

        strategy:
            matrix:
                node-version: [18.x, 20.x]

        steps:
            - uses: actions/checkout@v3

            - name: Use Node.js ${{ matrix.node-version }}
              uses: actions/setup-node@v3
              with:
                  node-version: ${{ matrix.node-version }}
                  cache: 'npm'

            - name: Install dependencies
              run: npm ci

            - name: Run linter
              run: npm run lint

            - name: Run type check
              run: npm run type-check

            - name: Run unit tests
              run: npm run test:unit
              env:
                  NODE_ENV: test
                  MOCK_DB: 'true'
                  DB_TYPE: 'sqlite'
                  CI: 'true'

            - name: Run integration tests
              run: npm run test:integration
              env:
                  NODE_ENV: test
                  MOCK_DB: 'true'
                  DB_TYPE: 'sqlite'
                  CI: 'true'

            - name: Run component tests
              run: npm run test:component
              env:
                  NODE_ENV: test
                  CI: 'true'

            - name: Generate coverage report
              run: npm run test:coverage
              env:
                  NODE_ENV: test
                  MOCK_DB: 'true'
                  DB_TYPE: 'sqlite'
                  CI: 'true'

            - name: Upload coverage to Codecov
              uses: codecov/codecov-action@v4
              with:
                  files: |
                      ./coverage/coverage-final.json
                      ./coverage/lcov.info
                  flags: unittests
                  name: codecov-umbrella
                  token: ${{ secrets.CODECOV_TOKEN }}
                  fail_ci_if_error: false
                  verbose: true

    coverage:
        runs-on: ubuntu-latest
        needs: test

        steps:
            - uses: actions/checkout@v3

            - name: Use Node.js
              uses: actions/setup-node@v3
              with:
                  node-version: '20.x'
                  cache: 'npm'

            - name: Install dependencies
              run: npm ci

            - name: Run coverage
              run: npm run test:coverage

            - name: Check coverage thresholds
              run: |
                  # Check if coverage meets 95% threshold
                  npm run test:coverage -- --reporter=json > coverage.json
                  # Parse and verify coverage thresholds
                  node -e "
                    const fs = require('fs');
                    const coverage = JSON.parse(fs.readFileSync('coverage.json', 'utf8'));
                    const thresholds = { lines: 95, functions: 95, branches: 90, statements: 95 };
                    // Coverage check logic here
                  "
