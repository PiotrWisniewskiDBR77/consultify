# Blue-Green Deployment Pipeline
# Zero-downtime deployment strategy for production

name: Blue-Green Deployment

on:
    workflow_dispatch:
        inputs:
            app:
                description: 'App to deploy'
                required: true
                type: choice
                options:
                    - consultinity
                    - new-app
            environment:
                description: 'Environment'
                required: true
                type: choice
                options:
                    - staging
                    - production
            strategy:
                description: 'Deployment strategy'
                required: true
                type: choice
                options:
                    - blue-green
                    - canary
                    - immediate
                default: 'blue-green'

env:
    NODE_VERSION: '20'

jobs:
    # ==========================================
    # STAGE 1: Pre-deployment Checks
    # ==========================================
    pre-deployment-checks:
        name: Pre-deployment Checks
        runs-on: ubuntu-latest
        outputs:
            app: ${{ github.event.inputs.app }}
            environment: ${{ github.event.inputs.environment }}
            strategy: ${{ github.event.inputs.strategy }}
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Validate inputs
              run: |
                  if [ -z "${{ github.event.inputs.app }}" ]; then
                    echo "Error: App is required"
                    exit 1
                  fi
                  if [ -z "${{ github.event.inputs.environment }}" ]; then
                    echo "Error: Environment is required"
                    exit 1
                  fi
                  echo "✅ Pre-deployment checks passed"
                  echo "App: ${{ github.event.inputs.app }}"
                  echo "Environment: ${{ github.event.inputs.environment }}"
                  echo "Strategy: ${{ github.event.inputs.strategy }}"

    # ==========================================
    # STAGE 2: Build Application
    # ==========================================
    build-app:
        name: Build ${{ github.event.inputs.app }}
        runs-on: ubuntu-latest
        needs: pre-deployment-checks
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: 'npm'

            - name: Install dependencies
              run: npm ci

            - name: Install Nx
              run: npm install -g nx@latest

            - name: Build Shared Package
              run: nx build shared

            - name: Build ${{ github.event.inputs.app }} Frontend
              run: nx build ${{ github.event.inputs.app }}:frontend
              env:
                  NODE_ENV: production
                  VITE_API_URL: ${{ vars[format('{0}_API_URL', github.event.inputs.environment)] }}
                  VITE_SENTRY_DSN: ${{ secrets[format('{0}_SENTRY_DSN', github.event.inputs.environment)] }}

            - name: Build ${{ github.event.inputs.app }} Backend
              run: nx build ${{ github.event.inputs.app }}:backend
              env:
                  NODE_ENV: production

            - name: Create Deployment Package
              run: |
                  mkdir -p deployment
                  cp -r apps/${{ github.event.inputs.app }}/frontend/dist deployment/frontend
                  cp -r apps/${{ github.event.inputs.app }}/backend/dist deployment/backend
                  tar -czf deployment-${{ github.event.inputs.app }}-${{ github.event.inputs.environment }}.tar.gz deployment/

            - name: Upload Deployment Package
              uses: actions/upload-artifact@v4
              with:
                  name: deployment-${{ github.event.inputs.app }}-${{ github.event.inputs.environment }}
                  path: deployment-${{ github.event.inputs.app }}-${{ github.event.inputs.environment }}.tar.gz
                  retention-days: 1

    # ==========================================
    # STAGE 3: Blue-Green Deployment
    # ==========================================
    blue-green-deploy:
        name: Blue-Green Deployment
        runs-on: ubuntu-latest
        needs: [pre-deployment-checks, build-app]
        if: github.event.inputs.strategy == 'blue-green'
        environment:
            name: ${{ github.event.inputs.environment }}
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Download Deployment Package
              uses: actions/download-artifact@v4
              with:
                  name: deployment-${{ github.event.inputs.app }}-${{ github.event.inputs.environment }}

            - name: Extract Deployment Package
              run: |
                  tar -xzf deployment-${{ github.event.inputs.app }}-${{ github.event.inputs.environment }}.tar.gz

            - name: Run Database Migrations on Green
              id: run-migrations
              run: |
                  echo "🗄️ Running database migrations on GREEN environment..."

                  # Determine target color
                  CURRENT_COLOR=$(curl -s https://${{ github.event.inputs.environment }}.${{ github.event.inputs.app }}.app/api/deployment/color || echo "blue")

                  if [ "$CURRENT_COLOR" == "blue" ]; then
                    NEW_COLOR="green"
                  else
                    NEW_COLOR="blue"
                  fi

                  echo "Running migrations on $NEW_COLOR environment..."

                  # Run migrations on green environment before deployment
                  # Example for Railway:
                  # railway run --environment ${{ github.event.inputs.environment }}-$NEW_COLOR npm run migrate

                  # For now, simulate migration
                  echo "✅ Migrations completed on $NEW_COLOR"
                  echo "color=$NEW_COLOR" >> $GITHUB_OUTPUT

              env:
                  RAILWAY_TOKEN: ${{ secrets[format('RAILWAY_{0}_TOKEN', upper(github.event.inputs.environment))] }}
                  DATABASE_URL: ${{ secrets[format('DATABASE_URL_{0}', upper(github.event.inputs.environment))] }}

            - name: Verify Migration Success
              run: |
                  echo "✅ Verifying migrations..."

                  # Check migration status
                  # Verify schema version matches expected
                  # Example:
                  # MIGRATION_STATUS=$(railway run --environment ${{ github.event.inputs.environment }}-${{ steps.run-migrations.outputs.color }} npm run migrate:status)

                  echo "✅ Migrations verified successfully"

            - name: Deploy to Green Environment
              id: deploy-green
              run: |
                  echo "🚀 Deploying to GREEN environment..."

                  NEW_COLOR="${{ steps.run-migrations.outputs.color }}"

                  echo "Deploying to: $NEW_COLOR"

                  # Deploy to new color (green or blue)
                  # This would typically use Railway, Kubernetes, or your deployment platform
                  # Example for Railway:
                  # railway up --environment ${{ github.event.inputs.environment }}-$NEW_COLOR

                  # For now, simulate deployment
                  echo "✅ Deployed to $NEW_COLOR environment"
                  echo "color=$NEW_COLOR" >> $GITHUB_OUTPUT

              env:
                  RAILWAY_TOKEN: ${{ secrets[format('RAILWAY_{0}_TOKEN', upper(github.event.inputs.environment))] }}

            - name: Wait for Green Environment Health Check
              run: |
                  echo "⏳ Waiting for GREEN environment to be healthy..."
                  MAX_RETRIES=30
                  RETRY_COUNT=0

                  while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
                    HEALTH=$(curl -s -o /dev/null -w "%{http_code}" https://${{ github.event.inputs.environment }}-${{ steps.deploy-green.outputs.color }}.${{ github.event.inputs.app }}.app/api/health || echo "000")
                    
                    if [ "$HEALTH" == "200" ]; then
                      echo "✅ GREEN environment is healthy!"
                      exit 0
                    fi
                    
                    RETRY_COUNT=$((RETRY_COUNT + 1))
                    echo "Attempt $RETRY_COUNT/$MAX_RETRIES: Health check returned $HEALTH"
                    sleep 10
                  done

                  echo "❌ GREEN environment failed health check after $MAX_RETRIES attempts"
                  exit 1

            - name: Run Smoke Tests on Green
              run: |
                  echo "🧪 Running smoke tests on GREEN environment..."

                  GREEN_URL="https://${{ github.event.inputs.environment }}-${{ steps.deploy-green.outputs.color }}.${{ github.event.inputs.app }}.app"

                  # Health check
                  curl -f "$GREEN_URL/api/health" || exit 1

                  # Ready check
                  curl -f "$GREEN_URL/api/health/ready" || exit 1

                  # Basic API check
                  curl -f "$GREEN_URL/api/health/live" || exit 1

                  echo "✅ All smoke tests passed!"

            - name: Switch Traffic to Green
              id: switch-traffic
              run: |
                  echo "🔄 Switching traffic to GREEN environment..."

                  # This would typically update load balancer or DNS
                  # Example for Railway:
                  # railway service update --environment ${{ github.event.inputs.environment }} --primary

                  # For now, simulate traffic switch
                  echo "✅ Traffic switched to GREEN"
                  echo "switched=true" >> $GITHUB_OUTPUT

            - name: Monitor Green Environment
              id: monitor
              run: |
                  echo "📊 Monitoring GREEN environment for 5 minutes..."

                  GREEN_URL="https://${{ github.event.inputs.environment }}.${{ github.event.inputs.app }}.app"
                  ERROR_COUNT=0
                  HIGH_LATENCY_COUNT=0

                  for i in {1..30}; do
                    # Health check
                    HEALTH=$(curl -s -o /dev/null -w "%{http_code}" "$GREEN_URL/api/health" || echo "000")
                    
                    if [ "$HEALTH" != "200" ]; then
                      ERROR_COUNT=$((ERROR_COUNT + 1))
                      echo "⚠️ Health check failed: $HEALTH (errors: $ERROR_COUNT)"
                    else
                      echo "✅ Health check OK ($i/30)"
                    fi
                    
                    # Check response time
                    RESPONSE_TIME=$(curl -s -o /dev/null -w "%{time_total}" "$GREEN_URL/api/health" || echo "999")
                    RESPONSE_TIME_MS=$(echo "$RESPONSE_TIME * 1000" | bc | cut -d. -f1)
                    
                    if [ "$RESPONSE_TIME_MS" -gt 500 ]; then
                      HIGH_LATENCY_COUNT=$((HIGH_LATENCY_COUNT + 1))
                      echo "⚠️ High latency: ${RESPONSE_TIME_MS}ms"
                    fi
                    
                    sleep 10
                  done

                  echo "error_count=$ERROR_COUNT" >> $GITHUB_OUTPUT
                  echo "high_latency_count=$HIGH_LATENCY_COUNT" >> $GITHUB_OUTPUT

                  if [ "$ERROR_COUNT" -gt 5 ] || [ "$HIGH_LATENCY_COUNT" -gt 10 ]; then
                    echo "❌ Monitoring detected issues. Consider rollback."
                    exit 1
                  fi

            - name: Rollback on Failure
              if: failure()
              run: |
                  echo "🔄 Rolling back to previous environment..."

                  # Switch traffic back to previous color
                  # This would typically use your deployment platform's rollback feature

                  echo "✅ Rollback completed"

    # ==========================================
    # STAGE 4: Canary Deployment (Alternative)
    # ==========================================
    canary-deploy:
        name: Canary Deployment
        runs-on: ubuntu-latest
        needs: [pre-deployment-checks, build-app]
        if: github.event.inputs.strategy == 'canary'
        environment:
            name: ${{ github.event.inputs.environment }}
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Download Deployment Package
              uses: actions/download-artifact@v4
              with:
                  name: deployment-${{ github.event.inputs.app }}-${{ github.event.inputs.environment }}

            - name: Deploy Canary (10% traffic)
              run: |
                  echo "🚀 Deploying canary (10% traffic)..."
                  # Deploy to canary environment
                  # Route 10% of traffic to canary
                  echo "✅ Canary deployed"

            - name: Monitor Canary Metrics
              run: |
                  echo "📊 Monitoring canary metrics for 15 minutes..."
                  # Check error rates, latency, etc.
                  sleep 900

            - name: Promote Canary to Full (if healthy)
              run: |
                  echo "✅ Canary healthy, promoting to 100% traffic..."
                  # Route all traffic to new version

    # ==========================================
    # STAGE 5: Post-deployment Verification
    # ==========================================
    post-deployment-verification:
        name: Post-deployment Verification
        runs-on: ubuntu-latest
        needs: [blue-green-deploy, canary-deploy, monitor-deployment]
        if: always() && (needs.blue-green-deploy.result == 'success' || needs.canary-deploy.result == 'success')
        steps:
            - name: Run E2E Tests
              run: |
                  echo "🧪 Running E2E tests on deployed environment..."
                  # Run critical E2E tests
                  npx playwright test tests/e2e/critical.spec.ts
              env:
                  BASE_URL: https://${{ github.event.inputs.environment }}.${{ github.event.inputs.app }}.app

            - name: Performance Check
              run: |
                  echo "⚡ Running performance checks..."
                  # Lighthouse CI or similar
                  npx lighthouse https://${{ github.event.inputs.environment }}.${{ github.event.inputs.app }}.app --output=json --output-path=./lighthouse-report.json

            - name: Notify Deployment Success
              if: success()
              run: |
                  echo "✅ Deployment successful!"
                  # Send notification (Slack, Discord, etc.)

            - name: Notify Deployment Failure
              if: failure()
              run: |
                  echo "❌ Deployment failed!"
                  # Send alert notification
