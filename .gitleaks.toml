title = "Consultify exact-SHA and history secret gate"

[extend]
useDefault = true
# The upstream generic rule treats ordinary domain identifiers such as
# `key_result_id`, translation `labelKey` and Polish prose as credentials.
# Replace it below with a stricter assignment rule; OAuth client IDs are public
# identifiers and are not credentials.
disabledRules = ["generic-api-key", "linkedin-client-id"]

[[rules]]
id = "consultify-quoted-secret-assignment"
description = "High-entropy quoted literal assigned to a security-sensitive name"
regex = '''(?i)(?:api[_-]?key|api[_-]?secret|client[_-]?secret|jwt[_-]?secret|encryption[_-]?(?:key|secret)|private[_-]?key|access[_-]?token|refresh[_-]?token|password)\s*[=:]\s*["']([A-Za-z0-9+/=_\-.!]{20,})["']'''
secretGroup = 1
entropy = 4.0
keywords = ["api", "secret", "token", "password", "key"]

[[rules]]
id = "consultify-env-secret-assignment"
description = "High-entropy unquoted credential in env syntax"
regex = '''(?im)^[ \t]*(?:export[ \t]+)?(?:[A-Z0-9_]*(?:API_KEY|API_SECRET|CLIENT_SECRET|JWT_SECRET|ENCRYPTION_KEY|PRIVATE_KEY|ACCESS_TOKEN|REFRESH_TOKEN|PASSWORD))[ \t]*=[ \t]*([A-Za-z0-9+/=_\-.!]{20,})[ \t]*$'''
secretGroup = 1
entropy = 4.0
keywords = ["API_KEY", "SECRET", "TOKEN", "PASSWORD", "KEY"]

[[allowlists]]
description = "Vendored dependencies are scanned by their publishers, not as first-party source"
paths = ['''(^|/)node_modules/''']

[[allowlists]]
description = "Explicit placeholders and local-only development defaults are not credentials"
regexTarget = "match"
regexes = [
  '''(?i)(?:secret|password|token|key)\s*[=:]\s*["'](?:test|testing|fixture|fake|dummy|local|dev|development)[-_][A-Za-z0-9+/=_\-.!]{12,}["']''',
  '''consultify-acceptance-harness-pinned-test-secret-fixed-32chars-min''',
  '''CaseWorkspacePolicy!2026''',
  '''Mfa-Lifecycle-Password1!''',
  '''M27k-Sup3radmin-Test-Password!''',
  '''oauth-connect-realdb-secret-minimum-32-characters-long''',
  '''eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9\.eyJzdWIiOiIxMjM0NTY3ODkwIiwibmFtZSI6IkpvaG4gRG9lIiwiaWF0IjoxNTE2MjM5MDIyfQ\.SflKxwRJSMeKKF2QT4fwpMeJf36POk6yJV_adQssw5c''',
  '''(?i)[=:][ \t]*["']?(?:change[-_]?(?:me|this)|replace[-_]?me|your[-_][A-Z0-9_]+|placeholder|dummy|fake|test[-_]?secret|dev[-_](?:secret|token|key))(?:["']|[ \t]*$)''',
  '''(?i)Bearer\s+(?:\$\{?[A-Z_][A-Z0-9_]*\}?|<[^>]+>)'''
  ,'''(?i)Bearer\s+(?:YOUR_API_KEY|TWOJ_KLUCZ_API|admin-token|pm-token|member-token|user-token)'''
  ,"(?i)ClientSecret\\s*:\\s*'[A-Z][A-Z0-9_]{5,}'"
]
